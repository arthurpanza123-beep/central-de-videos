  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const STORAGE_KEY = "producao_videos_sonora_v11";

    // Web Audio API Sound Effects
    function playSound(type = "click") {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        if (ctx.state === "suspended") {
          ctx.resume();
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === "click") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(640, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.035);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          osc.start(now);
          osc.stop(now + 0.035);
        } else if (type === "toggle") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(380, now);
          osc.frequency.exponentialRampToValueAtTime(760, now + 0.05);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === "success") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.06);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === "delete") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {}
    }

    const WEEKDAYS = [
      { label: "Seg", day: 1, name: "Segunda" },
      { label: "Ter", day: 2, name: "Terça" },
      { label: "Qua", day: 3, name: "Quarta" },
      { label: "Qui", day: 4, name: "Quinta" },
      { label: "Sex", day: 5, name: "Sexta" },
      { label: "Sáb", day: 6, name: "Sábado" },
      { label: "Dom", day: 0, name: "Domingo" },
    ];
    const POSTING_DAYS = new Set([3, 4, 6, 0]); // quarta, quinta, sábado e domingo
    const PRODUCTION_STEPS = [
      ["nandoSim", "Nando"], ["dudaSim", "Duda"], ["sonoraSim", "Sonora"],
      ["legendasSim", "Legendas"], ["tvSim", "Vídeos TV"],
      ["coloracaoSim", "Coloração"], ["finalizacaoSim", "Finalização"]
    ];

    function getWeekMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      date.setDate(date.getDate() + diff);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function getWeekOffsetFromDate(dateStr) {
      if (!dateStr || typeof dateStr !== "string") return 0;
      const parts = dateStr.split("-").map(Number);
      if (parts.length < 3 || isNaN(parts[0])) return 0;
      const targetDate = new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0, 0);
      const videoMonday = getWeekMonday(targetDate);
      const currentMonday = getWeekMonday(new Date());
      const diffMs = videoMonday.getTime() - currentMonday.getTime();
      return Math.round(diffMs / (7 * 24 * 60 * 60 * 1000));
    }

    function getVideoScheduledDate(video) {
      if (!video) return new Date().toISOString().slice(0, 10);
      if (video.scheduledDate) return video.scheduledDate;
      if (video.posted && video.postedAt) {
        const d = new Date(video.postedAt);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }
      const safeOffset = Number(video.weekOffset) || 0;
      const now = new Date();
      const currentMonday = getWeekMonday(now);
      const targetMonday = new Date(currentMonday);
      targetMonday.setDate(currentMonday.getDate() + safeOffset * 7);
      const targetWeekday = typeof video.weekday === "number" ? video.weekday : 4;
      const dayOffsetFromMonday = targetWeekday === 0 ? 6 : targetWeekday - 1;
      const targetDate = new Date(targetMonday);
      targetDate.setDate(targetMonday.getDate() + dayOffsetFromMonday);
      const y = targetDate.getFullYear();
      const m = String(targetDate.getMonth() + 1).padStart(2, "0");
      const day = String(targetDate.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function getUpcomingPostingDates(count = 6) {
      const result = [];
      const cur = new Date();
      cur.setHours(0, 0, 0, 0);
      for (let i = 0; i < 30 && result.length < count; i++) {
        const d = new Date(cur);
        d.setDate(cur.getDate() + i);
        const dayOfWeek = d.getDay();
        if (POSTING_DAYS.has(dayOfWeek)) {
          const wObj = WEEKDAYS.find((w) => w.day === dayOfWeek) || WEEKDAYS[0];
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const dayNum = String(d.getDate()).padStart(2, "0");
          const dateStr = `${y}-${m}-${dayNum}`;
          const formatted = d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
          result.push({
            dateStr,
            label: `${wObj.label} ${formatted}`,
            weekdayName: wObj.name,
            isToday: i === 0,
            isTomorrow: i === 1,
          });
        }
      }
      return result;
    }

    function calculatePostDayInfo(videoOrWeekday, weekOffset = 0, postedAt = null) {
      let targetDate;
      let isPosted = false;

      if (typeof videoOrWeekday === "object" && videoOrWeekday !== null) {
        const v = videoOrWeekday;
        if (v.posted && v.postedAt) {
          targetDate = new Date(v.postedAt);
          isPosted = true;
        } else {
          const dateStr = getVideoScheduledDate(v);
          const parts = dateStr.split("-").map(Number);
          targetDate = new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0, 0);
        }
      } else if (postedAt) {
        targetDate = new Date(postedAt);
        isPosted = true;
      } else {
        const targetWeekday = Number(videoOrWeekday) || 0;
        const safeOffset = Math.max(-52, Math.min(52, Number(weekOffset) || 0));
        const now = new Date();
        const currentMonday = getWeekMonday(now);
        const targetMonday = new Date(currentMonday);
        targetMonday.setDate(currentMonday.getDate() + safeOffset * 7);
        const dayOffsetFromMonday = targetWeekday === 0 ? 6 : targetWeekday - 1;
        targetDate = new Date(targetMonday);
        targetDate.setDate(targetMonday.getDate() + dayOffsetFromMonday);
        targetDate.setHours(0, 0, 0, 0);
      }

      const weekdayObj = WEEKDAYS.find((w) => w.day === targetDate.getDay()) || WEEKDAYS[0];
      const formattedDate = targetDate.toLocaleDateString("pt-BR", {
        day: "2-digit",
        month: "2-digit",
      });
      const y = targetDate.getFullYear();
      const m = String(targetDate.getMonth() + 1).padStart(2, "0");
      const day = String(targetDate.getDate()).padStart(2, "0");
      const fullDateStr = `${y}-${m}-${day}`;

      const now = new Date();
      const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
      const diffTime = targetDate.getTime() - todayMidnight.getTime();
      const daysUntil = Math.round(diffTime / (24 * 60 * 60 * 1000));

      let countdownText = "";
      let badgeColor = "bg-zinc-900 text-zinc-300 border-zinc-800";

      if (isPosted) {
        countdownText = "Postado";
        badgeColor = "bg-zinc-900 text-zinc-300 border-zinc-800";
      } else if (daysUntil === 0) {
        countdownText = "Posta Hoje! 🔥";
        badgeColor = "bg-red-950/90 text-red-400 border-red-700 animate-pulse";
      } else if (daysUntil === 1) {
        countdownText = "Amanhã ⚡";
        badgeColor = "bg-amber-950/90 text-amber-300 border-amber-700";
      } else if (daysUntil > 1) {
        countdownText = `Faltam ${daysUntil} dias`;
        badgeColor = "bg-zinc-900 text-zinc-300 border-zinc-800";
      } else {
        countdownText = daysUntil === -1 ? "Ontem" : `Passou há ${Math.abs(daysUntil)} dias`;
        badgeColor = "bg-zinc-900 text-zinc-400 border-zinc-800";
      }

      const offset = getWeekOffsetFromDate(fullDateStr);

      return {
        dateStr: fullDateStr,
        displayDay: weekdayObj.name,
        weekdayName: weekdayObj.name,
        formattedDate,
        countdownText,
        daysUntil,
        weekOffset: offset,
        targetDate,
        timestamp: targetDate.getTime(),
        badgeColor,
      };
    }

    function getVideoWeekOffset(video) {
      if (video.posted && video.postedAt) {
        const postMonday = getWeekMonday(video.postedAt);
        const currentMonday = getWeekMonday(new Date());
        const diffDays = Math.round((postMonday.getTime() - currentMonday.getTime()) / (24 * 60 * 60 * 1000));
        return Math.round(diffDays / 7);
      }
      const dateStr = getVideoScheduledDate(video);
      return getWeekOffsetFromDate(dateStr);
    }

    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            const maxW = 960;
            let width = img.width;
            let height = img.height;

            if (width > maxW) {
              height = Math.round((height * maxW) / width);
              width = maxW;
            }

            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            const compressed = canvas.toDataURL("image/jpeg", 0.82);
            resolve(compressed);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

        const GIST_ID = "9dfe02c841f9bb12160cdf64f8d6db05";
    const CLOUD_SESSION_KEY = "central_studio_cloud_session";
    const PENDING_KEY = STORAGE_KEY + "_pending";
    function getCloudToken() {
      try { return sessionStorage.getItem(CLOUD_SESSION_KEY) || ""; } catch { return ""; }
    }
    function cloudHeaders() {
      const token = getCloudToken();
      return { "Accept": "application/vnd.github.v3+json", ...(token ? {"Authorization": "Bearer " + token} : {}) };
    }


    function localDateKey(date = new Date()) {
      return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
    }
    function parseDateKey(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) return null;
      const [y, m, d] = value.split("-").map(Number);
      const date = new Date(y, m - 1, d, 12);
      return localDateKey(date) === value ? date : null;
    }
    function nextPostingDate(value) {
      const date = parseDateKey(value);
      if (!date) throw new Error("Data inválida");
      do { date.setDate(date.getDate() + 1); } while (!POSTING_DAYS.has(date.getDay()));
      return localDateKey(date);
    }
    function withScheduledDate(video, dateStr) {
      return { ...video, scheduledDate: dateStr, weekday: parseDateKey(dateStr).getDay(),
        weekOffset: getWeekOffsetFromDate(dateStr), isNextWeek: undefined };
    }
    // Insert the selected video first; keep the remaining queue in its original order.
    // Only a collision starts a cascade. Posted videos and dates before it stay untouched.
    function scheduleVideo(items, selected, dateStr) {
      const date = parseDateKey(dateStr);
      if (!date || !POSTING_DAYS.has(date.getDay()) || dateStr < localDateKey()) {
        throw new Error("Escolha uma quarta, quinta, sábado ou domingo a partir de hoje.");
      }
      const others = items.filter(v => v.id !== selected.id);
      const queue = others.filter(v => !v.posted && getVideoScheduledDate(v) >= dateStr)
        .map((v, index) => ({ v, index, date: getVideoScheduledDate(v) }))
        .sort((a, b) => a.date.localeCompare(b.date) || a.index - b.index);
      const updates = new Map([[selected.id, withScheduledDate(selected, dateStr)]]);
      const moves = [];
      let cursor = dateStr;
      for (const {v, date: original} of queue) {
        if (original <= cursor) {
          const target = nextPostingDate(cursor);
          updates.set(v.id, withScheduledDate(v, target));
          moves.push({ id: v.id, title: v.titles?.find(Boolean) || "Vídeo sem título", from: original, to: target });
          cursor = target;
        } else {
          break;
        }
      }
      const result = items.map(v => updates.get(v.id) || v);
      if (!items.some(v => v.id === selected.id)) result.unshift(updates.get(selected.id));
      return { videos: result, moves };
    }
    function shortDate(value) {
      return parseDateKey(value)?.toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"}) || value;
    }

    function PostingCalendar({ videos, video, onSchedule, onCancel, isNew = false }) {
      const today = localDateKey();
      const initial = getVideoScheduledDate(video);
      const [selected, setSelected] = useState(initial >= today ? initial : "");
      const [month, setMonth] = useState(() => {
        const date = parseDateKey(initial >= today ? initial : today);
        return new Date(date.getFullYear(), date.getMonth(), 1, 12);
      });
      const [error, setError] = useState("");
      const dates = [];
      const firstMonday = getWeekMonday(month);
      for (let week = 0; week < 6; week++) {
        const row = [3, 4, 6, 0].map(day => {
          const date = new Date(firstMonday);
          date.setDate(firstMonday.getDate() + week * 7 + (day === 0 ? 6 : day - 1));
          return date.getMonth() === month.getMonth() ? date : null;
        });
        if (row.some(Boolean)) dates.push(...row);
      }
      const occupied = new Map();
      videos.filter(v => !v.posted && v.id !== video.id).forEach(v => {
        const key = getVideoScheduledDate(v);
        const list = occupied.get(key) || [];
        occupied.set(key, [...list, v]);
      });
      let preview = null;
      try { if (selected) preview = scheduleVideo(videos, video, selected); } catch (e) {}
      const currentMonth = month.getFullYear() === new Date().getFullYear() && month.getMonth() === new Date().getMonth();
      function changeMonth(delta) { setMonth(new Date(month.getFullYear(), month.getMonth() + delta, 1, 12)); }
      return (
        <div className="posting-calendar">
          <div className="calendar-heading">
            <div><h3>{isNew ? "Agendar novo vídeo" : "Data de publicação"}</h3><p>Quarta, quinta, sábado e domingo</p></div>
          </div>
          <div className="calendar-month">
            <button type="button" aria-label="Mês anterior" disabled={currentMonth} onClick={() => changeMonth(-1)}>‹</button>
            <strong aria-live="polite">{month.toLocaleDateString("pt-BR", {month:"long", year:"numeric"})}</strong>
            <button type="button" aria-label="Próximo mês" onClick={() => changeMonth(1)}>›</button>
          </div>
          <div className="calendar-legend"><span className="legend-free">● Livre</span><span className="legend-busy">● Ocupado</span><span>✓ Selecionado</span></div>
          <div className="calendar-days">
            {["Qua", "Qui", "Sáb", "Dom"].map(label => <span key={label} className="calendar-weekday">{label}</span>)}
            {dates.map((date, index) => {
              if (!date) return <span key={"empty-" + index} aria-hidden="true" />;
              const key = localDateKey(date);
              const busy = occupied.get(key);
              const past = key < today;
              const chosen = selected === key;
              const title = busy?.map(v => v.titles?.find(Boolean) || "Vídeo sem título").join("; ");
              return <button key={key} type="button" disabled={past} aria-pressed={chosen}
                aria-label={date.toLocaleDateString("pt-BR", {weekday:"long", day:"numeric", month:"long"}) + (past ? ", indisponível" : busy ? ", ocupado: " + title + ". Selecionar e remanejar." : ", livre")}
                title={busy ? title : "Data livre"}
                className={"calendar-date " + (busy ? "busy" : "free") + (chosen ? " selected" : "")}
                onClick={() => {setSelected(key); setError("");}}>
                <strong>{date.getDate()}{chosen && <span className="date-check">✓</span>}</strong>
                <small>{past ? "Passou" : busy ? "Ocupado" : "Livre"}</small>
              </button>;
            })}
          </div>
          <div className="schedule-preview" aria-live="polite">
            {preview ? <><strong>Seu vídeo fica em {shortDate(selected)}</strong>
              {preview.moves.length > 0 ? <>
                <p>Os vídeos abaixo avançam automaticamente, na mesma ordem:</p>
                <ul>{preview.moves.map(move => <li key={move.id}><span>{move.title}</span><b>{shortDate(move.from)} → {shortDate(move.to)}</b></li>)}</ul>
              </> : <p>Nenhum outro vídeo será remanejado.</p>}
            </> : <p>Selecione uma data disponível ou ocupada para agendar.</p>}
          </div>
          {error && <p role="alert">{error}</p>}
          <div className="calendar-actions">
            {onCancel && <button type="button" className="schedule-cancel" onClick={onCancel}>Cancelar</button>}
            <button type="button" className="schedule-confirm" disabled={!preview}
              onClick={() => {try {onSchedule(selected);} catch(e) {setError(e.message);}}}>
              {isNew ? "Criar e agendar vídeo" : preview?.moves.length ? "Salvar e remanejar" : "Salvar data"}
            </button>
          </div>
        </div>
      );
    }

    function App() {
      const [videos, setVideos] = useState([]);
      const [activeTab, setActiveTab] = useState("producao");
      const [cloudAuthOpen, setCloudAuthOpen] = useState(false);
      const [cloudAuthError, setCloudAuthError] = useState("");
      const [newVideo, setNewVideo] = useState(null);
      const [scheduleNotice, setScheduleNotice] = useState("");
      const [postingId, setPostingId] = useState(null);
      const [expandedDetails, setExpandedDetails] = useState({});
      const [loaded, setLoaded] = useState(false);
      const [cloudStatus, setCloudStatus] = useState("syncing"); // 'syncing', 'synced', 'saving', 'offline'
      const saveTimerRef = useRef(null);
      const isSyncingRef = useRef(false);
      const pendingSaveRef = useRef(false);
      const saveRevisionRef = useRef(0);
      const skipNextSaveRef = useRef(true);
      const loadedRef = useRef(loaded);
      const videosRef = useRef(videos);
      videosRef.current = videos;
      loadedRef.current = loaded;

      useEffect(() => {
        if (!newVideo) return;
        const previous = document.activeElement;
        const oldOverflow = document.body.style.overflow;
        document.body.style.overflow = "hidden";
        function trapFocus(event) {
          if (event.key !== "Tab") return;
          const dialog = document.querySelector(".schedule-dialog");
          const controls = dialog ? Array.from(dialog.querySelectorAll('button:not([disabled]), [tabindex="0"]')) : [];
          const first = controls[0], last = controls[controls.length - 1];
          if (event.shiftKey && document.activeElement === first) {event.preventDefault(); last?.focus();}
          else if (!event.shiftKey && document.activeElement === last) {event.preventDefault(); first?.focus();}
        }
        document.addEventListener("keydown", trapFocus);
        return () => {
          document.body.style.overflow = oldOverflow;
          document.removeEventListener("keydown", trapFocus);
          previous?.focus();
        };
      }, [newVideo]);

      // Sincronizar da Nuvem
      const syncFromCloud = useCallback(async (isInitial = false) => {
        if (isSyncingRef.current) return;
        if (loadedRef.current && pendingSaveRef.current) {
          setCloudStatus("saving");
          return;
        }
        isSyncingRef.current = true;
        setCloudStatus("syncing");

        try {
          // 1. Tenta buscar do Gist na nuvem
          const res = await fetch("https://api.github.com/gists/" + GIST_ID + "?t=" + Date.now(), {
            headers: cloudHeaders()
          });

          if (res.ok) {
            const gist = await res.json();
            if (gist.files && gist.files["videos.json"] && gist.files["videos.json"].content) {
              const cloudFile = gist.files["videos.json"];
              // A API do Gist devolve `content` cortado quando o arquivo passa
              // de 1 MB. Nesse caso, baixa o arquivo completo pelo raw_url antes
              // de converter o JSON — assim PC e celular recebem o mesmo estado.
              let cloudContent = cloudFile.content;
              if (cloudFile.truncated && cloudFile.raw_url) {
                // O raw_url já é o link seguro do Gist. Não mandamos o token
                // aqui porque o domínio de arquivos não aceita esse cabeçalho
                // em requisições do navegador (CORS).
                const rawRes = await fetch(cloudFile.raw_url + "?t=" + Date.now());
                if (!rawRes.ok) throw new Error("Não foi possível baixar os dados completos da nuvem.");
                cloudContent = await rawRes.text();
              }
              const remoteVideos = JSON.parse(cloudContent);
              if (Array.isArray(remoteVideos) && remoteVideos.length > 0) {
                // Compara se mudou antes de atualizar
                const currentStr = JSON.stringify(videosRef.current);
                const remoteStr = JSON.stringify(remoteVideos);
                if (currentStr !== remoteStr) {
                  if (loadedRef.current) skipNextSaveRef.current = true;
                  setVideos(remoteVideos);
                  try {
                    localStorage.setItem(STORAGE_KEY, remoteStr);
                  } catch (e) {}
                }
                setCloudStatus(getCloudToken() ? "synced" : "readonly");
                isSyncingRef.current = false;
                return;
              }
            }
          }

          // 2. Fallback: Se falhou Gist, tenta buscar videos.json estático do próprio site
          const staticRes = await fetch("./videos.json?t=" + Date.now());
          if (staticRes.ok) {
            const staticVideos = await staticRes.json();
            if (Array.isArray(staticVideos) && staticVideos.length > 0) {
              const currentStr = JSON.stringify(videosRef.current);
              const staticStr = JSON.stringify(staticVideos);
              if (currentStr !== staticStr) {
                if (loadedRef.current) skipNextSaveRef.current = true;
                setVideos(staticVideos);
                try {
                  localStorage.setItem(STORAGE_KEY, staticStr);
                } catch (e) {}
              }
              setCloudStatus(getCloudToken() ? "synced" : "readonly");
              isSyncingRef.current = false;
              return;
            }
          }
        } catch (err) {
          console.warn("Aviso ao sincronizar da nuvem:", err);
        }

        setCloudStatus("offline");
        isSyncingRef.current = false;
      }, []);

      // Salvar na Nuvem (PATCH no Gist)
      const saveToCloud = useCallback(async (currentVideos, revision) => {
        if (!getCloudToken()) {
          setCloudStatus("local");
          return;
        }
        setCloudStatus("saving");
        try {
          const res = await fetch("https://api.github.com/gists/" + GIST_ID, {
            method: "PATCH",
            headers: {...cloudHeaders(), "Content-Type": "application/json"},
            body: JSON.stringify({
              files: {
                "videos.json": { content: JSON.stringify(currentVideos) }
              }
            })
          });
          if (res.ok) {
            if (revision === saveRevisionRef.current) {
              pendingSaveRef.current = false;
              try { localStorage.removeItem(PENDING_KEY); } catch {}
              setCloudStatus("synced");
            }
          } else {
            console.error("Erro na resposta da nuvem:", res.status);
            if (revision === saveRevisionRef.current) {
              setCloudStatus("offline");
            }
          }
        } catch (err) {
          console.error("Erro de conexão ao salvar na nuvem:", err);
          if (revision === saveRevisionRef.current) {
            setCloudStatus("offline");
          }
        }
      }, []);

      // Carregamento inicial (Cache local imediato + Busca nuvem)
      useEffect(() => {
        let hasLocal = false;
        try {
          const saved =
            localStorage.getItem(STORAGE_KEY) ||
            localStorage.getItem("producao_videos_sim_nao_v10") ||
            localStorage.getItem("producao_videos_v9");

          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setVideos(parsed);
              hasLocal = true;
            }
          }
        } catch (e) {
          console.error("Erro ao ler storage local", e);
        }

        if (!hasLocal) setVideos(getInitialVideos());

        // A primeira leitura acontece antes de liberar qualquer gravação. Isso
        // impede que a abertura da página salve um estado vazio na nuvem.
        (async () => {
          const hasPending = hasLocal && localStorage.getItem(PENDING_KEY) === "1";
          pendingSaveRef.current = hasPending;
          if (hasPending) setCloudStatus(getCloudToken() ? "offline" : "local");
          else await syncFromCloud(true);
          skipNextSaveRef.current = true;
          setLoaded(true);
        })();
      }, [syncFromCloud]);

      // Auto-save local imediato + agendamento de upload para a nuvem
      useEffect(() => {
        if (!loaded) return;
        if (skipNextSaveRef.current) {
          skipNextSaveRef.current = false;
          return;
        }
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
        } catch (e) {
          console.error("Erro ao salvar localmente", e);
        }

        // Debounce de 1.2s para enviar à nuvem (evita excesso de requests enquanto digita)
        if (saveTimerRef.current) {
          clearTimeout(saveTimerRef.current);
        }
        const revision = ++saveRevisionRef.current;
        pendingSaveRef.current = true;
        try { localStorage.setItem(PENDING_KEY, "1"); } catch {}
        setCloudStatus(getCloudToken() ? "saving" : "local");
        saveTimerRef.current = setTimeout(() => {
          saveToCloud(videos, revision);
        }, 1200);

        return () => {
          if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        };
      }, [videos, loaded, saveToCloud]);

      async function connectCloud(event) {
        event.preventDefault();
        const token = new FormData(event.currentTarget).get("cloudToken")?.trim();
        if (!token) return;
        setCloudAuthError("");
        try {
          const response = await fetch("https://api.github.com/gists/" + GIST_ID, {
            headers: {"Accept": "application/vnd.github.v3+json", "Authorization": "Bearer " + token}
          });
          if (!response.ok) throw new Error("Não foi possível conectar. Confira o token e a permissão de Gist.");
          sessionStorage.setItem(CLOUD_SESSION_KEY, token);
          setCloudAuthOpen(false);
          if (pendingSaveRef.current) await saveToCloud(videosRef.current, saveRevisionRef.current);
          else await syncFromCloud();
        } catch (error) { setCloudAuthError(error.message); }
      }

      function addNewVideo() {
        playSound("click");
        const nextDates = getUpcomingPostingDates(1);
        const defaultDate = nextDates.length > 0 ? nextDates[0].dateStr : new Date().toISOString().slice(0, 10);
        const parts = defaultDate.split("-").map(Number);
        const dt = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
        const newV = {
          id: "v-" + Date.now(),
          scheduledDate: defaultDate,
          weekday: dt.getDay(),
          weekOffset: getWeekOffsetFromDate(defaultDate),
          posted: false,
          nandoSim: false,
          dudaSim: false,
          sonoraSim: false,
          legendasSim: false, tvSim: false, coloracaoSim: false, finalizacaoSim: false,
          thumbs: ["", "", ""],
          titles: ["", "", ""],
        };
        setNewVideo(newV);
      }

      function handleDateChange(id, dateStr) {
        const selected = newVideo?.id === id ? newVideo : videosRef.current.find(v => v.id === id);
        if (!selected) return;
        const result = scheduleVideo(videosRef.current, selected, dateStr);
        playSound("success");
        setVideos(result.videos);
        setScheduleNotice("Vídeo agendado para " + shortDate(dateStr) + (result.moves.length ? ". " + result.moves.length + " vídeo(s) remanejado(s)." : "."));
        setNewVideo(null);
        setActiveTab("producao");
      }

      function toggleDetails(id) {
        playSound("click");
        setExpandedDetails((prev) => ({ ...prev, [id]: !prev[id] }));
      }

      function toggleProcess(id, key) {
        playSound("toggle");
        setVideos((prev) =>
          prev.map((v) => (v.id === id ? { ...v, [key]: !v[key] } : v))
        );
      }

      async function updateThumb(id, index, file) {
        try {
          const compressed = await compressImage(file);
          playSound("click");
          setVideos((prev) =>
            prev.map((v) => {
              if (v.id !== id) return v;
              const newThumbs = [...v.thumbs];
              newThumbs[index] = compressed;
              return { ...v, thumbs: newThumbs };
            })
          );
        } catch (e) {
          console.error("Erro ao processar imagem", e);
        }
      }

      function removeThumb(id, index) {
        playSound("delete");
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            const newThumbs = [...v.thumbs];
            newThumbs[index] = "";
            return { ...v, thumbs: newThumbs };
          })
        );
      }

      function updateTitle(id, index, text) {
        const nextText = String(text ?? "").slice(0, 100);
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            const newTitles = [...v.titles];
            newTitles[index] = nextText;
            const nextVideo = { ...v, titles: newTitles };
            return nextVideo;
          })
        );
      }

      function markAsPosted(id) {
        playSound("success");
        setPostingId(id);
        setTimeout(() => {
          setVideos((prev) =>
            prev.map((v) => (v.id === id ? { ...v, posted: true, postedAt: Date.now() } : v))
          );
          setPostingId(null);
        }, 450);
      }

      function restoreToProduction(id) {
        playSound("click");
        setVideos((prev) =>
          scheduleVideo(prev, { ...prev.find(v => v.id === id), posted: false }, getUpcomingPostingDates(1)[0].dateStr).videos
        );
      }

      function deleteVideo(id) {
        if (window.confirm("Deseja realmente excluir este projeto de vídeo?")) {
          playSound("delete");
          setVideos((prev) => prev.filter((v) => v.id !== id));
        }
      }

      function exportBackup() {
        playSound("success");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(videos, null, 2));
        const a = document.createElement("a");
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `backup_videos_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      function importBackup(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) {
              playSound("success");
              setVideos(parsed);
              alert("Backup restaurado com sucesso! " + parsed.length + " projetos carregados.");
            } else {
              alert("Arquivo de backup inválido.");
            }
          } catch (err) {
            alert("Erro ao ler o arquivo de backup.");
          }
        };
        reader.readAsText(file);
      }

      // Os vídeos em produção são organizados por data de publicação:
      // a data mais próxima aparece automaticamente no topo (ex: dia 18 antes do dia 22).
      const activeVideos = [...videos]
        .filter((v) => !v.posted)
        .sort((a, b) => {
          const infoA = calculatePostDayInfo(a);
          const infoB = calculatePostDayInfo(b);
          return (infoA.timestamp || 0) - (infoB.timestamp || 0);
        });

      const postedVideos = [...videos]
        .filter((v) => v.posted)
        .sort((a, b) => (b.postedAt || 0) - (a.postedAt || 0));

      const displayedVideos = activeTab === "producao" ? activeVideos : postedVideos;

      return (
        <div className="min-h-screen bg-[#000000] text-zinc-100 flex flex-col font-sans">
          {/* HEADER MINIMALISTA NO TOPO (ABINHA PEQUENA + TELONA CHEIA) */}
          <header className="sticky top-0 z-30 bg-[#050505]/95 backdrop-blur-md border-b border-[#141414] px-4 sm:px-6 lg:px-8 py-2.5">
            <div className="flex items-center justify-between gap-3 max-w-[1920px] mx-auto flex-wrap">
              {/* Left: Abinhas (Em Produção / Postados) */}
              <nav className="flex items-center gap-1 bg-[#0a0a0a] p-1 rounded-lg border border-[#1a1a1a]">

                <button
                  type="button"
                  onClick={() => {
                    playSound("click");
                    setActiveTab("producao");
                  }}
                  className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-md text-xs font-black transition active:scale-95 ${
                    activeTab === "producao"
                      ? "bg-[#ff0000] text-white shadow-md shadow-red-600/30"
                      : "text-zinc-400 hover:text-white hover:bg-[#121212]"
                  }`}
                >
                  <span>🎬</span>
                  <span>Em Produção</span>
                  <span
                    className={`text-[10px] px-1.5 py-0.2 rounded-full font-black ${
                      activeTab === "producao"
                        ? "bg-white/25 text-white"
                        : "bg-[#181818] text-zinc-400"
                    }`}
                  >
                    {activeVideos.length}
                  </span>
                </button>

                <button
                  type="button"
                  onClick={() => {
                    playSound("click");
                    setActiveTab("postados");
                  }}
                  className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-md text-xs font-black transition active:scale-95 ${
                    activeTab === "postados"
                      ? "bg-[#ff0000] text-white shadow-md shadow-red-600/30"
                      : "text-zinc-400 hover:text-white hover:bg-[#121212]"
                  }`}
                >
                  <span>✓</span>
                  <span>Postados</span>
                  <span
                    className={`text-[10px] px-1.5 py-0.2 rounded-full font-black ${
                      activeTab === "postados"
                        ? "bg-white/25 text-white"
                        : "bg-[#181818] text-zinc-400"
                    }`}
                  >
                    {postedVideos.length}
                  </span>
                </button>
              </nav>

              {/* Right: Novo Projeto */}
              <div className="flex items-center gap-2.5">
                {/* Indicador de Nuvem / Sincronização PC & Celular */}
                <button
                  type="button"
                  onClick={() => { if (!getCloudToken()) setCloudAuthOpen(true); else if (pendingSaveRef.current) saveToCloud(videosRef.current, saveRevisionRef.current); else syncFromCloud(); }}
                  className="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-black transition border cursor-pointer hover:bg-[#141414] active:scale-95"
                  style={{
                    backgroundColor: "#080808",
                    borderColor: cloudStatus === "saving" || cloudStatus === "syncing" ? "#854d0e" : "#1a1a1a",
                    color: cloudStatus === "synced" ? "#34d399" : "#fef08a"
                  }}
                  title="Conectar a sincronização ou atualizar os vídeos da nuvem"
                >
                  <span
                    className={`w-2 h-2 rounded-full ${
                      cloudStatus === "saving" || cloudStatus === "syncing"
                        ? "bg-amber-400 animate-ping"
                        : cloudStatus === "synced" ? "bg-emerald-400" : "bg-amber-400"
                    }`}
                  ></span>
                  <span className="hidden sm:inline">
                    {cloudStatus === "saving"
                      ? "Salvando na Nuvem..."
                      : cloudStatus === "syncing"
                      ? "Sincronizando..."
                      : cloudStatus === "synced" ? "Nuvem sincronizada" : cloudStatus === "offline" ? "Reconectar nuvem" : "Conectar nuvem"}
                  </span>
                  <span className="sm:hidden">
                    {cloudStatus === "saving" ? "Salvando..." : cloudStatus === "syncing" ? "Sync..." : cloudStatus === "synced" ? "Nuvem OK" : "Conectar nuvem"}
                  </span>
                  <span className="text-zinc-500 text-[10px]">🔄</span>
                </button>

                <button
                  onClick={addNewVideo}
                  className="flex items-center gap-1.5 bg-[#ff0000] hover:bg-[#e60000] text-white text-xs font-black py-1.5 px-4 rounded-lg shadow-md shadow-red-600/25 transition active:scale-95"
                >
                  <span className="text-sm font-black">＋</span>
                  <span>Novo Projeto</span>
                </button>
              </div>
            </div>
          </header>

          {cloudStatus !== "synced" && cloudStatus !== "saving" && cloudStatus !== "syncing" && <div className="schedule-notice" role="status">
            <span>{cloudStatus === "local" ? "Alterações salvas neste navegador. Conecte a nuvem para sincronizar com o PC e celular." : cloudStatus === "readonly" ? "Vídeos carregados da nuvem. Conecte para salvar alterações entre PC e celular." : "Sem conexão com a nuvem. Seus vídeos continuam salvos neste navegador."}</span>
          </div>}
          {cloudAuthOpen && <div className="schedule-dialog-backdrop">
            <form className="schedule-dialog" role="dialog" aria-modal="true" aria-label="Conectar nuvem" onSubmit={connectCloud}>
              <h2 className="text-lg font-bold mb-3">Conectar nuvem</h2>
              <p className="text-sm text-zinc-400 mb-4">Use um token GitHub com acesso ao Gist dos vídeos. Ele fica somente nesta sessão do navegador e é enviado apenas ao GitHub.</p>
              <label className="block text-sm mb-2" htmlFor="cloud-token">Token GitHub</label>
              <input autoFocus id="cloud-token" type="password" name="cloudToken" required autoComplete="off" className="w-full p-3 rounded-lg bg-zinc-900 border border-zinc-600" />
              {cloudAuthError && <p role="alert" className="text-red-300 text-sm mt-3">{cloudAuthError}</p>}
              <div className="calendar-actions"><button type="button" className="schedule-cancel" onClick={() => setCloudAuthOpen(false)}>Cancelar</button><button type="submit" className="schedule-confirm">Conectar</button></div>
            </form>
          </div>}
          {newVideo && <div className="schedule-dialog-backdrop" onClick={(e) => {if(e.target === e.currentTarget) setNewVideo(null);}}>
            <div className="schedule-dialog" role="dialog" aria-modal="true" aria-label="Agendar novo vídeo"
              onKeyDown={(e) => {if(e.key === "Escape") setNewVideo(null);}}>
              <button autoFocus type="button" className="dialog-close" aria-label="Fechar agendamento" onClick={() => setNewVideo(null)}>✕</button>
              <PostingCalendar videos={videos} video={newVideo} isNew onCancel={() => setNewVideo(null)} onSchedule={(date) => handleDateChange(newVideo.id, date)} />
            </div>
          </div>}
          {scheduleNotice && <div className="schedule-notice" role="status"><span>{scheduleNotice}</span><button type="button" aria-label="Fechar aviso" onClick={() => setScheduleNotice("")}>✕</button></div>}
          {/* ÁREA DOS VÍDEOS EM TELONA CHEIA */}
          <main className="flex-1 w-full max-w-[1920px] mx-auto p-4 sm:p-6 lg:p-8 space-y-6 overflow-y-auto overflow-x-hidden bg-[#000000]">
            {displayedVideos.length === 0 ? (
              <div className="text-center py-24 bg-[#080808] rounded-2xl border border-[#171717] p-8 max-w-xl mx-auto my-12">
                <span className="text-4xl block mb-3 opacity-60">🎬</span>
                <p className="text-zinc-500 text-sm mb-4 font-semibold">
                  {activeTab === "producao"
                    ? "Nenhum vídeo em produção no momento."
                    : "Nenhum vídeo marcado como postado."}
                </p>
                {activeTab === "producao" && (
                  <button
                    onClick={addNewVideo}
                    className="bg-[#ff0000] hover:bg-[#e60000] text-white text-xs font-black px-4 py-2 rounded-xl transition active:scale-95"
                  >
                    ＋ Criar Primeiro Vídeo
                  </button>
                )}
              </div>
            ) : (
              <div className="space-y-6">
                {displayedVideos.map((video) => {
                  const dayInfo = calculatePostDayInfo(video);
                  const upcomingPostingDays = getUpcomingPostingDates(6);
                  const todayStr = new Date().toISOString().slice(0, 10);

                  const thumbsComplete = Array.isArray(video.thumbs) && video.thumbs.filter(Boolean).length === 3;
                  const completedSteps = PRODUCTION_STEPS.filter(([key]) => video[key]).length + (thumbsComplete ? 1 : 0);
                  const is100Percent = completedSteps === PRODUCTION_STEPS.length + 1;

                  return (
                    <section
                      key={video.id}
                      className="production-card bg-[#080808] rounded-2xl p-4 sm:p-5 lg:p-6 border border-[#1a1a1a] shadow-2xl space-y-4"
                    >
                      {/* CARD TOOLBAR */}
                      <div className="flex flex-col space-y-3 pb-4 border-b border-[#202026]">
                        {/* Top bar: Badge do Dia + Configurar ⋯ + Botão Postar */}
                        <div className="flex items-center justify-between gap-4 flex-wrap">
                          {/* Left: Badge do Dia com botão de expandir ⋯ */}
                          <div className="flex items-center gap-3 flex-wrap">
                            <div className="video-date-toolbar flex items-center gap-3 bg-[#131317] border border-[#2b2b34] px-4 py-2.5 rounded-2xl shadow-md">
                              <div className="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-zinc-950 text-xl font-black select-none shadow-sm">
                                📅
                              </div>
                              <div className="video-date-summary flex items-center gap-2.5">
                                {video.posted ? (
                                  <span className="text-base font-black text-emerald-400 uppercase tracking-tight">POSTADO NO YOUTUBE ✓</span>
                                ) : (
                                  <>
                                    <span className="text-base sm:text-lg font-black text-white uppercase tracking-tight">{dayInfo.weekdayName}</span>
                                    <span className="text-xs font-black text-zinc-200 bg-[#22222a] border border-[#353542] px-2.5 py-1 rounded-lg">{dayInfo.formattedDate}</span>
                                    <span className={`text-[11px] font-black uppercase tracking-wider px-2.5 py-1 rounded-lg border ${dayInfo.badgeColor}`}>{dayInfo.countdownText}</span>
                                  </>
                                )}
                              </div>
                              {!video.posted && (
                                <button
                                  type="button"
                                  onClick={() => toggleDetails(video.id)}
                                  className={`ml-2 px-2.5 py-1 rounded-lg text-xs font-black transition-all cursor-pointer ${
                                    expandedDetails[video.id]
                                      ? "bg-white text-black shadow-md"
                                      : "bg-[#202028] text-zinc-300 hover:text-white hover:bg-[#2c2c38]"
                                  }`}
                                  title={expandedDetails[video.id] ? "Ocultar configurações" : "Configurar data e status"}
                                >
                                  {expandedDetails[video.id] ? "Fechar ✕" : "Configurar ⋯"}
                                </button>
                              )}
                            </div>
                          </div>

                          {/* Right: Botão Postar e Lixeira */}
                          <div className="flex items-center gap-2">
                            {!video.posted ? (
                              is100Percent ? (
                                <button
                                  type="button"
                                  onClick={() => markAsPosted(video.id)}
                                  className={`text-xs sm:text-sm font-black px-4 py-2 rounded-xl transition-all duration-200 active:scale-95 flex items-center gap-2 shadow-lg cursor-pointer ${
                                    postingId === video.id
                                      ? "bg-[#10b981] text-white border border-[#10b981] scale-105 shadow-emerald-500/40"
                                      : "bg-emerald-500 hover:bg-emerald-400 text-black border border-emerald-400 shadow-emerald-500/25"
                                  }`}
                                  title="Todas as caixinhas marcadas! Clique para marcar como publicado no YouTube"
                                >
                                  <span>{postingId === video.id ? "✓" : "🚀"}</span>
                                  <span>{postingId === video.id ? "Postando..." : "Vídeo Postado ✓"}</span>
                                </button>
                              ) : (
                                <button
                                  type="button"
                                  disabled
                                  className="text-xs sm:text-sm font-black px-4 py-2 rounded-xl opacity-40 cursor-not-allowed bg-[#18181b] text-zinc-400 border border-[#27272a] flex items-center gap-2 select-none"
                                  title={`Marque todas as caixas de produção para liberar (${completedSteps}/${PRODUCTION_STEPS.length + 1} concluídas)`}
                                >
                                  <span>🔒</span>
                                  <span>Vídeo Postado ({completedSteps}/{PRODUCTION_STEPS.length + 1})</span>
                                </button>
                              )
                            ) : (
                              <button
                                type="button"
                                onClick={() => restoreToProduction(video.id)}
                                className="bg-[#10b981] hover:bg-[#059669] text-white border border-[#10b981] text-xs sm:text-sm font-black px-4 py-2 rounded-xl transition-all active:scale-95 flex items-center gap-1.5 shadow-sm cursor-pointer"
                                title="Vídeo postado! (Clique para voltar a Em Produção)"
                              >
                                <span>✓</span>
                                <span>Postado (Voltar ↩)</span>
                              </button>
                            )}

                            <button
                              onClick={() => deleteVideo(video.id)}
                              className="text-zinc-500 hover:text-red-400 p-2 rounded-xl hover:bg-red-950/40 transition cursor-pointer"
                              title="Excluir Projeto"
                            >
                              🗑️
                            </button>
                          </div>
                        </div>

                        {/* Painel Expansível de Configurações (Some quando fechado!) */}
                        {!video.posted && expandedDetails[video.id] && (
                          <div className="settings-panel">
                            <PostingCalendar videos={videos} video={video} onSchedule={(date) => handleDateChange(video.id, date)} />
                            <div className="production-checklist">
                              <div className="checklist-heading"><h3>Etapas de produção</h3><span>{completedSteps}/{PRODUCTION_STEPS.length + 1} concluídas</span></div>
                              <div className="checklist-progress"><span style={{width: (completedSteps / (PRODUCTION_STEPS.length + 1) * 100) + "%"}} /></div>
                              <div className="checklist-items">
                                {PRODUCTION_STEPS.map(([key, label]) => (
                                  <button key={key} type="button" aria-pressed={!!video[key]}
                                    onClick={() => toggleProcess(video.id, key)}
                                    className={"checklist-item " + (video[key] ? "complete" : "")}>
                                    <span>{label}</span><b>{video[key] ? "✓" : "○"}</b>
                                  </button>
                                ))}
                                <div className={"checklist-item " + (thumbsComplete ? "complete" : "")}>
                                  <span>Thumbs</span><b>{thumbsComplete ? "✓" : (video.thumbs?.filter(Boolean).length || 0) + "/3"}</b>
                                </div>
                              </div>
                            </div>
                          </div>
                        )}
                      </div>

                      {/* 3 Variations: 3 Thumbs + 3 BIG TITLES com Separação Nítida */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-5 lg:gap-6 pt-2">
                        {[0, 1, 2].map((idx) => {
                          const thumb = video.thumbs[idx];
                          const title = video.titles[idx];
                          const titleLength = title.length;

                          return (
                            <div
                              key={idx}
                              className="flex flex-col bg-[#0b0b0e] border border-[#23232a] hover:border-[#383844] p-4 sm:p-5 rounded-2xl transition shadow-xl space-y-4"
                            >
                              {/* Option Header */}
                              <div className="flex items-center justify-between pb-2 border-b border-[#1c1c22]">
                                <span className="text-xs font-black text-white uppercase tracking-wider flex items-center gap-2">
                                  <span className="w-2 h-2 rounded-full bg-white inline-block shadow-sm shadow-white/40"></span>
                                  OPÇÃO {idx + 1}
                                </span>
                                {thumb && (
                                  <span className="text-[10px] font-black uppercase tracking-wider text-emerald-400 bg-emerald-950/40 border border-emerald-800/40 px-2 py-0.5 rounded-md">
                                    Thumb pronta ✓
                                  </span>
                                )}
                              </div>

                              {/* 16:9 Thumbnail Box com moldura nítida */}
                              <div className="space-y-2">
                                <div
                                  className={`relative rounded-xl overflow-hidden cursor-pointer group aspect-video transition duration-200 flex items-center justify-center border-2 ${
                                    thumb
                                      ? "bg-black border-[#2d2d38] hover:border-red-500"
                                      : "bg-[#111116] border-dashed border-[#363644] hover:border-red-500"
                                  }`}
                                  onClick={() =>
                                    document.getElementById(`yt-v14-${video.id}-${idx}`)?.click()
                                  }
                                >
                                  {thumb ? (
                                    <img
                                      src={thumb}
                                      alt={`Opção ${idx + 1}`}
                                      className="w-full h-full object-cover transition duration-300 group-hover:scale-105"
                                    />
                                  ) : (
                                    <div className="relative w-full h-full flex flex-col items-center justify-center p-3 text-zinc-400 group-hover:text-white transition">
                                      <span className="text-3xl mb-1.5 opacity-80 group-hover:scale-110 transition">📁</span>
                                      <span className="text-xs font-black tracking-wider uppercase text-zinc-300">
                                        Subir Thumbnail
                                      </span>
                                      <span className="text-[10px] text-zinc-500 font-bold mt-0.5">
                                        Formato 16:9
                                      </span>
                                    </div>
                                  )}

                                  {thumb && (
                                    <div className="absolute inset-0 bg-black/65 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                                      <span className="text-xs font-black text-white bg-red-600 px-3 py-1.5 rounded-lg shadow-md">
                                        Trocar Thumbnail
                                      </span>
                                    </div>
                                  )}

                                  <input
                                    id={`yt-v14-${video.id}-${idx}`}
                                    type="file"
                                    accept="image/*"
                                    className="hidden"
                                    onChange={(e) => {
                                      const f = e.target.files?.[0];
                                      if (f) updateThumb(video.id, idx, f);
                                    }}
                                  />
                                </div>

                                {thumb && (
                                  <div className="flex justify-end">
                                    <button
                                      type="button"
                                      onClick={() => removeThumb(video.id, idx)}
                                      className="text-xs font-bold text-zinc-500 hover:text-red-400 transition cursor-pointer"
                                    >
                                      Remover foto ✕
                                    </button>
                                  </div>
                                )}
                              </div>

                              {/* LINHA DE SEPARAÇÃO NÍTIDA ENTRE THUMBNAIL E TÍTULO */}
                              <div className="border-t border-[#1c1c24] my-1" />

                              {/* Title Section com caixa e borda visualmente separadas */}
                              <div className="space-y-2 flex-1 flex flex-col justify-between">
                                <div className="flex items-center justify-between text-xs font-bold text-zinc-400">
                                  <span>Título do Vídeo:</span>
                                  <span
                                    className={
                                      titleLength > 90
                                        ? "text-red-400 font-black"
                                        : "text-zinc-500"
                                    }
                                  >
                                    {titleLength} / 100
                                  </span>
                                </div>

                                <textarea
                                  rows={3}
                                  value={title}
                                  onChange={(e) => updateTitle(video.id, idx, e.target.value)}
                                  onInput={(e) => updateTitle(video.id, idx, e.currentTarget.value)}
                                  onBlur={(e) => {
                                    const finalText = e.currentTarget.value.slice(0, 100);
                                    updateTitle(video.id, idx, finalText);
                                    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(videosRef.current)); } catch (err) {}
                                  }}
                                  maxLength={100}
                                  placeholder={`Título em destaque para a Opção ${idx + 1}...`}
                                  className="w-full bg-[#131318] hover:bg-[#16161d] focus:bg-[#16161d] border border-[#2b2b36] focus:border-red-500 focus:ring-1 focus:ring-red-500/25 text-base sm:text-lg font-black text-white p-3.5 rounded-xl focus:outline-none resize-none transition leading-snug placeholder:text-zinc-600 placeholder:font-normal shadow-inner"
                                />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </section>
                  );
                })}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
