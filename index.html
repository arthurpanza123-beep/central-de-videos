<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Central Studio - Produção & Thumbs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.10/babel.min.js"></script>
  <style>
    body {
      background-color: #000000;
      color: #f4f4f5;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #1f1f1f; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #2e2e2e; }
    :root { color-scheme: dark; }
    body { background: #090909 !important; }
    #root > div { background: #090909 !important; }
    header {
      background: #0c0c0c !important;
      border-color: #202020 !important;
      box-shadow: none;
    }
    main { max-width: 1920px !important; background: #090909 !important; }
    main > div > section {
      background: #101010 !important;
      border-color: #242424 !important;
      box-shadow: none !important;
    }
    main > div > section > div:first-child { border-color: #242424 !important; }
    main section .grid > div {
      background: #0b0b0b !important;
      border-color: #242424 !important;
      box-shadow: none;
    }
    main section .grid > div:hover { border-color: #3a3a3a !important; transform: none; transition: .2s ease; }
    .day-picker { scrollbar-width: none; }
    .day-picker::-webkit-scrollbar { display: none; }
    main section [contenteditable="true"] {
      background: #111111 !important;
      border-color: #292929 !important;
      border-radius: 8px !important;
      min-height: 84px;
    }
    .thumb-empty { background: #151515 !important; color: #ededed !important; }
    .thumb-empty::before { content: ""; position: absolute; inset: 9px; border: 1px dashed #3a3a3a; border-radius: 8px; pointer-events: none; }
    .status-btn-active {
      background-color: #059669 !important;
      color: #ffffff !important;
      border: 1px solid #10b981 !important;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4) !important;
    }
    .status-btn-inactive {
      background-color: #141417 !important;
      color: #71717a !important;
      border: 1px solid #232329 !important;
    }
    .status-btn-inactive:hover {
      background-color: #1c1c22 !important;
      color: #e4e4e7 !important;
      border-color: #3f3f46 !important;
    }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    @media (max-width: 640px) {
      header { position: relative !important; padding: .75rem !important; }
      header > div { gap: .65rem !important; }
      main { padding: .75rem !important; }
      main > div { gap: .9rem !important; }
    }

    * { box-sizing: border-box; }
    .production-card { min-width: 0; }
    .video-date-toolbar { flex-wrap: wrap; min-width: 0; }
    .video-date-summary { flex-wrap: wrap; min-width: 0; }
    .settings-panel { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(260px, .9fr); gap: 24px; padding: 24px; border: 1px solid #2b2b30; border-radius: 18px; background: #111113; align-items: start; }
    .posting-calendar, .production-checklist { min-width: 0; width: 100%; }
    .calendar-heading h3, .checklist-heading h3 { margin: 0; font-size: 15px; font-weight: 800; color: #fafafa; }
    .calendar-heading p { margin: 6px 0 18px; font-size: 12px; color: #92929d; }
    .calendar-month { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; }
    .calendar-month strong { font-size: 14px; text-transform: capitalize; }
    .calendar-month button, .dialog-close { width: 40px; height: 40px; border: 1px solid #33333c; border-radius: 10px; background: #202024; color: #fafafa; font-size: 23px; cursor: pointer; }
    .calendar-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11px; color: #a1a1aa; margin-bottom: 14px; }
    .legend-free { color: #6ee7b7; } .legend-busy { color: #fda4af; }
    .calendar-days { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 8px; }
    .calendar-weekday { text-align: center; color: #8b8b97; font-size: 11px; font-weight: 800; padding: 4px 0; text-transform: uppercase; letter-spacing: .06em; }
    .calendar-date { position: relative; min-height: 66px; min-width: 0; border: 1px solid; border-radius: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; transition: border-color .15s, background .15s; }
    .calendar-date strong { font-size: 17px; line-height: 1.2; }
    .calendar-date small { font-size: 10px; font-weight: 600; }
    .calendar-date.free { background: #0a2821; border-color: #185341; color: #6ee7b7; }
    .calendar-date.busy { background: #35151c; border-color: #75303e; color: #fda4af; }
    .calendar-date.selected { outline: 2px solid #fafafa; outline-offset: 1px; }
    .date-check { position: absolute; top: 5px; right: 6px; font-size: 10px; color: white; }
    .calendar-date:disabled { background: #19191d; border-color: #27272d; color: #555561; cursor: not-allowed; }
    .calendar-month button:disabled { opacity: .3; cursor: not-allowed; }
    .schedule-preview { background: #19191d; border: 1px solid #2b2b33; border-radius: 12px; padding: 14px; margin-top: 18px; font-size: 12px; line-height: 1.6; }
    .schedule-preview > strong { color: #fafafa; }
    .schedule-preview p { color: #a1a1aa; margin: 5px 0 0; }
    .schedule-preview ul { list-style: none; padding: 0; margin: 10px 0 0; max-height: 190px; overflow-y: auto; }
    .schedule-preview li { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; padding: 8px 0; border-top: 1px solid #303036; }
    .schedule-preview li span { min-width: 0; flex: 1 1 150px; overflow-wrap: anywhere; }
    .schedule-preview li b { color: #fda4af; white-space: nowrap; }
    .calendar-actions { display: flex; gap: 10px; margin-top: 14px; }
    .schedule-confirm, .schedule-cancel { min-height: 44px; padding: 12px 16px; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; }
    .schedule-confirm { flex: 1; background: #ef2525; color: white; border: 1px solid #ff4747; }
    .schedule-confirm:hover { background: #dc1717; }
    .schedule-confirm:disabled { opacity: .4; cursor: not-allowed; }
    .schedule-cancel { background: #24242a; border: 1px solid #3a3a44; color: #ddd; }
    .checklist-heading { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
    .checklist-heading > span { font-size: 11px; color: #a1a1aa; }
    .checklist-progress { margin: 16px 0 18px; background: #28282f; height: 5px; border-radius: 10px; overflow: hidden; }
    .checklist-progress > span { display: block; height: 100%; background: #34d399; border-radius: inherit; transition: width .2s; }
    .checklist-items { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .checklist-item { min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #1b1b20; color: #b1b1bd; border: 1px solid #33333b; border-radius: 10px; padding: 12px; font-size: 12px; font-weight: 700; text-align: left; }
    button.checklist-item { cursor: pointer; }
    .checklist-item.complete { color: #6ee7b7; border-color: #24604e; background: #102a23; }
    button:focus-visible { outline: 2px solid white; outline-offset: 3px; }
    .schedule-dialog-backdrop { position: fixed; inset: 0; z-index: 80; background: #000b; backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .schedule-dialog { position: relative; width: 100%; max-width: 520px; max-height: calc(100dvh - 40px); overflow-y: auto; padding: 28px; background: #121214; border: 1px solid #3a3a42; border-radius: 20px; box-shadow: 0 30px 100px #0008; }
    .schedule-dialog .calendar-heading { padding-right: 35px; }
    .dialog-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; font-size: 13px; }
    .schedule-notice { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: #102a23; color: #a7f3d0; font-size: 12px; }
    .schedule-notice button { min-height: 32px; min-width: 32px; }
    @media (max-width: 900px) {
      .settings-panel { grid-template-columns: minmax(0,1fr); padding: 18px; gap: 26px; }
    }
    @media (max-width: 640px) {
      header > div > nav, header > div > div { width: 100%; justify-content: space-between; }
      header nav button { flex: 1; justify-content: center; }
      .production-card { padding: 12px !important; }
      .production-card > div:first-child > div:first-child { gap: 12px; }
      .production-card > div:first-child > div:first-child > div:first-child { width: 100%; min-width: 0; }
      .video-date-toolbar { width: 100%; padding: 12px !important; gap: 10px !important; border-radius: 12px !important; }
      .video-date-toolbar > div:first-child { display: none; }
      .video-date-summary { flex: 1 1 100%; gap: 8px !important; }
      .video-date-summary > span:first-child { font-size: 14px; }
      .video-date-toolbar > button { margin-left: 0 !important; min-height: 40px; width: 100%; }
      .settings-panel { padding: 12px; border-radius: 12px; }
      .calendar-days { gap: 6px; }
      .calendar-date { min-height: 61px; border-radius: 9px; }
      .checklist-item { padding: 11px 9px; font-size: 11px; }
      .schedule-dialog-backdrop { padding: 10px; }
      .schedule-dialog { padding: 20px 14px; max-height: calc(100dvh - 20px); border-radius: 16px; }
      .calendar-actions { flex-wrap: wrap; }
      .schedule-confirm { flex-basis: 190px; }
      textarea { font-size: 16px !important; }
    }


    /* Compact project settings */
    .settings-panel { display:flex; align-items:center; flex-wrap:wrap; gap:14px; padding:14px; border-radius:12px; background:#111113; }
    .publication-control { position:relative; flex:0 0 auto; }
    .date-control-trigger { display:flex; align-items:center; justify-content:space-between; gap:20px; min-height:36px; padding:8px 12px; border:1px solid #35353b; border-radius:8px; background:#202023; color:#e4e4e7; font-size:12px; font-weight:600; cursor:pointer; }
    .date-control-trigger:hover { background:#29292e; }
    .production-checklist { display:flex; align-items:center; gap:12px; flex:1 1 500px; width:auto; }
    .checklist-count { flex:0 0 auto; color:#90909a; font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; }
    .checklist-items { display:flex; flex-wrap:wrap; gap:6px; flex:1; min-width:0; }
    .checklist-item { min-height:34px; padding:8px 10px; gap:12px; border-radius:7px; border-color:#2e2e34; background:#19191d; font-size:11px; font-weight:600; color:#a1a1aa; }
    .checklist-item b { font-size:11px; font-weight:600; color:#60606b; }
    .checklist-item.complete { background:#14231d; border-color:#254a3b; color:#9adbbd; }
    .checklist-item.complete b { color:#6bc69c; }
    .calendar-popover { position:absolute; z-index:25; top:calc(100% + 10px); left:0; width:330px; max-width:calc(100vw - 64px); padding:18px; background:#161619; border:1px solid #36363e; border-radius:14px; box-shadow:0 16px 45px #0009; }
    .calendar-heading h3 { margin:0 0 18px; font-size:15px; }
    .calendar-month { padding-bottom:10px; gap:10px; }
    .calendar-month strong { font-size:13px; }
    .calendar-month button { width:32px; height:32px; border-radius:7px; background:#222227; border-color:#303037; font-size:20px; }
    .calendar-legend { gap:12px; margin-bottom:10px; font-size:10px; }
    .calendar-days { gap:6px; }
    .calendar-weekday { font-size:10px; font-weight:600; letter-spacing:.02em; }
    .calendar-date { min-height:40px; border-radius:7px; padding:5px; }
    .calendar-date strong { font-size:13px; font-weight:600; }
    .calendar-date.free { background:#14251e; border-color:#264d3c; color:#91d4b3; }
    .calendar-date.busy { background:#321c21; border-color:#63323e; color:#e9a1ad; }
    .calendar-date.selected { outline:1.5px solid #ededf0; outline-offset:1px; }
    .calendar-actions { margin-top:14px; gap:8px; flex-wrap:nowrap; }
    .schedule-confirm,.schedule-cancel { min-height:38px; padding:9px 12px; font-size:11px; font-weight:700; border-radius:8px; }
    .schedule-confirm { flex-basis:auto; }
    .schedule-preview { margin-top:12px; padding:10px 12px; border-radius:8px; background:#1b1b20; font-size:11px; }
    .schedule-preview summary { color:#c7c7d0; cursor:pointer; }
    .schedule-preview li { font-size:10px; }
    .schedule-dialog { max-width:380px; padding:24px; border-radius:16px; }
    @media(max-width:900px) {
      .production-checklist { flex-basis:100%; }
      .settings-panel { gap:12px; padding:14px; }
    }
    @media(max-width:640px) {
      .settings-panel { display:block; padding:12px; }
      .publication-control { width:100%; margin-bottom:12px; }
      .date-control-trigger { width:100%; min-height:40px; }
      .calendar-popover { position:static; width:100%; max-width:none; margin-top:10px; padding:12px; box-shadow:none; background:#151518; }
      .production-checklist { align-items:flex-start; gap:8px; }
      .checklist-count { padding-top:11px; font-size:10px; }
      .checklist-items { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
      .checklist-item { min-height:38px; padding:9px; font-size:11px; gap:5px; }
      .calendar-date { min-height:42px; }
      .schedule-dialog { padding:20px 16px; }
    }


    .calendar-modal-backdrop { position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; padding:20px; background:#000a; backdrop-filter:blur(5px); }
    .visual-calendar-dialog { width:100%; max-width:560px; max-height:calc(100dvh - 40px); overflow-y:auto; border:1px solid #36363c; border-radius:18px; padding:24px; background:#141416; box-shadow:0 24px 80px #0009; }
    .visual-calendar-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .visual-calendar-header h3 { margin:0; color:#eeeef1; font-size:15px; font-weight:700; }
    .visual-calendar-header button { width:32px; height:32px; border:1px solid #34343b; border-radius:8px; background:#202024; color:#a1a1aa; font-size:12px; cursor:pointer; }
    .visual-calendar .calendar-month { gap:12px; padding-bottom:12px; }
    .calendar-month-selects { display:flex; align-items:center; justify-content:center; gap:6px; min-width:0; }
    .calendar-month-selects select { min-width:0; max-width:150px; padding:9px 10px; border:1px solid #36363d; border-radius:8px; background:#202024; color:#fafafa; font:600 13px 'Plus Jakarta Sans',sans-serif; text-transform:capitalize; cursor:pointer; }
    .calendar-month-selects select:focus-visible { outline:2px solid white; outline-offset:2px; }
    .visual-calendar .calendar-legend { justify-content:center; gap:18px; color:#8a8a95; margin-bottom:12px; font-size:10px; }
    .legend-thumbnail { display:flex; align-items:center; gap:5px; }
    .legend-thumbnail i { display:inline-block; width:13px; height:9px; border:1px solid #676773; border-radius:2px; background:linear-gradient(135deg,#575763,#24242a); }
    .visual-calendar .calendar-days { gap:8px; }
    .visual-calendar .calendar-weekday { padding:3px 0 5px; }
    .visual-calendar .calendar-date.calendar-tile { aspect-ratio:16/10; min-height:58px; overflow:hidden; padding:0; border:1px solid #323238; border-radius:9px; background:#1c1c20; color:#c4c4ce; display:block; }
    .calendar-tile img { display:block; width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
    .visual-calendar .calendar-date.calendar-tile.selected { outline:2px solid #f4f4f5; outline-offset:2px; }
    .visual-calendar .calendar-date.calendar-tile:hover { border-color:#85858e; }
    .calendar-day-number { position:absolute; z-index:1; top:5px; left:5px; display:flex; align-items:center; justify-content:center; min-width:23px; height:22px; padding:0 5px; background:#121214c9; color:white; border-radius:5px; font-size:12px !important; }
    .empty-date .calendar-day-number { color:#b9b9c4; background:transparent; }
    .calendar-free-plus { display:flex; align-items:center; justify-content:center; width:100%; height:100%; color:#50505d; font-size:19px; font-weight:400; }
    .calendar-title-cover { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; padding:28px 7px 6px; font-size:9px; line-height:1.35; text-align:left; color:#b4b4bf; }
    .calendar-current-label { position:absolute; bottom:4px; right:4px; padding:2px 5px; border-radius:4px; background:#101012cf; color:#e4e4eb; font-size:8px; line-height:1.2; }
    .calendar-selection { margin-top:16px; min-height:18px; text-align:center; color:#b4b4bf; font-size:11px; text-transform:capitalize; }
    .visual-calendar .calendar-actions { margin-top:12px; }
    .visual-calendar .schedule-confirm { background:#f4f4f5; border-color:#f4f4f5; color:#18181b; }
    .visual-calendar .schedule-confirm:hover { background:#d4d4d8; border-color:#d4d4d8; }
    .visual-calendar .schedule-cancel { background:transparent; border-color:#34343c; color:#b8b8c4; }
    .schedule-dialog:has(.visual-calendar) { max-width:560px; }
    @media(max-width:640px) {
      .calendar-modal-backdrop { padding:12px; }
      .visual-calendar-dialog { padding:16px; max-height:calc(100dvh - 24px); border-radius:14px; }
      .visual-calendar-header { margin-bottom:14px; }
      .visual-calendar-header h3 { font-size:14px; }
      .visual-calendar .calendar-month { gap:7px; }
      .calendar-month-selects { gap:5px; flex:1; }
      .calendar-month-selects select { padding:8px 6px; font-size:12px; max-width:125px; }
      .visual-calendar .calendar-days { gap:6px; }
      .visual-calendar .calendar-date.calendar-tile { min-height:48px; border-radius:7px; }
      .visual-calendar .calendar-month button { width:32px; min-width:32px; height:36px; }
      .visual-calendar .schedule-confirm,.visual-calendar .schedule-cancel { min-height:42px; }
      .calendar-day-number { min-width:21px; height:20px; top:3px; left:3px; font-size:11px !important; }
      .calendar-title-cover { font-size:8px; padding-top:25px; }
    }

  
    /* Spacious calendar: large touch targets and quiet occupied slots. */
    .visual-calendar-dialog,.schedule-dialog:has(.visual-calendar){max-width:580px;padding:28px;border-radius:24px;background:#151517}

    .visual-calendar .schedule-cancel{border:1px solid #36363d;background:transparent;color:#b6b6bf}

      .visual-calendar-dialog,.schedule-dialog:has(.visual-calendar){padding:20px;max-height:calc(100dvh - 24px);border-radius:20px}

          <span>Alterar data</span><span aria-hidden="true">▾</span>
        </button>
        {open && ReactDOM.createPortal(
          <div className="calendar-modal-backdrop" onClick={event=>{if(event.target===event.currentTarget)setOpen(false);}}>
            <div ref={modal} id={"calendar-"+video.id} className="visual-calendar-dialog" role="dialog" aria-modal="true" aria-labelledby={"calendar-heading-"+video.id}>
              <div className="visual-calendar-header">
                <h3 id={"calendar-heading-"+video.id}>Data de publicação</h3>
                <button type="button" data-calendar-close aria-label="Fechar calendário" onClick={()=>setOpen(false)}>✕</button>
              </div>
              <PostingCalendar videos={videos} video={video} onMoveVideo={onMoveVideo} onCancel={()=>setOpen(false)}
                onSchedule={date=>{onSchedule(date);setOpen(false);}} />
            </div>
          </div>,document.body
        )}
      </div>;
    }

    function App() {
      const [videos, setVideos] = useState([]);
      const [activeTab, setActiveTab] = useState("producao");
      const [newVideo, setNewVideo] = useState(null);
      const [scheduleNotice, setScheduleNotice] = useState("");
      const [postingId, setPostingId] = useState(null);
      const [expandedDetails, setExpandedDetails] = useState({});
      const [loaded, setLoaded] = useState(false);
      const [cloudStatus, setCloudStatus] = useState("syncing"); // 'syncing', 'synced', 'saving', 'offline'
      const saveTimerRef = useRef(null);
      const cloudBaseRef = useRef({});
      const cloudEtagRef = useRef("");
      const cloudSessionRef = useRef(null);
      const saveInFlightRef = useRef(false);
      const queuedSaveRef = useRef(false);
      const isSyncingRef = useRef(false);
      const pendingSaveRef = useRef(false);
      const saveRevisionRef = useRef(0);
      const skipNextSaveRef = useRef(true);
      const loadedRef = useRef(loaded);
      const videosRef = useRef(videos);
      videosRef.current = videos;
      loadedRef.current = loaded;

      useEffect(() => {
        if (!newVideo) return;
        const previous = document.activeElement;
        const oldOverflow = document.body.style.overflow;
        document.body.style.overflow = "hidden";
        function trapFocus(event) {
          if (event.key !== "Tab") return;
          const dialog = document.querySelector(".schedule-dialog");
          const controls = dialog ? Array.from(dialog.querySelectorAll('button:not([disabled]), select, summary, [tabindex="0"]')) : [];
          const first = controls[0], last = controls[controls.length - 1];
          if (event.shiftKey && document.activeElement === first) {event.preventDefault(); last?.focus();}
          else if (!event.shiftKey && document.activeElement === last) {event.preventDefault(); first?.focus();}
        }
        document.addEventListener("keydown", trapFocus);
        return () => {
          document.body.style.overflow = oldOverflow;
          document.removeEventListener("keydown", trapFocus);
          previous?.focus();
        };
      }, [newVideo]);


      function rememberCloud(videos, etag) {
        cloudBaseRef.current = videoFingerprints(videos);
        cloudEtagRef.current = etag;
        try {localStorage.setItem(BASE_KEY, JSON.stringify(cloudBaseRef.current));} catch {}
      }
      async function readCloud(conditional = false) {
        const response = await fetch(SYNC_API + "/videos", {
          cache: "no-store",
          headers: conditional && cloudEtagRef.current ? {"If-None-Match": cloudEtagRef.current} : {}
        });
        if (response.status === 304) return null;
        if (!response.ok) throw new Error("Nuvem indisponível");
        const data = await response.json();
        if (!Array.isArray(data.videos)) throw new Error("Resposta inválida da nuvem");
        return {videos: data.videos, etag: response.headers.get("ETag")};
      }
      async function sessionToken(force = false) {
        if (!force && cloudSessionRef.current?.expiresAt > Date.now() + 60000) return cloudSessionRef.current.token;
        const response = await fetch(SYNC_API + "/session", {method:"POST"});
        if (!response.ok) throw new Error("Não foi possível iniciar a sincronização");
        cloudSessionRef.current = await response.json();
        return cloudSessionRef.current.token;
      }

      const syncFromCloud = useCallback(async () => {
        if (isSyncingRef.current || saveInFlightRef.current || pendingSaveRef.current) return;
        isSyncingRef.current = true;
        if (!loadedRef.current) setCloudStatus("syncing");
        try {
          const remote = await readCloud(true);
          // A user may have started editing while the request was in flight.
          if (pendingSaveRef.current) return;
          if (remote) {
            rememberCloud(remote.videos, remote.etag);
            if (JSON.stringify(videosRef.current) !== JSON.stringify(remote.videos)) {
              if (loadedRef.current) skipNextSaveRef.current = true;
              setVideos(remote.videos);
              try {localStorage.setItem(STORAGE_KEY, JSON.stringify(remote.videos));} catch {}
            }
          }
          setCloudStatus("synced");
        } catch {setCloudStatus("offline");}
        finally {isSyncingRef.current = false;}
      }, []);

      const saveToCloud = useCallback(async (currentVideos, revision) => {
        if (!loadedRef.current || revision < saveRevisionRef.current) return;
        if (saveInFlightRef.current) {queuedSaveRef.current = true; return;}
        saveInFlightRef.current = true;
        queuedSaveRef.current = false;
        const base = cloudBaseRef.current;
        const snapshot = currentVideos;
        const snapshotFingerprints = videoFingerprints(snapshot);
        setCloudStatus("saving");
        try {
          let saved = null;
          for (let attempt = 0; attempt < 4; attempt++) {
            const remote = await readCloud();
            const merged = mergeScheduledEdits(remote.videos, snapshot, base);
            const token = await sessionToken(attempt > 0);
            const response = await fetch(SYNC_API + "/videos", {
              method:"PUT",
              headers:{"Content-Type":"application/json","Authorization":"Bearer " + token,"If-Match":remote.etag},
              body:JSON.stringify({videos:merged})
            });
            if (response.status === 412 || response.status === 401) continue;
            if (!response.ok) throw new Error("Não foi possível salvar na nuvem");
            saved = {videos:merged,etag:response.headers.get("ETag")};
            break;
          }
          if (!saved) throw new Error("Atualizações simultâneas. Tentaremos novamente.");
          rememberCloud(saved.videos, saved.etag);
          if (revision === saveRevisionRef.current) {
            pendingSaveRef.current = false;
            try {
              localStorage.removeItem(PENDING_KEY);
              localStorage.setItem(STORAGE_KEY, JSON.stringify(saved.videos));
            } catch {}
            if (JSON.stringify(videosRef.current) !== JSON.stringify(saved.videos)) {
              skipNextSaveRef.current = true;
              setVideos(saved.videos);
            }
            setCloudStatus("synced");
          } else {
            // Preserve edits made during upload and include changes from the other device.
            const rebased = mergeVideoEdits(saved.videos, videosRef.current, snapshotFingerprints);
            if (JSON.stringify(rebased) !== JSON.stringify(videosRef.current)) setVideos(rebased);
            queuedSaveRef.current = true;
          }
        } catch {setCloudStatus("offline");}
        finally {
          saveInFlightRef.current = false;
          if (queuedSaveRef.current && pendingSaveRef.current) {
            queuedSaveRef.current = false;
            setTimeout(() => saveToCloud(videosRef.current, saveRevisionRef.current), 100);
          }
        }
      }, []);

      useEffect(() => {
        let hasLocal = false;
        try {
          const saved = localStorage.getItem(STORAGE_KEY) ||
            localStorage.getItem("producao_videos_sim_nao_v10") || localStorage.getItem("producao_videos_v9");
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) {setVideos(parsed); hasLocal = true;}
          }
          cloudBaseRef.current = JSON.parse(localStorage.getItem(BASE_KEY) || "{}");
          pendingSaveRef.current = hasLocal && localStorage.getItem(PENDING_KEY) === "1";
          if (pendingSaveRef.current && !Object.keys(cloudBaseRef.current).length) cloudBaseRef.current = MIGRATION_BASE;
        } catch {}
        (async () => {
          if (pendingSaveRef.current) setCloudStatus("offline");
          else await syncFromCloud();
          if (!hasLocal && !cloudEtagRef.current) {
            try {
              const response = await fetch("./videos.json", {cache:"no-store"});
              const fallback = await response.json();
              if (Array.isArray(fallback)) {
                setVideos(fallback);
                cloudBaseRef.current = videoFingerprints(fallback);
                try {localStorage.setItem(BASE_KEY, JSON.stringify(cloudBaseRef.current));} catch {}
              }
            } catch {}
          }
          skipNextSaveRef.current = true;
          setLoaded(true);
        })();
      }, [syncFromCloud]);

      useEffect(() => {
        if (!loaded) return;
        if (skipNextSaveRef.current) {
          skipNextSaveRef.current = false;
          if (pendingSaveRef.current) saveToCloud(videosRef.current, saveRevisionRef.current);
          return;
        }
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
          localStorage.setItem(PENDING_KEY, "1");
        } catch {}
        const revision = ++saveRevisionRef.current;
        pendingSaveRef.current = true;
        setCloudStatus("saving");
        clearTimeout(saveTimerRef.current);
        saveTimerRef.current = setTimeout(() => saveToCloud(videos, revision), 1200);
        return () => clearTimeout(saveTimerRef.current);
      }, [videos, loaded, saveToCloud]);

      useEffect(() => {
        if (!loaded) return;
        const refresh = () => {
          if (document.visibilityState === "hidden") return;
          if (pendingSaveRef.current) saveToCloud(videosRef.current, saveRevisionRef.current);
          else syncFromCloud();
        };
        const interval = setInterval(refresh, 15000);
        window.addEventListener("online", refresh);
        window.addEventListener("focus", refresh);
        document.addEventListener("visibilitychange", refresh);
        return () => {
          clearInterval(interval);
          window.removeEventListener("online", refresh);
          window.removeEventListener("focus", refresh);
          document.removeEventListener("visibilitychange", refresh);
        };
      }, [loaded, saveToCloud, syncFromCloud]);

      function addNewVideo() {
        playSound("click");
        const nextDates = getUpcomingPostingDates(1);
        const defaultDate = nextDates.length > 0 ? nextDates[0].dateStr : new Date().toISOString().slice(0, 10);
        const parts = defaultDate.split("-").map(Number);
        const dt = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
        const newV = {
          id: "v-" + Date.now(),
          scheduledDate: defaultDate,
          weekday: dt.getDay(),
          weekOffset: getWeekOffsetFromDate(defaultDate),
          posted: false,
          introSim: false,
          nandoSim: false,
          dudaSim: false,
          sonoraSim: false,
          gravarAudioSim: false, legendasSim: false, tvSim: false,
          thumbs: ["", "", ""],
          titles: ["", "", ""],
        };
        setNewVideo(newV);
      }

      function handleDateChange(id, dateStr) {
        const selected = newVideo?.id === id ? newVideo : videosRef.current.find(v => v.id === id);
        if (!selected) return;
        const result = scheduleVideo(videosRef.current, selected, dateStr);
        playSound("success");
        setVideos(result.videos);
        setScheduleNotice("Vídeo agendado para " + shortDate(dateStr) + (result.moves.length ? ". " + result.moves.length + " vídeo(s) remanejado(s)." : "."));
        setNewVideo(null);
        setActiveTab("producao");
      }

      function moveCalendarVideo(id,date) {
        const current=videosRef.current;
        const moving=current.find(v=>v.id===id);
        if(!moving || moving.posted)return;
        const result=scheduleVideo(current,moving,date);
        videosRef.current=result.videos;
        setVideos(result.videos);
        setScheduleNotice("Vídeo movido para "+shortDate(date)+".");
        playSound("click");
      }

      function toggleDetails(id) {
        playSound("click");
        setExpandedDetails((prev) => ({ ...prev, [id]: !prev[id] }));
      }

      function toggleProcess(id, key) {
        playSound("toggle");
        setVideos((prev) =>
          prev.map((v) => (v.id === id ? { ...v, [key]: !v[key] } : v))
        );
      }

      async function updateThumb(id, index, file) {
        try {
          const compressed = await compressImage(file);
          playSound("click");
          setVideos((prev) =>
            prev.map((v) => {
              if (v.id !== id) return v;
              const newThumbs = [...v.thumbs];
              newThumbs[index] = compressed;
              return { ...v, thumbs: newThumbs };
            })
          );
        } catch (e) {
          console.error("Erro ao processar imagem", e);
        }
      }

      function removeThumb(id, index) {
        playSound("delete");
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            const newThumbs = [...v.thumbs];
            newThumbs[index] = "";
            return { ...v, thumbs: newThumbs };
          })
        );
      }

      function updateTitle(id, index, text) {
        const nextText = String(text ?? "").slice(0, 100);
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            const newTitles = [...v.titles];
            newTitles[index] = nextText;
            const nextVideo = { ...v, titles: newTitles };
            return nextVideo;
          })
        );
      }

      function markAsPosted(id) {
        playSound("success");
        setPostingId(id);
        setTimeout(() => {
          setVideos((prev) =>
            prev.map((v) => (v.id === id ? { ...v, posted: true, postedAt: Date.now() } : v))
          );
          setPostingId(null);
        }, 450);
      }

      function restoreToProduction(id) {
        playSound("click");
        setVideos((prev) =>
          scheduleVideo(prev, { ...prev.find(v => v.id === id), posted: false }, getUpcomingPostingDates(1)[0].dateStr).videos
        );
      }

      function deleteVideo(id) {
        if (window.confirm("Deseja realmente excluir este projeto de vídeo?")) {
          playSound("delete");
          setVideos((prev) => prev.filter((v) => v.id !== id));
        }
      }

      function exportBackup() {
        playSound("success");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(videos, null, 2));
        const a = document.createElement("a");
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `backup_videos_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      function importBackup(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) {
              playSound("success");
              setVideos(parsed);
              alert("Backup restaurado com sucesso! " + parsed.length + " projetos carregados.");
            } else {
              alert("Arquivo de backup inválido.");
            }
          } catch (err) {
            alert("Erro ao ler o arquivo de backup.");
          }
        };
        reader.readAsText(file);
      }

      // Os vídeos em produção são organizados por data de publicação:
      // a data mais próxima aparece automaticamente no topo (ex: dia 18 antes do dia 22).
      const activeVideos = [...videos]
        .filter((v) => !v.posted)
        .sort((a, b) => {
          const infoA = calculatePostDayInfo(a);
          const infoB = calculatePostDayInfo(b);
          return (infoA.timestamp || 0) - (infoB.timestamp || 0);
        });

      const postedVideos = [...videos]
        .filter((v) => v.posted)
        .sort((a, b) => (b.postedAt || 0) - (a.postedAt || 0));

      const displayedVideos = activeTab === "producao" ? activeVideos : postedVideos;

      return (
        <div className="min-h-screen bg-[#000000] text-zinc-100 flex flex-col font-sans">
          {/* HEADER MINIMALISTA NO TOPO (ABINHA PEQUENA + TELONA CHEIA) */}
          <header className="sticky top-0 z-30 bg-[#050505]/95 backdrop-blur-md border-b border-[#141414] px-4 sm:px-6 lg:px-8 py-2.5">
            <div className="flex items-center justify-between gap-3 max-w-[1920px] mx-auto flex-wrap">
              {/* Left: Abinhas (Em Produção / Postados) */}
              <nav className="flex items-center gap-1 bg-[#0a0a0a] p-1 rounded-lg border border-[#1a1a1a]">

                <button
                  type="button"
                  onClick={() => {
                    playSound("click");
                    setActiveTab("producao");
                  }}
                  className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-md text-xs font-black transition active:scale-95 ${
                    activeTab === "producao"
                      ? "bg-[#ff0000] text-white shadow-md shadow-red-600/30"
                      : "text-zinc-400 hover:text-white hover:bg-[#121212]"
                  }`}
                >
                  <span>🎬</span>
                  <span>Em Produção</span>
                  <span
                    className={`text-[10px] px-1.5 py-0.2 rounded-full font-black ${
                      activeTab === "producao"
                        ? "bg-white/25 text-white"
                        : "bg-[#181818] text-zinc-400"
                    }`}
                  >
                    {activeVideos.length}
                  </span>
                </button>

                <button
                  type="button"
                  onClick={() => {
                    playSound("click");
                    setActiveTab("postados");
                  }}
                  className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-md text-xs font-black transition active:scale-95 ${
                    activeTab === "postados"
                      ? "bg-[#ff0000] text-white shadow-md shadow-red-600/30"
                      : "text-zinc-400 hover:text-white hover:bg-[#121212]"
                  }`}
                >
                  <span>✓</span>
                  <span>Postados</span>
                  <span
                    className={`text-[10px] px-1.5 py-0.2 rounded-full font-black ${
                      activeTab === "postados"
                        ? "bg-white/25 text-white"
                        : "bg-[#181818] text-zinc-400"
                    }`}
                  >
                    {postedVideos.length}
                  </span>
                </button>
              </nav>

              {/* Right: Novo Projeto */}
              <div className="flex items-center gap-2.5">
                {/* Indicador de Nuvem / Sincronização PC & Celular */}
                <button
                  type="button"
                  onClick={() => { if (pendingSaveRef.current) saveToCloud(videosRef.current, saveRevisionRef.current); else syncFromCloud(); }}
                  className="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-black transition border cursor-pointer hover:bg-[#141414] active:scale-95"
                  style={{
                    backgroundColor: "#080808",
                    borderColor: cloudStatus === "saving" || cloudStatus === "syncing" ? "#854d0e" : "#1a1a1a",
                    color: cloudStatus === "synced" ? "#34d399" : "#fef08a"
                  }}
                  title="Sincronização automática entre PC e celular. Clique para atualizar agora."
                >
                  <span
                    className={`w-2 h-2 rounded-full ${
                      cloudStatus === "saving" || cloudStatus === "syncing"
                        ? "bg-amber-400 animate-ping"
                        : cloudStatus === "synced" ? "bg-emerald-400" : "bg-amber-400"
                    }`}
                  ></span>
                  <span className="hidden sm:inline">
                    {cloudStatus === "saving"
                      ? "Salvando na Nuvem..."
                      : cloudStatus === "syncing"
                      ? "Sincronizando..."
                      : cloudStatus === "synced" ? "Nuvem sincronizada" : "Sem conexão • tentando novamente"}
                  </span>
                  <span className="sm:hidden">
                    {cloudStatus === "saving" ? "Salvando..." : cloudStatus === "syncing" ? "Sync..." : cloudStatus === "synced" ? "Nuvem OK" : "Sem conexão"}
                  </span>
                  <span className="text-zinc-500 text-[10px]">🔄</span>
                </button>

                <button
                  onClick={addNewVideo}
                  className="flex items-center gap-1.5 bg-[#ff0000] hover:bg-[#e60000] text-white text-xs font-black py-1.5 px-4 rounded-lg shadow-md shadow-red-600/25 transition active:scale-95"
                >
                  <span className="text-sm font-black">＋</span>
                  <span>Novo Projeto</span>
                </button>
              </div>
            </div>
          </header>

          {cloudStatus === "offline" && <div className="schedule-notice" role="status">
            <span>Sem conexão com a nuvem. Suas alterações estão salvas e serão enviadas automaticamente assim que a conexão voltar.</span>
          </div>}
          {newVideo && <div className="schedule-dialog-backdrop" onClick={(e) => {if(e.target === e.currentTarget) setNewVideo(null);}}>
            <div className="schedule-dialog" role="dialog" aria-modal="true" aria-label="Agendar novo vídeo"
              onKeyDown={(e) => {if(e.key === "Escape") setNewVideo(null);}}>
              <button autoFocus type="button" className="dialog-close" aria-label="Fechar agendamento" onClick={() => setNewVideo(null)}>✕</button>
              <PostingCalendar videos={videos} video={newVideo} onMoveVideo={moveCalendarVideo} isNew onCancel={() => setNewVideo(null)} onSchedule={(date) => handleDateChange(newVideo.id, date)} />
            </div>
          </div>}
          {scheduleNotice && <div className="schedule-notice" role="status"><span>{scheduleNotice}</span><button type="button" aria-label="Fechar aviso" onClick={() => setScheduleNotice("")}>✕</button></div>}
          {/* ÁREA DOS VÍDEOS EM TELONA CHEIA */}
          <main className="flex-1 w-full max-w-[1920px] mx-auto p-4 sm:p-6 lg:p-8 space-y-6 overflow-y-auto overflow-x-hidden bg-[#000000]">
            {displayedVideos.length === 0 ? (
              <div className="text-center py-24 bg-[#080808] rounded-2xl border border-[#171717] p-8 max-w-xl mx-auto my-12">
                <span className="text-4xl block mb-3 opacity-60">🎬</span>
                <p className="text-zinc-500 text-sm mb-4 font-semibold">
                  {activeTab === "producao"
                    ? "Nenhum vídeo em produção no momento."
                    : "Nenhum vídeo marcado como postado."}
                </p>
                {activeTab === "producao" && (
                  <button
                    onClick={addNewVideo}
                    className="bg-[#ff0000] hover:bg-[#e60000] text-white text-xs font-black px-4 py-2 rounded-xl transition active:scale-95"
                  >
                    ＋ Criar Primeiro Vídeo
                  </button>
                )}
              </div>
            ) : (
              <div className="space-y-6">
                {displayedVideos.map((video) => {
                  const dayInfo = calculatePostDayInfo(video);
                  const upcomingPostingDays = getUpcomingPostingDates(6);
                  const todayStr = new Date().toISOString().slice(0, 10);

                  const thumbsComplete = Array.isArray(video.thumbs) && video.thumbs.filter(Boolean).length === 3;
                  const completedSteps = PRODUCTION_STEPS.filter(([key]) => video[key]).length + (thumbsComplete ? 1 : 0);
                  const is100Percent = completedSteps === PRODUCTION_STEPS.length + 1;
                  const isCurrentWeekPosted = false;

                  return (
                    <section
                      key={video.id}
                      className={"production-card rounded-2xl p-4 sm:p-5 lg:p-6 shadow-2xl space-y-4 " + (isCurrentWeekPosted ? "bg-[#102a20] border border-[#2f8f62]" : "bg-[#080808] border border-[#1a1a1a]")}
                    >
                      {/* CARD TOOLBAR */}
                      <div className="flex flex-col space-y-3 pb-4 border-b border-[#202026]">
                        {/* Top bar: Badge do Dia + Configurar ⋯ + Botão Postar */}
                        <div className="flex items-center justify-between gap-4 flex-wrap">
                          {/* Left: Badge do Dia com botão de expandir ⋯ */}
                          <div className="flex items-center gap-3 flex-wrap">
                            <div className={"video-date-toolbar flex items-center gap-3 px-4 py-2.5 rounded-2xl shadow-md " + (isCurrentWeekPosted ? "bg-[#153b2b] border border-[#3e9b6b]" : "bg-[#131317] border border-[#2b2b34]")}>
                              <div className="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-zinc-950 text-xl font-black select-none shadow-sm">
                                📅
                              </div>
                              <div className="video-date-summary flex items-center gap-2.5">
                                {video.posted ? (
                                  <div className="flex flex-col gap-1">
                                    <span className="text-base font-black text-emerald-300 uppercase tracking-tight">SEMANA CONCLUÍDA ✓</span>
                                    {isCurrentWeekPosted && <span className="text-[11px] font-bold text-emerald-100/70 uppercase tracking-wide">Vídeo publicado nesta semana</span>}
                                  </div>
                                ) : (
                                  <>
                                    <span className="text-base sm:text-lg font-black text-white uppercase tracking-tight">{dayInfo.weekdayName}</span>
                                    <span className="text-xs font-black text-zinc-200 bg-[#22222a] border border-[#353542] px-2.5 py-1 rounded-lg">{dayInfo.formattedDate}</span>
                                    <span className={`text-[11px] font-black uppercase tracking-wider px-2.5 py-1 rounded-lg border ${dayInfo.badgeColor}`}>{dayInfo.countdownText}</span>
                                  </>
                                )}
                              </div>
                              {!video.posted && (
                                <button
                                  type="button"
                                  onClick={() => toggleDetails(video.id)}
                                  className={`ml-2 px-2.5 py-1 rounded-lg text-xs font-black transition-all cursor-pointer ${
                                    expandedDetails[video.id]
                                      ? "bg-white text-black shadow-md"
                                      : "bg-[#202028] text-zinc-300 hover:text-white hover:bg-[#2c2c38]"
                                  }`}
                                  title={expandedDetails[video.id] ? "Ocultar configurações" : "Configurar data e status"}
                                >
                                  {expandedDetails[video.id] ? "Fechar" : "Configurar"}
                                </button>
                              )}
                            </div>
                          </div>

                          {/* Right: Botão Postar e Lixeira */}
                          <div className="flex items-center gap-2">
                            {!video.posted ? (
                              is100Percent ? (
                                <button
                                  type="button"
                                  onClick={() => markAsPosted(video.id)}
                                  className={`text-xs sm:text-sm font-black px-4 py-2 rounded-xl transition-all duration-200 active:scale-95 flex items-center gap-2 shadow-lg cursor-pointer ${
                                    postingId === video.id
                                      ? "bg-[#10b981] text-white border border-[#10b981] scale-105 shadow-emerald-500/40"
                                      : "bg-emerald-500 hover:bg-emerald-400 text-black border border-emerald-400 shadow-emerald-500/25"
                                  }`}
                                  title="Todas as caixinhas marcadas! Clique para marcar como publicado no YouTube"
                                >
                                  <span>{postingId === video.id ? "✓" : "🚀"}</span>
                                  <span>{postingId === video.id ? "Postando..." : "Vídeo Postado ✓"}</span>
                                </button>
                              ) : (
                                <button
                                  type="button"
                                  disabled
                                  className="text-xs sm:text-sm font-black px-4 py-2 rounded-xl opacity-40 cursor-not-allowed bg-[#18181b] text-zinc-400 border border-[#27272a] flex items-center gap-2 select-none"
                                  title={`Marque todas as caixas de produção para liberar (${completedSteps}/${PRODUCTION_STEPS.length + 1} concluídas)`}
                                >
                                  <span>🔒</span>
                                  <span>Vídeo Postado ({completedSteps}/{PRODUCTION_STEPS.length + 1})</span>
                                </button>
                              )
                            ) : (
                              <button
                                type="button"
                                onClick={() => restoreToProduction(video.id)}
                                className="bg-[#10b981] hover:bg-[#059669] text-white border border-[#10b981] text-xs sm:text-sm font-black px-4 py-2 rounded-xl transition-all active:scale-95 flex items-center gap-1.5 shadow-sm cursor-pointer"
                                title="Vídeo postado! (Clique para voltar a Em Produção)"
                              >
                                <span>✓</span>
                                <span>Postado (Voltar ↩)</span>
                              </button>
                            )}

                            <button
                              onClick={() => deleteVideo(video.id)}
                              className="text-zinc-500 hover:text-red-400 p-2 rounded-xl hover:bg-red-950/40 transition cursor-pointer"
                              title="Excluir Projeto"
                            >
                              🗑️
                            </button>
                          </div>
                        </div>

                        {/* Painel Expansível de Configurações (Some quando fechado!) */}
                        {!video.posted && expandedDetails[video.id] && (
                          <div className="settings-panel">
                            <PublicationDateControl videos={videos} video={video} onSchedule={(date) => handleDateChange(video.id, date)} onMoveVideo={moveCalendarVideo} />
                            <div className="production-checklist">
                              <span className="checklist-count" title="Etapas concluídas">{completedSteps}/{PRODUCTION_STEPS.length + 1}</span>
                              <div className="checklist-items">
                                {PRODUCTION_STEPS.filter(([key]) => key !== "gravarAudioSim" || !Boolean(video.gravarAudioSim)).map(([key, label]) => (
                                  <button key={key} type="button" aria-pressed={!!video[key]}
                                    onClick={() => toggleProcess(video.id, key)}
                                    className={"checklist-item " + (video[key] ? "complete" : "")}>
                                    <span>{label}</span><b>{video[key] ? "✓" : "○"}</b>
                                  </button>
                                ))}
                                <div className={"checklist-item " + (thumbsComplete ? "complete" : "")}>
                                  <span>Thumbs</span><b>{thumbsComplete ? "✓" : (video.thumbs?.filter(Boolean).length || 0) + "/3"}</b>
                                </div>
                              </div>
                            </div>
                          </div>
                        )}
                      </div>

                      {/* 3 Variations: 3 Thumbs + 3 BIG TITLES com Separação Nítida */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-5 lg:gap-6 pt-2">
                        {[0, 1, 2].map((idx) => {
                          const thumb = video.thumbs[idx];
                          const title = video.titles[idx];
                          const titleLength = title.length;

                          return (
                            <div
                              key={idx}
                              className="flex flex-col bg-[#0b0b0e] border border-[#23232a] hover:border-[#383844] p-4 sm:p-5 rounded-2xl transition shadow-xl space-y-4"
                            >
                              {/* Option Header */}
                              <div className="flex items-center justify-between pb-2 border-b border-[#1c1c22]">
                                <span className="text-xs font-black text-white uppercase tracking-wider flex items-center gap-2">
                                  <span className="w-2 h-2 rounded-full bg-white inline-block shadow-sm shadow-white/40"></span>
                                  OPÇÃO {idx + 1}
                                </span>
                                {thumb && (
                                  <span className="text-[10px] font-black uppercase tracking-wider text-emerald-400 bg-emerald-950/40 border border-emerald-800/40 px-2 py-0.5 rounded-md">
                                    Thumb pronta ✓
                                  </span>
                                )}
                              </div>

                              {/* 16:9 Thumbnail Box com moldura nítida */}
                              <div className="space-y-2">
                                <div
                                  className={`relative rounded-xl overflow-hidden cursor-pointer group aspect-video transition duration-200 flex items-center justify-center border-2 ${
                                    thumb
                                      ? "bg-black border-[#2d2d38] hover:border-red-500"
                                      : "bg-[#111116] border-dashed border-[#363644] hover:border-red-500"
                                  }`}
                                  onClick={() =>
                                    document.getElementById(`yt-v14-${video.id}-${idx}`)?.click()
                                  }
                                >
                                  {thumb ? (
                                    <img
                                      src={thumb}
                                      alt={`Opção ${idx + 1}`}
                                      className="w-full h-full object-cover transition duration-300 group-hover:scale-105"
                                    />
                                  ) : (
                                    <div className="relative w-full h-full flex flex-col items-center justify-center p-3 text-zinc-400 group-hover:text-white transition">
                                      <span className="text-3xl mb-1.5 opacity-80 group-hover:scale-110 transition">📁</span>
                                      <span className="text-xs font-black tracking-wider uppercase text-zinc-300">
                                        Subir Thumbnail
                                      </span>
                                      <span className="text-[10px] text-zinc-500 font-bold mt-0.5">
                                        Formato 16:9
                                      </span>
                                    </div>
                                  )}

                                  {thumb && (
                                    <div className="absolute inset-0 bg-black/65 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                                      <span className="text-xs font-black text-white bg-red-600 px-3 py-1.5 rounded-lg shadow-md">
                                        Trocar Thumbnail
                                      </span>
                                    </div>
                                  )}

                                  <input
                                    id={`yt-v14-${video.id}-${idx}`}
                                    type="file"
                                    accept="image/*"
                                    className="hidden"
                                    onChange={(e) => {
                                      const f = e.target.files?.[0];
                                      if (f) updateThumb(video.id, idx, f);
                                    }}
                                  />
                                </div>

                                {thumb && (
                                  <div className="flex justify-end">
                                    <button
                                      type="button"
                                      onClick={() => removeThumb(video.id, idx)}
                                      className="text-xs font-bold text-zinc-500 hover:text-red-400 transition cursor-pointer"
                                    >
                                      Remover foto ✕
                                    </button>
                                  </div>
                                )}
                              </div>

                              {/* LINHA DE SEPARAÇÃO NÍTIDA ENTRE THUMBNAIL E TÍTULO */}
                              <div className="border-t border-[#1c1c24] my-1" />

                              {/* Title Section com caixa e borda visualmente separadas */}
                              <div className="space-y-2 flex-1 flex flex-col justify-between">
                                <div className="flex items-center justify-between text-xs font-bold text-zinc-400">
                                  <span>Título do Vídeo:</span>
                                  <span
                                    className={
                                      titleLength > 90
                                        ? "text-red-400 font-black"
                                        : "text-zinc-500"
                                    }
                                  >
                                    {titleLength} / 100
                                  </span>
                                </div>

                                <textarea
                                  rows={3}
                                  value={title}
                                  onChange={(e) => updateTitle(video.id, idx, e.target.value)}
                                  onInput={(e) => updateTitle(video.id, idx, e.currentTarget.value)}
                                  onBlur={(e) => {
                                    const finalText = e.currentTarget.value.slice(0, 100);
                                    updateTitle(video.id, idx, finalText);
                                    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(videosRef.current)); } catch (err) {}
                                  }}
                                  maxLength={100}
                                  placeholder={`Título em destaque para a Opção ${idx + 1}...`}
                                  className="w-full bg-[#131318] hover:bg-[#16161d] focus:bg-[#16161d] border border-[#2b2b36] focus:border-red-500 focus:ring-1 focus:ring-red-500/25 text-base sm:text-lg font-black text-white p-3.5 rounded-xl focus:outline-none resize-none transition leading-snug placeholder:text-zinc-600 placeholder:font-normal shadow-inner"
                                />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </section>
                  );
                })}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
