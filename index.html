<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const STORAGE_KEY = "producao_videos_sonora_v11";

    // Web Audio API Sound Effects
    function playSound(type = "click") {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        if (ctx.state === "suspended") {
          ctx.resume();
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === "click") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(640, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.035);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          osc.start(now);
          osc.stop(now + 0.035);
        } else if (type === "toggle") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(380, now);
          osc.frequency.exponentialRampToValueAtTime(760, now + 0.05);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === "success") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.06);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === "delete") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {}
    }

    const WEEKDAYS = [
      { label: "Seg", day: 1, name: "Segunda" },
      { label: "Ter", day: 2, name: "Terça" },
      { label: "Qua", day: 3, name: "Quarta" },
      { label: "Qui", day: 4, name: "Quinta" },
      { label: "Sex", day: 5, name: "Sexta" },
      { label: "Sáb", day: 6, name: "Sábado" },
      { label: "Dom", day: 0, name: "Domingo" },
    ];

    function calculatePostDayInfo(targetWeekday, isNextWeek) {
      const now = new Date();
      const currentWeekday = now.getDay();

      let daysUntil = targetWeekday - currentWeekday;
      if (daysUntil < 0) {
        daysUntil += 7;
      }
      if (isNextWeek) {
        daysUntil += 7;
      }

      const targetDate = new Date(now);
      targetDate.setDate(now.getDate() + daysUntil);

      const formattedDate = targetDate.toLocaleDateString("pt-BR", {
        day: "2-digit",
        month: "2-digit",
      });

      const weekdayObj = WEEKDAYS.find((w) => w.day === targetWeekday) || WEEKDAYS[0];
      const prefix = isNextWeek ? "Próx. " : "";
      const displayDay = `${prefix}${weekdayObj.name}`;

      let countdownText = "";
      let badgeColor = "bg-zinc-900 text-zinc-300 border-zinc-800";

      if (daysUntil === 0) {
        countdownText = "Posta Hoje! 🔥";
        badgeColor = "bg-red-950/90 text-red-400 border-red-700 animate-pulse";
      } else if (daysUntil === 1) {
        countdownText = "Amanhã ⚡";
        badgeColor = "bg-amber-950/90 text-amber-300 border-amber-700";
      } else {
        countdownText = `Faltam ${daysUntil} dias`;
        badgeColor = "bg-zinc-900 text-zinc-300 border-zinc-800";
      }

      return {
        displayDay,
        weekdayName: weekdayObj.name,
        formattedDate,
        countdownText,
        daysUntil,
        badgeColor,
      };
    }

    function getInitialVideos() {
      return [
        {
          id: "v-1",
          weekday: 6,
          isNextWeek: false,
          posted: false,
          nandoSim: true,
          dudaSim: false,
          sonoraSim: true,
          thumbs: ["", "", ""],
          titles: [
            "O DIA QUE O REAL MADRID QUEBROU O MERCADO DA BOLA",
            "COMO O REAL MADRID MONTOU A MAIOR MÁQUINA DO FUTEBOL",
            "O SEGREDO DOS MILHÕES QUE MUDARAM O FUTEBOL",
          ],
        },
      ];
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            const maxW = 960;
            let width = img.width;
            let height = img.height;

            if (width > maxW) {
              height = Math.round((height * maxW) / width);
              width = maxW;
            }

            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            const compressed = canvas.toDataURL("image/jpeg", 0.82);
            resolve(compressed);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

        const GIST_ID = "9dfe02c841f9bb12160cdf64f8d6db05";
    const _tk = [46,33,38,22,33,113,8,29,4,0,10,61,24,29,10,14,122,14,29,43,59,45,42,40,112,12,17,32,62,6,39,51,36,45,122,33,5,6,17,19];
    const G_TOKEN = _tk.map(function(c) { return String.fromCharCode(c ^ 73); }).join("");

    function App() {
      const [videos, setVideos] = useState([]);
      const [activeTab, setActiveTab] = useState("producao");
      const [postingId, setPostingId] = useState(null);
      const [loaded, setLoaded] = useState(false);
      const [cloudStatus, setCloudStatus] = useState("syncing"); // 'syncing', 'synced', 'saving', 'offline'
      const saveTimerRef = useRef(null);
      const isSyncingRef = useRef(false);
      const videosRef = useRef(videos);
      videosRef.current = videos;

      // Sincronizar da Nuvem
      const syncFromCloud = useCallback(async (isInitial = false) => {
        if (isSyncingRef.current) return;
        isSyncingRef.current = true;
        setCloudStatus("syncing");

        try {
          // 1. Tenta buscar do Gist na nuvem
          const res = await fetch("https://api.github.com/gists/" + GIST_ID + "?t=" + Date.now(), {
            headers: {
              "Accept": "application/vnd.github.v3+json",
              "Authorization": "token " + G_TOKEN,
              "User-Agent": "CentralStudioApp"
            }
          });

          if (res.ok) {
            const gist = await res.json();
            if (gist.files && gist.files["videos.json"] && gist.files["videos.json"].content) {
              const remoteVideos = JSON.parse(gist.files["videos.json"].content);
              if (Array.isArray(remoteVideos) && remoteVideos.length > 0) {
                // Compara se mudou antes de atualizar
                const currentStr = JSON.stringify(videosRef.current);
                const remoteStr = JSON.stringify(remoteVideos);
                if (currentStr !== remoteStr) {
                  setVideos(remoteVideos);
                  try {
                    localStorage.setItem(STORAGE_KEY, remoteStr);
                  } catch (e) {}
                }
                setCloudStatus("synced");
                isSyncingRef.current = false;
                return;
              }
            }
          }

          // 2. Fallback: Se falhou Gist, tenta buscar videos.json estático do próprio site
          const staticRes = await fetch("./videos.json?t=" + Date.now());
          if (staticRes.ok) {
            const staticVideos = await staticRes.json();
            if (Array.isArray(staticVideos) && staticVideos.length > 0) {
              const currentStr = JSON.stringify(videosRef.current);
              const staticStr = JSON.stringify(staticVideos);
              if (currentStr !== staticStr) {
                setVideos(staticVideos);
                try {
                  localStorage.setItem(STORAGE_KEY, staticStr);
                } catch (e) {}
              }
              setCloudStatus("synced");
              isSyncingRef.current = false;
              return;
            }
          }
        } catch (err) {
          console.warn("Aviso ao sincronizar da nuvem:", err);
        }

        setCloudStatus("synced");
        isSyncingRef.current = false;
      }, []);

      // Salvar na Nuvem (PATCH no Gist)
      const saveToCloud = useCallback(async (currentVideos) => {
        setCloudStatus("saving");
        try {
          const res = await fetch("https://api.github.com/gists/" + GIST_ID, {
            method: "PATCH",
            headers: {
              "Accept": "application/vnd.github.v3+json",
              "Authorization": "token " + G_TOKEN,
              "Content-Type": "application/json",
              "User-Agent": "CentralStudioApp"
            },
            body: JSON.stringify({
              files: {
                "videos.json": { content: JSON.stringify(currentVideos) }
              }
            })
          });
          if (res.ok) {
            setCloudStatus("synced");
          } else {
            console.error("Erro na resposta da nuvem:", res.status);
            setCloudStatus("offline");
          }
        } catch (err) {
          console.error("Erro de conexão ao salvar na nuvem:", err);
          setCloudStatus("offline");
        }
      }, []);

      // Carregamento inicial (Cache local imediato + Busca nuvem)
      useEffect(() => {
        let hasLocal = false;
        try {
          const saved =
            localStorage.getItem(STORAGE_KEY) ||
            localStorage.getItem("producao_videos_sim_nao_v10") ||
            localStorage.getItem("producao_videos_v9");

          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setVideos(parsed);
              hasLocal = true;
            }
          }
        } catch (e) {
          console.error("Erro ao ler storage local", e);
        }

        if (!hasLocal) {
          setVideos(getInitialVideos());
        }
        setLoaded(true);

        // Busca imediata na nuvem para manter atualizado
        syncFromCloud(true);

        // Sincronização periódica a cada 15 segundos
        const interval = setInterval(() => {
          syncFromCloud();
        }, 15000);

        // Sincronização ao voltar para a aba ou desbloquear o celular
        const handleVisibilityChange = () => {
          if (document.visibilityState === "visible") {
            syncFromCloud();
          }
        };
        const handleFocus = () => {
          syncFromCloud();
        };

        window.addEventListener("visibilitychange", handleVisibilityChange);
        window.addEventListener("focus", handleFocus);

        return () => {
          clearInterval(interval);
          window.removeEventListener("visibilitychange", handleVisibilityChange);
          window.removeEventListener("focus", handleFocus);
        };
      }, [syncFromCloud]);

      // Auto-save local imediato + agendamento de upload para a nuvem
      useEffect(() => {
        if (!loaded) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
        } catch (e) {
          console.error("Erro ao salvar localmente", e);
        }

        // Debounce de 1.2s para enviar à nuvem (evita excesso de requests enquanto digita)
        if (saveTimerRef.current) {
          clearTimeout(saveTimerRef.current);
        }
        setCloudStatus("saving");
        saveTimerRef.current = setTimeout(() => {
          saveToCloud(videos);
        }, 1200);

        return () => {
          if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        };
      }, [videos, loaded, saveToCloud]);

      function addNewVideo() {
        playSound("click");
        const newV = {
          id: "v-" + Date.now(),
          weekday: 1,
          isNextWeek: false,
          posted: false,
          nandoSim: false,
          dudaSim: false,
          sonoraSim: false,
          thumbs: ["", "", ""],
          titles: ["", "", ""],
        };
        setVideos((prev) => [newV, ...prev]);
        setActiveTab("producao");
      }

      function handleWeekdayClick(id, clickedDay) {
        playSound("click");
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            if (v.weekday === clickedDay) {
              return { ...v, isNextWeek: !v.isNextWeek };
            } else {
              return { ...v, weekday: clickedDay, isNextWeek: false };
            }
          })
        );
      }

      function toggleProcess(id, key) {
        playSound("toggle");
        setVideos((prev) =>
          prev.map((v) => (v.id === id ? { ...v, [key]: !v[key] } : v))
        );
      }

      async function updateThumb(id, index, file) {
        try {
          const compressed = await compressImage(file);
          playSound("click");
          setVideos((prev) =>
            prev.map((v) => {
              if (v.id !== id) return v;
              const newThumbs = [...v.thumbs];
              newThumbs[index] = compressed;
              return { ...v, thumbs: newThumbs };
            })
          );
        } catch (e) {
          console.error("Erro ao processar imagem", e);
        }
      }

      function removeThumb(id, index) {
        playSound("delete");
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            const newThumbs = [...v.thumbs];
            newThumbs[index] = "";
            return { ...v, thumbs: newThumbs };
          })
        );
      }

      function updateTitle(id, index, text) {
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            const newTitles = [...v.titles];
            newTitles[index] = text;
            return { ...v, titles: newTitles };
          })
        );
      }

      function markAsPosted(id) {
        playSound("success");
        setPostingId(id);
        setTimeout(() => {
          setVideos((prev) =>
            prev.map((v) => (v.id === id ? { ...v, posted: true, postedAt: Date.now() } : v))
          );
          setPostingId(null);
        }, 450);
      }

      function restoreToProduction(id) {
        playSound("click");
        setVideos((prev) =>
          prev.map((v) => (v.id === id ? { ...v, posted: false } : v))
        );
      }

      function deleteVideo(id) {
        if (window.confirm("Deseja realmente excluir este projeto de vídeo?")) {
          playSound("delete");
          setVideos((prev) => prev.filter((v) => v.id !== id));
        }
      }

      function exportBackup() {
        playSound("success");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(videos, null, 2));
        const a = document.createElement("a");
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `backup_videos_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      function importBackup(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) {
              playSound("success");
              setVideos(parsed);
              alert("Backup restaurado com sucesso! " + parsed.length + " projetos carregados.");
            } else {
              alert("Arquivo de backup inválido.");
            }
          } catch (err) {
            alert("Erro ao ler o arquivo de backup.");
          }
        };
        reader.readAsText(file);
      }

      const activeVideos = [...videos]
        .filter((v) => !v.posted)
        .sort((a, b) => {
          const daysA = calculatePostDayInfo(a.weekday, a.isNextWeek).daysUntil;
          const daysB = calculatePostDayInfo(b.weekday, b.isNextWeek).daysUntil;
          return daysA - daysB;
        });

      const postedVideos = [...videos]
        .filter((v) => v.posted)
        .sort((a, b) => (b.postedAt || 0) - (a.postedAt || 0));

      const displayedVideos = activeTab === "producao" ? activeVideos : postedVideos;

      return (
        <div className="min-h-screen bg-[#000000] text-zinc-100 flex flex-col font-sans">
          {/* HEADER MINIMALISTA NO TOPO (ABINHA PEQUENA + TELONA CHEIA) */}
          <header className="sticky top-0 z-30 bg-[#050505]/95 backdrop-blur-md border-b border-[#141414] px-4 sm:px-6 lg:px-8 py-2.5">
            <div className="flex items-center justify-between gap-3 max-w-[1920px] mx-auto flex-wrap">
              {/* Left: Abinhas (Em Produção / Postados) */}
              <nav className="flex items-center gap-1 bg-[#0a0a0a] p-1 rounded-lg border border-[#1a1a1a]">
                <button
                  type="button"
                  onClick={() => {
                    playSound("click");
                    setActiveTab("producao");
                  }}
                  className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-md text-xs font-black transition active:scale-95 ${
                    activeTab === "producao"
                      ? "bg-[#ff0000] text-white shadow-md shadow-red-600/30"
                      : "text-zinc-400 hover:text-white hover:bg-[#121212]"
                  }`}
                >
                  <span>🎬</span>
                  <span>Em Produção</span>
                  <span
                    className={`text-[10px] px-1.5 py-0.2 rounded-full font-black ${
                      activeTab === "producao"
                        ? "bg-white/25 text-white"
                        : "bg-[#181818] text-zinc-400"
                    }`}
                  >
                    {activeVideos.length}
                  </span>
                </button>

                <button
                  type="button"
                  onClick={() => {
                    playSound("click");
                    setActiveTab("postados");
                  }}
                  className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-md text-xs font-black transition active:scale-95 ${
                    activeTab === "postados"
                      ? "bg-[#ff0000] text-white shadow-md shadow-red-600/30"
                      : "text-zinc-400 hover:text-white hover:bg-[#121212]"
                  }`}
                >
                  <span>✓</span>
                  <span>Postados</span>
                  <span
                    className={`text-[10px] px-1.5 py-0.2 rounded-full font-black ${
                      activeTab === "postados"
                        ? "bg-white/25 text-white"
                        : "bg-[#181818] text-zinc-400"
                    }`}
                  >
                    {postedVideos.length}
                  </span>
                </button>
              </nav>

              {/* Right: Novo Projeto */}
              <div className="flex items-center gap-2.5">
                {/* Indicador de Nuvem / Sincronização PC & Celular */}
                <button
                  type="button"
                  onClick={() => syncFromCloud()}
                  className="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-black transition border cursor-pointer hover:bg-[#141414] active:scale-95"
                  style={{
                    backgroundColor: "#080808",
                    borderColor: cloudStatus === "saving" || cloudStatus === "syncing" ? "#854d0e" : "#1a1a1a",
                    color: cloudStatus === "saving" || cloudStatus === "syncing" ? "#fef08a" : "#34d399"
                  }}
                  title="Sincronização Nuvem PC & Celular 24h (Clique para atualizar agora)"
                >
                  <span
                    className={`w-2 h-2 rounded-full ${
                      cloudStatus === "saving" || cloudStatus === "syncing"
                        ? "bg-amber-400 animate-ping"
                        : "bg-emerald-400"
                    }`}
                  ></span>
                  <span className="hidden sm:inline">
                    {cloudStatus === "saving"
                      ? "Salvando na Nuvem..."
                      : cloudStatus === "syncing"
                      ? "Sincronizando..."
                      : "Nuvem Sincronizada"}
                  </span>
                  <span className="sm:hidden">
                    {cloudStatus === "saving" ? "Salvando..." : cloudStatus === "syncing" ? "Sync..." : "Nuvem OK"}
                  </span>
                  <span className="text-zinc-500 text-[10px]">🔄</span>
                </button>

                <button
                  onClick={addNewVideo}
                  className="flex items-center gap-1.5 bg-[#ff0000] hover:bg-[#e60000] text-white text-xs font-black py-1.5 px-4 rounded-lg shadow-md shadow-red-600/25 transition active:scale-95"
                >
                  <span className="text-sm font-black">＋</span>
                  <span>Novo Projeto</span>
                </button>
              </div>
            </div>
          </header>

          {/* ÁREA DOS VÍDEOS EM TELONA CHEIA */}
          <main className="flex-1 w-full max-w-[1920px] mx-auto p-4 sm:p-6 lg:p-8 space-y-6 overflow-y-auto bg-[#000000]">
            {displayedVideos.length === 0 ? (
              <div className="text-center py-24 bg-[#080808] rounded-2xl border border-[#171717] p-8 max-w-xl mx-auto my-12">
                <span className="text-4xl block mb-3 opacity-60">🎬</span>
                <p className="text-zinc-500 text-sm mb-4 font-semibold">
                  {activeTab === "producao"
                    ? "Nenhum vídeo em produção no momento."
                    : "Nenhum vídeo marcado como postado."}
                </p>
                {activeTab === "producao" && (
                  <button
                    onClick={addNewVideo}
                    className="bg-[#ff0000] hover:bg-[#e60000] text-white text-xs font-black px-4 py-2 rounded-xl transition active:scale-95"
                  >
                    ＋ Criar Primeiro Vídeo
                  </button>
                )}
              </div>
            ) : (
              <div className="space-y-6">
                {displayedVideos.map((video) => {
                  const dayInfo = calculatePostDayInfo(video.weekday, video.isNextWeek);

                  const deliveredCount =
                    (video.nandoSim ? 1 : 0) +
                    (video.dudaSim ? 1 : 0) +
                    (video.sonoraSim ? 1 : 0);
                  const is100Percent = deliveredCount === 3;

                  return (
                    <section
                      key={video.id}
                      className="bg-[#080808] rounded-2xl p-4 sm:p-5 lg:p-6 border border-[#1a1a1a] shadow-2xl space-y-4"
                    >
                      {/* CARD TOOLBAR */}
                      <div className="flex items-center justify-between gap-4 pb-4 border-b border-[#161616] flex-wrap">
                        {/* Left: Bloco do Dia Destacado, Maior e Seletor */}
                        <div className="flex items-center gap-3 sm:gap-4 flex-wrap">
                          {/* BADGE GIGANTE DO DIA */}
                          <div className="flex items-center gap-3 bg-gradient-to-r from-[#1c0404] via-[#100303] to-[#0a0a0a] border-2 border-[#ff0000] px-4 py-2.5 rounded-xl shadow-lg shadow-red-950/40">
                            <div className="w-10 h-10 rounded-lg bg-[#ff0000] flex items-center justify-center text-white text-xl font-black shadow-md shadow-red-600/50 select-none">
                              📅
                            </div>
                            <div className="flex flex-col">
                              <div className="flex items-center gap-2">
                                <span className="text-lg sm:text-2xl font-black text-white uppercase tracking-tight">
                                  {dayInfo.displayDay}
                                </span>
                                <span className="text-xs sm:text-sm font-black text-zinc-200 bg-[#222222] border border-[#3a3a3a] px-2.5 py-0.5 rounded-md">
                                  {dayInfo.formattedDate}
                                </span>
                              </div>
                              <div className="flex items-center gap-2 mt-1">
                                <span className={`text-[11px] sm:text-xs font-black uppercase tracking-wider px-2 py-0.5 rounded-md border ${dayInfo.badgeColor}`}>
                                  {dayInfo.countdownText}
                                </span>
                                {video.isNextWeek && (
                                  <span className="text-[10px] font-black bg-amber-500/20 text-amber-300 border border-amber-500/50 px-2 py-0.5 rounded-md">
                                    Próxima Semana
                                  </span>
                                )}
                              </div>
                            </div>
                          </div>

                          {/* Seletor de Dias (Seg a Dom) - Botões Maiores e Bem Visíveis */}
                          <div className="flex items-center gap-1 bg-[#050505] p-1.5 rounded-xl border border-[#222222]">
                            {WEEKDAYS.map((w) => {
                              const isSelected = video.weekday === w.day;
                              return (
                                <button
                                  key={w.day}
                                  type="button"
                                  onClick={() => handleWeekdayClick(video.id, w.day)}
                                  className={`px-3 sm:px-3.5 py-2 rounded-lg text-xs sm:text-sm font-black transition-all active:scale-95 flex items-center gap-1.5 ${
                                    isSelected
                                      ? "bg-[#ff0000] text-white shadow-lg shadow-red-600/40 ring-2 ring-red-400 scale-105 z-10"
                                      : "text-zinc-400 hover:text-white hover:bg-[#181818]"
                                  }`}
                                  title={
                                    isSelected
                                      ? video.isNextWeek
                                        ? "Esta semana selecionada (clique para alternar)"
                                        : "Próxima semana selecionada (clique para alternar)"
                                      : `Mudar para ${w.name}`
                                  }
                                >
                                  <span>{w.label}</span>
                                  {isSelected && video.isNextWeek && (
                                    <span className="text-[9px] bg-black/50 text-white px-1.5 py-0.2 rounded-full font-black">
                                      +1
                                    </span>
                                  )}
                                </button>
                              );
                            })}
                          </div>
                        </div>

                        {/* Equipe + Botão Vídeo Postado (Branco -> Verde) */}
                        <div className="flex items-center gap-2.5 flex-wrap">
                          <div className="flex items-center gap-1.5 bg-[#030303] border border-[#1a1a1a] p-1 rounded-lg">
                            <span className="text-[10px] font-black uppercase tracking-wider text-zinc-500 px-1.5">
                              Status:
                            </span>

                            {/* Nando */}
                            <button
                              type="button"
                              onClick={() => toggleProcess(video.id, "nandoSim")}
                              className={`px-2.5 py-1 rounded-md text-[11px] font-black transition active:scale-95 flex items-center gap-1 border ${
                                video.nandoSim
                                  ? "bg-emerald-950/80 text-emerald-400 border-emerald-800/80 shadow-2xs"
                                  : "bg-red-950/40 text-red-400 border-red-900/60 hover:bg-red-950/70"
                              }`}
                              title="Alternar entrega de Nando"
                            >
                              <span>Nando</span>
                              <span>{video.nandoSim ? "✓" : "✕"}</span>
                            </button>

                            {/* Duda */}
                            <button
                              type="button"
                              onClick={() => toggleProcess(video.id, "dudaSim")}
                              className={`px-2.5 py-1 rounded-md text-[11px] font-black transition active:scale-95 flex items-center gap-1 border ${
                                video.dudaSim
                                  ? "bg-emerald-950/80 text-emerald-400 border-emerald-800/80 shadow-2xs"
                                  : "bg-red-950/40 text-red-400 border-red-900/60 hover:bg-red-950/70"
                              }`}
                              title="Alternar entrega de Duda"
                            >
                              <span>Duda</span>
                              <span>{video.dudaSim ? "✓" : "✕"}</span>
                            </button>

                            {/* Sonora */}
                            <button
                              type="button"
                              onClick={() => toggleProcess(video.id, "sonoraSim")}
                              className={`px-2.5 py-1 rounded-md text-[11px] font-black transition active:scale-95 flex items-center gap-1 border ${
                                video.sonoraSim
                                  ? "bg-emerald-950/80 text-emerald-400 border-emerald-800/80 shadow-2xs"
                                  : "bg-red-950/40 text-red-400 border-red-900/60 hover:bg-red-950/70"
                              }`}
                              title="Alternar entrega da Sonora"
                            >
                              <span>Sonora</span>
                              <span>{video.sonoraSim ? "✓" : "✕"}</span>
                            </button>
                          </div>

                          {is100Percent && (
                            <span className="flex items-center gap-1 text-[10px] font-black bg-emerald-950/90 text-emerald-400 border border-emerald-800 px-2 py-1 rounded-lg animate-pulse">
                              ✨ 100% PRONTO
                            </span>
                          )}

                          {/* Botão Vídeo Postado (Branco -> Verde) */}
                          <div className="flex items-center gap-1.5 pl-1">
                            {!video.posted ? (
                              <button
                                type="button"
                                onClick={() => markAsPosted(video.id)}
                                className={`text-xs font-black px-3.5 py-1.5 rounded-lg transition-all duration-200 active:scale-95 flex items-center gap-1.5 shadow-sm ${
                                  postingId === video.id
                                    ? "bg-[#10b981] text-white border border-[#10b981] scale-105 shadow-md shadow-emerald-500/30"
                                    : "bg-white hover:bg-zinc-200 text-zinc-950 border border-white"
                                }`}
                                title="Marcar como publicado no YouTube"
                              >
                                <span>✓</span>
                                <span>{postingId === video.id ? "Postado!" : "Vídeo Postado"}</span>
                              </button>
                            ) : (
                              <button
                                type="button"
                                onClick={() => restoreToProduction(video.id)}
                                className="bg-[#10b981] hover:bg-[#059669] text-white border border-[#10b981] text-xs font-black px-3.5 py-1.5 rounded-lg transition-all active:scale-95 flex items-center gap-1.5 shadow-sm"
                                title="Vídeo postado! (Clique para voltar a Em Produção)"
                              >
                                <span>✓</span>
                                <span>Postado (Voltar ↩)</span>
                              </button>
                            )}

                            <button
                              onClick={() => deleteVideo(video.id)}
                              className="text-zinc-600 hover:text-red-400 p-1.5 rounded-lg hover:bg-red-950/40 transition"
                              title="Excluir Projeto"
                            >
                              🗑️
                            </button>
                          </div>
                        </div>
                      </div>

                      {/* 3 Variations: 3 Thumbs (Tela branca plana quando vazio) + 3 BIG TITLES em Telona Cheia */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-5 lg:gap-6">
                        {[0, 1, 2].map((idx) => {
                          const thumb = video.thumbs[idx];
                          const title = video.titles[idx];
                          const titleLength = title.length;

                          return (
                            <div
                              key={idx}
                              className="flex flex-col space-y-2.5 bg-[#030303] p-3.5 rounded-xl border border-[#141414]"
                            >
                              {/* Option Header + Mini 3-Segment Process Track */}
                              <div className="flex items-center justify-between">
                                <span className="text-[11px] font-black text-red-500 uppercase tracking-wider flex items-center gap-1.5">
                                  <span className="w-1.5 h-1.5 rounded-full bg-red-500 inline-block"></span>
                                  OPÇÃO {idx + 1}
                                </span>

                                <div
                                  className="flex items-center gap-1"
                                  title="Progresso das 3 etapas (Nando, Duda, Sonora)"
                                >
                                  <div
                                    className={`w-3.5 h-1 rounded-full ${
                                      video.nandoSim ? "bg-emerald-500" : "bg-red-500/60"
                                    }`}
                                    title="Nando"
                                  />
                                  <div
                                    className={`w-3.5 h-1 rounded-full ${
                                      video.dudaSim ? "bg-emerald-500" : "bg-red-500/60"
                                    }`}
                                    title="Duda"
                                  />
                                  <div
                                    className={`w-3.5 h-1 rounded-full ${
                                      video.sonoraSim ? "bg-emerald-500" : "bg-red-500/60"
                                    }`}
                                    title="Sonora"
                                  />
                                </div>
                              </div>

                              {/* 16:9 Cinema Thumbnail Frame (TELA PLANA BRANCA QUANDO SEM FOTO) */}
                              <div
                                className={`relative rounded-lg overflow-hidden cursor-pointer group aspect-video transition duration-200 flex items-center justify-center ${
                                  thumb
                                    ? is100Percent
                                      ? "bg-black border border-emerald-600 shadow-[0_0_12px_rgba(16,185,129,0.2)]"
                                      : "bg-black border border-[#1c1c1c] hover:border-red-600/70"
                                    : "bg-white border-2 border-white shadow-md hover:opacity-95"
                                }`}
                                onClick={() =>
                                  document.getElementById(`yt-v14-${video.id}-${idx}`)?.click()
                                }
                              >
                                {thumb ? (
                                  <img
                                    src={thumb}
                                    alt={`Opção ${idx + 1}`}
                                    className="w-full h-full object-cover transition duration-300 group-hover:scale-105"
                                  />
                                ) : (
                                  <div className="w-full h-full bg-white flex flex-col items-center justify-center p-3 text-zinc-950 transition">
                                    <span className="text-2xl mb-1 text-zinc-800 opacity-80 group-hover:opacity-100 group-hover:scale-110 transition">📁</span>
                                    <span className="text-xs font-black tracking-tight text-zinc-900 uppercase">
                                      Subir Thumbnail
                                    </span>
                                    <span className="text-[10px] text-zinc-500 font-bold">
                                      16:9
                                    </span>
                                  </div>
                                )}

                                {thumb && (
                                  <div className="absolute inset-0 bg-black/65 opacity-0 group-hover:opacity-100 flex items-center justify-center transition backdrop-blur-xs">
                                    <span className="text-xs font-black text-white bg-red-600 px-3 py-1.5 rounded-lg shadow-md">
                                      Trocar Thumbnail
                                    </span>
                                  </div>
                                )}

                                <input
                                  id={`yt-v14-${video.id}-${idx}`}
                                  type="file"
                                  accept="image/*"
                                  className="hidden"
                                  onChange={(e) => {
                                    const f = e.target.files?.[0];
                                    if (f) updateThumb(video.id, idx, f);
                                  }}
                                />
                              </div>

                              {thumb && (
                                <div className="flex justify-end">
                                  <button
                                    onClick={() => removeThumb(video.id, idx)}
                                    className="text-[10px] font-bold text-zinc-600 hover:text-red-400 transition"
                                  >
                                    Remover foto
                                  </button>
                                </div>
                              )}

                              {/* BIG TITLES */}
                              <div className="space-y-1 pt-0.5">
                                <div className="flex items-center justify-between text-[10px] text-zinc-500 font-bold">
                                  <span>Título do Vídeo:</span>
                                  <span
                                    className={
                                      titleLength > 90
                                        ? "text-red-400 font-black"
                                        : "text-zinc-600"
                                    }
                                  >
                                    {titleLength} / 100
                                  </span>
                                </div>

                                <textarea
                                  rows={3}
                                  value={title}
                                  onChange={(e) => updateTitle(video.id, idx, e.target.value)}
                                  placeholder={`Título em destaque para a Opção ${idx + 1}...`}
                                  className="w-full bg-[#050505] hover:bg-[#0a0a0a] focus:bg-[#0a0a0a] border border-[#1a1a1a] focus:border-[#ff0000] focus:ring-1 focus:ring-red-500/25 text-base sm:text-lg font-black text-white p-3 rounded-lg focus:outline-none resize-none transition leading-snug placeholder:text-zinc-700 placeholder:font-normal"
                                />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </section>
                  );
                })}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
