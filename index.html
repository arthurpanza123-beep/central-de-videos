  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // Web Audio API Sound Effects
    function playSound(type = "click") {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        if (ctx.state === "suspended") {
          ctx.resume();
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === "click") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(640, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.035);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          osc.start(now);
          osc.stop(now + 0.035);
        } else if (type === "toggle") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(380, now);
          osc.frequency.exponentialRampToValueAtTime(760, now + 0.05);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === "success") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.06);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === "delete") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {}
    }

    const WEEKDAYS = [
      { label: "Seg", day: 1, name: "Segunda" },
      { label: "Ter", day: 2, name: "Terça" },
      { label: "Qua", day: 3, name: "Quarta" },
      { label: "Qui", day: 4, name: "Quinta" },
      { label: "Sex", day: 5, name: "Sexta" },
      { label: "Sáb", day: 6, name: "Sábado" },
      { label: "Dom", day: 0, name: "Domingo" },
    ];
    const POSTING_DAYS = new Set([3, 4, 6, 0]); // quarta, quinta, sábado e domingo
    const PRODUCTION_STEPS = [
      ["nandoSim", "Nando"], ["dudaSim", "Duda"], ["sonoraSim", "Sonora"],
      ["legendasSim", "Legendas"], ["tvSim", "Vídeos TV"], ["depoisSim", "Depois"],

    function getWeekMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      date.setDate(date.getDate() + diff);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function getWeekOffsetFromDate(dateStr) {
      if (!dateStr || typeof dateStr !== "string") return 0;
      const parts = dateStr.split("-").map(Number);
      if (parts.length < 3 || isNaN(parts[0])) return 0;
      const targetDate = new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0, 0);
      const videoMonday = getWeekMonday(targetDate);
      const currentMonday = getWeekMonday(new Date());
      const diffMs = videoMonday.getTime() - currentMonday.getTime();
      return Math.round(diffMs / (7 * 24 * 60 * 60 * 1000));
    }

    function getVideoScheduledDate(video) {
      if (!video) return new Date().toISOString().slice(0, 10);
      if (video.scheduledDate) return video.scheduledDate;
      if (video.posted && video.postedAt) {
        const d = new Date(video.postedAt);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }
      const safeOffset = Number(video.weekOffset) || 0;
      const now = new Date();
      const currentMonday = getWeekMonday(now);
      const targetMonday = new Date(currentMonday);
      targetMonday.setDate(currentMonday.getDate() + safeOffset * 7);
      const targetWeekday = typeof video.weekday === "number" ? video.weekday : 4;
      const dayOffsetFromMonday = targetWeekday === 0 ? 6 : targetWeekday - 1;
      const targetDate = new Date(targetMonday);
      targetDate.setDate(targetMonday.getDate() + dayOffsetFromMonday);
      const y = targetDate.getFullYear();
      const m = String(targetDate.getMonth() + 1).padStart(2, "0");
      const day = String(targetDate.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function getUpcomingPostingDates(count = 6) {
      const result = [];
      const cur = new Date();
      cur.setHours(0, 0, 0, 0);
      for (let i = 0; i < 30 && result.length < count; i++) {
        const d = new Date(cur);
        d.setDate(cur.getDate() + i);
        const dayOfWeek = d.getDay();
        if (POSTING_DAYS.has(dayOfWeek)) {
          const wObj = WEEKDAYS.find((w) => w.day === dayOfWeek) || WEEKDAYS[0];
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const dayNum = String(d.getDate()).padStart(2, "0");
          const dateStr = `${y}-${m}-${dayNum}`;
          const formatted = d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
          result.push({
            dateStr,
            label: `${wObj.label} ${formatted}`,
            weekdayName: wObj.name,
            isToday: i === 0,
            isTomorrow: i === 1,
          });
        }
      }
      return result;
    }

    function calculatePostDayInfo(videoOrWeekday, weekOffset = 0, postedAt = null) {
      let targetDate;
      let isPosted = false;

      if (typeof videoOrWeekday === "object" && videoOrWeekday !== null) {
        const v = videoOrWeekday;
        if (v.posted && v.postedAt) {
          targetDate = new Date(v.postedAt);
          isPosted = true;
        } else {
          const dateStr = getVideoScheduledDate(v);
          const parts = dateStr.split("-").map(Number);
          targetDate = new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0, 0);
        }
      } else if (postedAt) {
        targetDate = new Date(postedAt);
        isPosted = true;
      } else {
        const targetWeekday = Number(videoOrWeekday) || 0;
        const safeOffset = Math.max(-52, Math.min(52, Number(weekOffset) || 0));
        const now = new Date();
        const currentMonday = getWeekMonday(now);
        const targetMonday = new Date(currentMonday);
        targetMonday.setDate(currentMonday.getDate() + safeOffset * 7);
        const dayOffsetFromMonday = targetWeekday === 0 ? 6 : targetWeekday - 1;
        targetDate = new Date(targetMonday);
        targetDate.setDate(targetMonday.getDate() + dayOffsetFromMonday);
        targetDate.setHours(0, 0, 0, 0);
      }

      const weekdayObj = WEEKDAYS.find((w) => w.day === targetDate.getDay()) || WEEKDAYS[0];
      const formattedDate = targetDate.toLocaleDateString("pt-BR", {
        day: "2-digit",
        month: "2-digit",
      });
      const y = targetDate.getFullYear();
      const m = String(targetDate.getMonth() + 1).padStart(2, "0");
      const day = String(targetDate.getDate()).padStart(2, "0");
      const fullDateStr = `${y}-${m}-${day}`;

      const now = new Date();
      const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
      const diffTime = targetDate.getTime() - todayMidnight.getTime();
      const daysUntil = Math.round(diffTime / (24 * 60 * 60 * 1000));

      let countdownText = "";
      let badgeColor = "bg-zinc-900 text-zinc-300 border-zinc-800";

      if (isPosted) {
        countdownText = "Postado";
        badgeColor = "bg-zinc-900 text-zinc-300 border-zinc-800";
      } else if (daysUntil === 0) {
        countdownText = "Posta Hoje! 🔥";
        badgeColor = "bg-red-950/90 text-red-400 border-red-700 animate-pulse";
      } else if (daysUntil === 1) {
        countdownText = "Amanhã ⚡";
        badgeColor = "bg-amber-950/90 text-amber-300 border-amber-700";
      } else if (daysUntil > 1) {
        countdownText = `Faltam ${daysUntil} dias`;
        badgeColor = "bg-zinc-900 text-zinc-300 border-zinc-800";
      } else {
        countdownText = daysUntil === -1 ? "Ontem" : `Passou há ${Math.abs(daysUntil)} dias`;
        badgeColor = "bg-zinc-900 text-zinc-400 border-zinc-800";
      }

      const offset = getWeekOffsetFromDate(fullDateStr);
      const weekTag = offset === 0 ? "Esta semana" : offset === 1 ? "Próxima semana" : offset > 1 ? `Semana +${offset}` : `${Math.abs(offset)} semanas atrás`;

      return {
        dateStr: fullDateStr,
        displayDay: weekdayObj.name,
        weekdayName: weekdayObj.name,
        formattedDate,
        countdownText,
        daysUntil,
        weekOffset: offset,
        weekTag,
        targetDate,
        timestamp: targetDate.getTime(),
        badgeColor,
      };
    }

    function getVideoWeekOffset(video) {
      if (video.posted && video.postedAt) {
        const postMonday = getWeekMonday(video.postedAt);
        const currentMonday = getWeekMonday(new Date());
        const diffDays = Math.round((postMonday.getTime() - currentMonday.getTime()) / (24 * 60 * 60 * 1000));
        return Math.round(diffDays / 7);
      }
      const dateStr = getVideoScheduledDate(video);
      return getWeekOffsetFromDate(dateStr);
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            const maxW = 960;
            let width = img.width;
            let height = img.height;

            if (width > maxW) {
              height = Math.round((height * maxW) / width);
              width = maxW;
            }

            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            const compressed = canvas.toDataURL("image/jpeg", 0.82);
            resolve(compressed);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function App() {

      const saveTimerRef = useRef(null);
      const isSyncingRef = useRef(false);
      const pendingSaveRef = useRef(false);
      const saveRevisionRef = useRef(0);
      const skipNextSaveRef = useRef(true);
      const loadedRef = useRef(loaded);
      const videosRef = useRef(videos);
      videosRef.current = videos;
      loadedRef.current = loaded;

      // Sincronizar da Nuvem
      const syncFromCloud = useCallback(async (isInitial = false) => {
        if (isSyncingRef.current) return;
        if (loadedRef.current && pendingSaveRef.current) {
          setCloudStatus("saving");
          return;
        }
        isSyncingRef.current = true;
        setCloudStatus("syncing");

        try {
          // 1. Tenta buscar do Gist na nuvem
          const res = await fetch("https://api.github.com/gists/" + GIST_ID + "?t=" + Date.now(), {
            headers: {
              "Accept": "application/vnd.github.v3+json",
              "Authorization": "token " + G_TOKEN,

          });

          if (res.ok) {
            const gist = await res.json();
            if (gist.files && gist.files["videos.json"] && gist.files["videos.json"].content) {
              const cloudFile = gist.files["videos.json"];
              // A API do Gist devolve `content` cortado quando o arquivo passa
              // de 1 MB. Nesse caso, baixa o arquivo completo pelo raw_url antes
              // de converter o JSON — assim PC e celular recebem o mesmo estado.
              let cloudContent = cloudFile.content;
              if (cloudFile.truncated && cloudFile.raw_url) {
                // O raw_url já é o link seguro do Gist. Não mandamos o token
                // aqui porque o domínio de arquivos não aceita esse cabeçalho
                // em requisições do navegador (CORS).
                const rawRes = await fetch(cloudFile.raw_url + "?t=" + Date.now());
                if (!rawRes.ok) throw new Error("Não foi possível baixar os dados completos da nuvem.");
                cloudContent = await rawRes.text();
              }
              const remoteVideos = JSON.parse(cloudContent);
              if (Array.isArray(remoteVideos) && remoteVideos.length > 0) {
                // Compara se mudou antes de atualizar
                const currentStr = JSON.stringify(videosRef.current);
                const remoteStr = JSON.stringify(remoteVideos);
                if (currentStr !== remoteStr) {
                  setVideos(remoteVideos);
                  try {
                    localStorage.setItem(STORAGE_KEY, remoteStr);
                  } catch (e) {}
                }
                setCloudStatus("synced");
                isSyncingRef.current = false;
                return;
              }
            }
          }

          // 2. Fallback: Se falhou Gist, tenta buscar videos.json estático do próprio site
          const staticRes = await fetch("./videos.json?t=" + Date.now());
          if (staticRes.ok) {
            const staticVideos = await staticRes.json();
            if (Array.isArray(staticVideos) && staticVideos.length > 0) {
              const currentStr = JSON.stringify(videosRef.current);
              const staticStr = JSON.stringify(staticVideos);
              if (currentStr !== staticStr) {
                setVideos(staticVideos);
                try {
                  localStorage.setItem(STORAGE_KEY, staticStr);
                } catch (e) {}
              }
              setCloudStatus("synced");
              isSyncingRef.current = false;
              return;
            }
          }
        } catch (err) {
          console.warn("Aviso ao sincronizar da nuvem:", err);
        }

        setCloudStatus("synced");
        isSyncingRef.current = false;
      }, []);

      // Salvar na Nuvem (PATCH no Gist)
      const saveToCloud = useCallback(async (currentVideos, revision) => {
        setCloudStatus("saving");
        try {
          const res = await fetch("https://api.github.com/gists/" + GIST_ID, {
            method: "PATCH",
            headers: {
              "Accept": "application/vnd.github.v3+json",
              "Authorization": "token " + G_TOKEN,
              "Content-Type": "application/json",
              "User-Agent": "CentralStudioApp"
            },
            body: JSON.stringify({
              files: {
                "videos.json": { content: JSON.stringify(currentVideos) }
              }
            })
          });
          if (res.ok) {
            if (revision === saveRevisionRef.current) {
              pendingSaveRef.current = false;
              setCloudStatus("synced");
            }
          } else {
            console.error("Erro na resposta da nuvem:", res.status);
            if (revision === saveRevisionRef.current) {
              pendingSaveRef.current = false;
              setCloudStatus("offline");
            }
          }
        } catch (err) {
          console.error("Erro de conexão ao salvar na nuvem:", err);
          if (revision === saveRevisionRef.current) {
            pendingSaveRef.current = false;
            setCloudStatus("offline");
          }
        }
      }, []);

      // Carregamento inicial (Cache local imediato + Busca nuvem)
      useEffect(() => {
        let hasLocal = false;
        try {
          const saved =
            localStorage.getItem(STORAGE_KEY) ||
            localStorage.getItem("producao_videos_sim_nao_v10") ||
            localStorage.getItem("producao_videos_v9");

          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setVideos(parsed);
              hasLocal = true;
            }
          }
        } catch (e) {
          console.error("Erro ao ler storage local", e);
        }

        if (!hasLocal) setVideos(getInitialVideos());

        // A primeira leitura acontece antes de liberar qualquer gravação. Isso
        // impede que a abertura da página salve um estado vazio na nuvem.
        (async () => {
          await syncFromCloud(true);
          skipNextSaveRef.current = true;
          setLoaded(true);
        })();
      }, [syncFromCloud]);

      // Auto-save local imediato + agendamento de upload para a nuvem
      useEffect(() => {
        if (!loaded) return;
        if (skipNextSaveRef.current) {
          skipNextSaveRef.current = false;
          return;
        }
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
        } catch (e) {
          console.error("Erro ao salvar localmente", e);
        }

        // Debounce de 1.2s para enviar à nuvem (evita excesso de requests enquanto digita)
        if (saveTimerRef.current) {
          clearTimeout(saveTimerRef.current);
        }
        const revision = ++saveRevisionRef.current;
        pendingSaveRef.current = true;
        setCloudStatus("saving");
        saveTimerRef.current = setTimeout(() => {
          saveToCloud(videos, revision);
        }, 1200);

        return () => {
          if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        };
      }, [videos, loaded, saveToCloud]);

      function addNewVideo() {
        playSound("click");
        const nextDates = getUpcomingPostingDates(1);
        const defaultDate = nextDates.length > 0 ? nextDates[0].dateStr : new Date().toISOString().slice(0, 10);
        const parts = defaultDate.split("-").map(Number);
        const dt = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
        const newV = {
          id: "v-" + Date.now(),
          scheduledDate: defaultDate,
          weekday: dt.getDay(),
          weekOffset: getWeekOffsetFromDate(defaultDate),
          posted: false,
          nandoSim: false,
          dudaSim: false,
          sonoraSim: false,
          legendasSim: false, tvSim: false, depoisSim: false, coloracaoSim: false, finalizacaoSim: false,
          thumbs: ["", "", ""],
          titles: ["", "", ""],
        };
        setVideos((prev) => [newV, ...prev]);
        setActiveTab("producao");
      }

      function handleDateChange(id, dateStr) {
        if (!dateStr) return;
        playSound("click");
        const parts = dateStr.split("-").map(Number);
        const dt = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
        const weekday = dt.getDay();
        const offset = getWeekOffsetFromDate(dateStr);
        setVideos((prev) =>
          prev.map((v) =>
            v.id === id
              ? {
                  ...v,
                  scheduledDate: dateStr,
                  weekday,
                  weekOffset: offset,
                  isNextWeek: undefined,
                }
              : v
          )
        );
      }

      function toggleProcess(id, key) {
        playSound("toggle");
        setVideos((prev) =>
          prev.map((v) => (v.id === id ? { ...v, [key]: !v[key] } : v))
        );
      }

      async function updateThumb(id, index, file) {
        try {
          const compressed = await compressImage(file);
          playSound("click");
          setVideos((prev) =>
            prev.map((v) => {
              if (v.id !== id) return v;
              const newThumbs = [...v.thumbs];
              newThumbs[index] = compressed;
              return { ...v, thumbs: newThumbs };
            })
          );
        } catch (e) {
          console.error("Erro ao processar imagem", e);
        }
      }

      function removeThumb(id, index) {
        playSound("delete");
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            const newThumbs = [...v.thumbs];
            newThumbs[index] = "";
            return { ...v, thumbs: newThumbs };
          })
        );
      }

      function updateTitle(id, index, text) {
        const nextText = String(text ?? "").slice(0, 100);
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            const newTitles = [...v.titles];
            newTitles[index] = nextText;
            const nextVideo = { ...v, titles: newTitles };
            return nextVideo;
          })
        );
      }

      function markAsPosted(id) {
        playSound("success");
        setPostingId(id);
        setTimeout(() => {
          setVideos((prev) =>
            prev.map((v) => (v.id === id ? { ...v, posted: true, postedAt: Date.now() } : v))
          );
          setPostingId(null);
        }, 450);
      }

      function restoreToProduction(id) {
        playSound("click");
        setVideos((prev) =>
          prev.map((v) => (v.id === id ? { ...v, posted: false } : v))
        );
      }

      function deleteVideo(id) {
        if (window.confirm("Deseja realmente excluir este projeto de vídeo?")) {
          playSound("delete");
          setVideos((prev) => prev.filter((v) => v.id !== id));
        }
      }

      function exportBackup() {
        playSound("success");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(videos, null, 2));
        const a = document.createElement("a");
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `backup_videos_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      function importBackup(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) {
              playSound("success");
              setVideos(parsed);
              alert("Backup restaurado com sucesso! " + parsed.length + " projetos carregados.");
            } else {
              alert("Arquivo de backup inválido.");
            }
          } catch (err) {
            alert("Erro ao ler o arquivo de backup.");
          }
        };
        reader.readAsText(file);
      }

      // Os vídeos em produção são organizados por data de publicação:
      // a data mais próxima aparece automaticamente no topo (ex: dia 18 antes do dia 22).
      const activeVideos = [...videos]
        .filter((v) => !v.posted)

        const monday = getWeekMonday(new Date());
        monday.setDate(monday.getDate() + offset * 7);
        return { offset, weekVideos, monday };
      });

          <header className="sticky top-0 z-30 bg-[#050505]/95 backdrop-blur-md border-b border-[#141414] px-4 sm:px-6 lg:px-8 py-2.5">

                </button>

                <button

                  onClick={() => {
                    playSound("click");
                    setActiveTab("producao");
                  }}
                  className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-md text-xs font-black transition active:scale-95 ${
                    activeTab === "producao"
                      ? "bg-[#ff0000] text-white shadow-md shadow-red-600/30"
                      : "text-zinc-400 hover:text-white hover:bg-[#121212]"

                >
                  <span>🎬</span>
                  <span>Em Produção</span>
                  <span
                    className={`text-[10px] px-1.5 py-0.2 rounded-full font-black ${
                      activeTab === "producao"

                    {activeVideos.length}
                  </span>
                </button>

                <button
                  type="button"

                  className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-md text-xs font-black transition active:scale-95 ${

                      ? "bg-[#ff0000] text-white shadow-md shadow-red-600/30"

                  }`}
                >
                  <span>✓</span>
                  <span>Postados</span>
                  <span

              {/* Right: Novo Projeto */}
              <div className="flex items-center gap-2.5">

                <button

                  style={{
                    backgroundColor: "#080808",
                    borderColor: cloudStatus === "saving" || cloudStatus === "syncing" ? "#854d0e" : "#1a1a1a",
                    color: cloudStatus === "saving" || cloudStatus === "syncing" ? "#fef08a" : "#34d399"
                  }}
                  title="Sincronização Nuvem PC & Celular 24h (Clique para atualizar agora)"
                >
                  <span
                    className={`w-2 h-2 rounded-full ${
                      cloudStatus === "saving" || cloudStatus === "syncing"
                        ? "bg-amber-400 animate-ping"
                        : "bg-emerald-400"
                    }`}
                  ></span>
                  <span className="hidden sm:inline">
                    {cloudStatus === "saving"
                      ? "Salvando na Nuvem..."
                      : cloudStatus === "syncing"
                      ? "Sincronizando..."
                      : "Nuvem Sincronizada"}
                  </span>
                  <span className="sm:hidden">

                  <span className="text-zinc-500 text-[10px]">🔄</span>
                </button>

                <button

                >

                  <span>Novo Projeto</span>

          {/* ÁREA DOS VÍDEOS EM TELONA CHEIA */}
          <main className="flex-1 w-full max-w-[1920px] mx-auto p-4 sm:p-6 lg:p-8 space-y-6 overflow-y-auto overflow-x-hidden bg-[#000000]">
            {activeTab === "calendario" ? (
              <div className="calendar-view max-w-5xl mx-auto space-y-5">
                <div className="calendar-hero rounded-2xl border border-[#252525] bg-[#111111] p-5 sm:p-6 shadow-xl">
                  <div className="flex flex-wrap items-end justify-between gap-4">
                    <div>
                      <p className="text-[10px] uppercase tracking-[.28em] text-red-400 font-black">Agenda</p>
                      <h1 className="text-2xl sm:text-3xl font-black text-white mt-1">Próximas semanas</h1>
                      <p className="text-sm text-zinc-500 mt-2">Duas vagas de publicação por semana.</p>
                    </div>
                    <div className="rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-center">
                      <div className="text-2xl font-black text-white">2</div>
                      <div className="text-[10px] uppercase tracking-widest text-red-300 font-black">por semana</div>
                    </div>
                  </div>
                </div>
                {calendarWeeks.map(({ offset, weekVideos, monday }, index) => {

                  const weekTitle = offset === 0 ? "Esta semana" : offset === 1 ? "Semana +1" : offset > 1 ? `Semana +${offset}` : offset === -1 ? "Semana anterior" : `${Math.abs(offset)} semanas atrás`;
                  const weekSubtitle = offset >= 0 ? `Começa em ${weekLabel}` : `Semana concluída de ${weekLabel}`;
                  const isFirstPast = offset < 0 && (index === 0 || calendarWeeks[index - 1].offset >= 0);

                  return (
                    <React.Fragment key={offset}>
                      {isFirstPast && (
                        <div className="pt-6 pb-2 border-t border-[#202024]">
                          <p className="text-[10px] uppercase tracking-[.25em] text-zinc-400 font-black">Histórico</p>
                          <h3 className="text-lg font-black text-white mt-0.5">Semanas Concluídas Anteriores</h3>

                      )}
                      <section className="calendar-week relative overflow-hidden rounded-2xl border border-[#252525] bg-[#0d0d0d] shadow-xl">
                        <div className="absolute left-0 top-0 bottom-0 w-px bg-[#202024]" />

                            <span className="flex h-11 w-14 items-center justify-center rounded-lg bg-[#1b1b1b] text-sm font-black text-white">{weekProgress}%</span>

                            const thumb = video.thumbs?.find((item) => item);
                            return (

                                className="calendar-slot group flex items-center gap-4 rounded-lg bg-[#141414] p-3 text-left transition hover:bg-[#1b1b1d]"

            ) : displayedVideos.length === 0 ? (
              <div className="text-center py-24 bg-[#080808] rounded-2xl border border-[#171717] p-8 max-w-xl mx-auto my-12">
                <span className="text-4xl block mb-3 opacity-60">🎬</span>
                <p className="text-zinc-500 text-sm mb-4 font-semibold">
                  {activeTab === "producao"
                    ? "Nenhum vídeo em produção no momento."
                    : "Nenhum vídeo marcado como postado."}

                {activeTab === "producao" && (
                  <button
                    onClick={addNewVideo}
                    className="bg-[#ff0000] hover:bg-[#e60000] text-white text-xs font-black px-4 py-2 rounded-xl transition active:scale-95"

                    ＋ Criar Primeiro Vídeo

            ) : (
              <div className="space-y-6">
                {displayedVideos.map((video) => {

                      className="production-card bg-[#080808] rounded-2xl p-4 sm:p-5 lg:p-6 border border-[#1a1a1a] shadow-2xl space-y-4"
                    >

                      <div className="production-toolbar flex items-center justify-between gap-4 pb-4 border-b border-[#161616] flex-wrap">
                        {/* Left: Bloco do Dia Destacado, Maior e Seletor */}
                        <div className="flex items-center gap-3 sm:gap-4 flex-wrap">

                          <div className="production-date flex items-center gap-3 bg-[#151515] border border-[#303030] px-4 py-2.5 rounded-xl">

                              ) : (
                                <>
                                  <span className="text-sm sm:text-base font-black text-white uppercase tracking-tight">{dayInfo.weekdayName}</span>
                                  <span className="text-xs font-black text-zinc-300 bg-[#1d1d20] px-2 py-1 rounded-md">{dayInfo.formattedDate}</span>
                                  <span className="text-[10px] font-black uppercase tracking-wider text-zinc-400">{dayInfo.weekTag}</span>
                                  <span className={`text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md border ${dayInfo.badgeColor}`}>{dayInfo.countdownText}</span>
                                </>
                              )}
                            </div>
                          </div>

                          {/* Seletor com Calendário e Próximas Datas de Publicação */}
                          {!video.posted && (
                            <div className="production-picker flex items-center gap-1.5 bg-[#050505] p-1.5 rounded-xl border border-[#222222] flex-wrap">
                              {upcomingPostingDays.map((u) => {
                                const isSelected = dayInfo.dateStr === u.dateStr;
                                return (
                                  <button
                                    key={u.dateStr}
                                    type="button"
                                    onClick={() => handleDateChange(video.id, u.dateStr)}
                                    className={`px-3 py-2 rounded-lg text-xs font-black transition-all active:scale-95 flex items-center gap-1 cursor-pointer ${
                                      isSelected
                                        ? "bg-white text-black shadow-lg shadow-white/10 ring-2 ring-white scale-105 z-10"
                                        : "text-zinc-400 hover:text-white hover:bg-[#181818]"
                                    }`}
                                    title={`Agendar para ${u.label}`}
                                  >
                                    <span>{u.label}</span>
                                  </button>
                                );
                              })}

                              <span className="w-px h-6 bg-[#292929] mx-1" />

                              {/* Input Calendário para escolher qualquer dia */}
                              <label className="flex items-center gap-1.5 bg-[#121214] border border-[#26262a] rounded-lg px-2.5 py-1.5 hover:border-zinc-500 transition cursor-pointer" title="Clique para escolher no calendário">
                                <span className="text-xs select-none">🗓️</span>
                                <input
                                  type="date"
                                  value={dayInfo.dateStr}
                                  min={todayStr}
                                  onChange={(e) => handleDateChange(video.id, e.target.value)}
                                  className="bg-transparent text-white text-xs font-black border-0 outline-none cursor-pointer [color-scheme:dark]"
                                />
                              </label>
                            </div>
                          )}
                        </div>

                        {/* Equipe + Botão Vídeo Postado */}
                        <div className="production-team flex items-center gap-2.5 flex-wrap">
                          <div className="flex flex-wrap items-center gap-1.5 bg-[#08080a] border border-[#1e1e24] p-1.5 rounded-xl">
                            <span className="text-[10px] font-black uppercase tracking-wider text-zinc-500 px-1">
                              Status:
                            </span>

                            {PRODUCTION_STEPS.map(([key, label]) => {
                              const isActive = !!video[key];
                              return (
                                <button
                                  key={key}
                                  type="button"
                                  onClick={() => toggleProcess(video.id, key)}
                                  className={`px-2.5 py-1 rounded-lg text-[10px] font-black transition-all active:scale-95 flex items-center gap-1 cursor-pointer ${
                                    isActive ? "status-btn-active" : "status-btn-inactive"
                                  }`}
                                  title={`Alternar ${label}: ${isActive ? "Concluído" : "Pendente"}`}
                                >
                                  <span>{label}</span>
                                  <span>{isActive ? "✓" : "·"}</span>
                                </button>
                              );
                            })}

                            <span
                              className={`px-2.5 py-1 rounded-lg text-[10px] font-black flex items-center gap-1 transition-all ${
                                thumbsComplete ? "status-btn-active" : "status-btn-inactive"
                              }`}
                              title={thumbsComplete ? "3 thumbnails enviadas" : "Envie as 3 thumbnails abaixo para completar esta etapa"}
                            >
                              <span>Thumbs</span>
                              <span>{thumbsComplete ? "✓" : `${video.thumbs?.filter(Boolean).length || 0}/3`}</span>
                            </span>
                          </div>

                          {/* Botão Vídeo Postado: Só pode ser clicado quando marcar todas as caixas */}
                          <div className="flex items-center gap-1.5 pl-1">
                            {!video.posted ? (
                              is100Percent ? (
                                <button
                                  type="button"
                                  onClick={() => markAsPosted(video.id)}
                                  className={`text-xs font-black px-4 py-1.5 rounded-lg transition-all duration-200 active:scale-95 flex items-center gap-1.5 shadow-md cursor-pointer ${
                                    postingId === video.id
                                      ? "bg-[#10b981] text-white border border-[#10b981] scale-105 shadow-emerald-500/40"
                                      : "bg-emerald-500 hover:bg-emerald-400 text-black border border-emerald-400 shadow-emerald-500/25"
                                  }`}
                                  title="Todas as caixinhas marcadas! Clique para marcar como publicado no YouTube"
                                >
                                  <span>{postingId === video.id ? "✓" : "🚀"}</span>
                                  <span>{postingId === video.id ? "Postando..." : "Vídeo Postado ✓"}</span>
                                </button>
                              ) : (
                                <button
                                  type="button"
                                  disabled
                                  className="text-xs font-black px-3.5 py-1.5 rounded-lg opacity-40 cursor-not-allowed bg-[#18181b] text-zinc-500 border border-[#27272a] flex items-center gap-1.5 select-none"
                                  title={`Marque todas as caixas de produção para liberar (${completedSteps}/9 concluídas)`}
                                >
                                  <span>🔒</span>
                                  <span>Vídeo Postado ({completedSteps}/9)</span>
                                </button>
                              )
                            ) : (
                              <button
                                type="button"
                                onClick={() => restoreToProduction(video.id)}
                                className="bg-[#10b981] hover:bg-[#059669] text-white border border-[#10b981] text-xs font-black px-3.5 py-1.5 rounded-lg transition-all active:scale-95 flex items-center gap-1.5 shadow-sm cursor-pointer"
                                title="Vídeo postado! (Clique para voltar a Em Produção)"
                              >
                                <span>✓</span>
                                <span>Postado (Voltar ↩)</span>
                              </button>
                            )}

                            <button
                              onClick={() => deleteVideo(video.id)}
                              className="text-zinc-600 hover:text-red-400 p-1.5 rounded-lg hover:bg-red-950/40 transition cursor-pointer"
                              title="Excluir Projeto"
                            >
                              🗑️
                            </button>
                          </div>
                        </div>
                      </div>

                      {/* 3 Variations: 3 Thumbs (Tela branca plana quando vazio) + 3 BIG TITLES em Telona Cheia */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-5 lg:gap-6">
                        {[0, 1, 2].map((idx) => {
                          const thumb = video.thumbs[idx];
                          const title = video.titles[idx];
                          const titleLength = title.length;

                          return (
                            <div
                              key={idx}
                              className="flex flex-col space-y-2.5 bg-[#030303] p-3.5 rounded-xl border border-[#141414]"
                            >
                              {/* Option Header + Mini 3-Segment Process Track */}
                              <div className="flex items-center justify-between">
                                <span className="text-[11px] font-black text-red-500 uppercase tracking-wider flex items-center gap-1.5">
                                  <span className="w-1.5 h-1.5 rounded-full bg-red-500 inline-block"></span>
                                  OPÇÃO {idx + 1}
                                </span>

                                {thumb && <span className="text-[9px] font-black uppercase tracking-wider text-blue-300">Selecionada</span>}
                              </div>

                              {/* 16:9 Cinema Thumbnail Frame (TELA PLANA BRANCA QUANDO SEM FOTO) */}
                              <div
                                className={`relative rounded-lg overflow-hidden cursor-pointer group aspect-video transition duration-200 flex items-center justify-center ${
                                  thumb
                                    ? is100Percent
                                      ? "bg-black border border-emerald-600 shadow-[0_0_12px_rgba(16,185,129,0.2)]"
                                      : "bg-black border border-[#1c1c1c] hover:border-red-600/70"
                                    : "bg-[#111827] border-2 border-dashed border-slate-600 shadow-md hover:border-red-500"
                                }`}
                                onClick={() =>
                                  document.getElementById(`yt-v14-${video.id}-${idx}`)?.click()
                                }
                              >
                                {thumb ? (
                                  <img
                                    src={thumb}
                                    alt={`Opção ${idx + 1}`}
                                    className="w-full h-full object-cover transition duration-300 group-hover:scale-105"
                                  />
                                ) : (
                                  <div className="thumb-empty relative w-full h-full flex flex-col items-center justify-center p-3 transition">
                                    <span className="text-2xl mb-1 opacity-80 group-hover:opacity-100 group-hover:scale-110 transition">📁</span>
                                    <span className="text-xs font-black tracking-tight uppercase">
                                      Subir Thumbnail
                                    </span>
                                    <span className="text-[10px] text-slate-400 font-bold">
                                      16:9
                                    </span>
                                  </div>
                                )}

                                {thumb && (
                                  <div className="absolute inset-0 bg-black/65 opacity-0 group-hover:opacity-100 flex items-center justify-center transition backdrop-blur-xs">
                                    <span className="text-xs font-black text-white bg-red-600 px-3 py-1.5 rounded-lg shadow-md">
                                      Trocar Thumbnail
                                    </span>
                                  </div>
                                )}

                                <input
                                  id={`yt-v14-${video.id}-${idx}`}
                                  type="file"
                                  accept="image/*"
                                  className="hidden"
                                  onChange={(e) => {
                                    const f = e.target.files?.[0];
                                    if (f) updateThumb(video.id, idx, f);
                                  }}
                                />
                              </div>

                              {thumb && (
                                <div className="flex justify-end">
                                  <button
                                    onClick={() => removeThumb(video.id, idx)}
                                    className="text-[10px] font-bold text-zinc-600 hover:text-red-400 transition"
                                  >
                                    Remover foto
                                  </button>
                                </div>
                              )}

                              {/* BIG TITLES */}
                              <div className="space-y-1 pt-0.5">
                                <div className="flex items-center justify-between text-[10px] text-zinc-500 font-bold">
                                  <span>Título do Vídeo:</span>
                                  <span
                                    className={
                                      titleLength > 90
                                        ? "text-red-400 font-black"
                                        : "text-zinc-600"
                                    }
                                  >
                                    {titleLength} / 100
                                  </span>
                                </div>

                                <textarea
                                  rows={3}
                                  value={title}
                                  onChange={(e) => updateTitle(video.id, idx, e.target.value)}
                                  onInput={(e) => updateTitle(video.id, idx, e.currentTarget.value)}
                                  onBlur={(e) => {
                                    const finalText = e.currentTarget.value.slice(0, 100);
                                    updateTitle(video.id, idx, finalText);
                                    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(videosRef.current)); } catch (err) {}
                                  }}
                                  maxLength={100}
                                  placeholder={`Título em destaque para a Opção ${idx + 1}...`}
                                  className="w-full bg-[#050505] hover:bg-[#0a0a0a] focus:bg-[#0a0a0a] border border-[#1a1a1a] focus:border-[#ff0000] focus:ring-1 focus:ring-red-500/25 text-base sm:text-lg font-black text-white p-3 rounded-lg focus:outline-none resize-none transition leading-snug placeholder:text-zinc-700 placeholder:font-normal"
                                />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </section>
                  );
                })}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
