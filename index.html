<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central Studio - Produção & Thumbs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #0f0f10;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f0f10; }
    ::-webkit-scrollbar-thumb { background: #27272f; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const STORAGE_KEY = "producao_videos_sonora_v11";

    // Web Audio API Sound Effects (Zero latency, works offline)
    function playSound(type = "click") {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        if (ctx.state === "suspended") {
          ctx.resume();
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === "click") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(640, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.035);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          osc.start(now);
          osc.stop(now + 0.035);
        } else if (type === "toggle") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(380, now);
          osc.frequency.exponentialRampToValueAtTime(760, now + 0.05);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === "success") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.06);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === "delete") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {}
    }

    const WEEKDAYS = [
      { label: "Seg", day: 1, name: "Segunda" },
      { label: "Ter", day: 2, name: "Terça" },
      { label: "Qua", day: 3, name: "Quarta" },
      { label: "Qui", day: 4, name: "Quinta" },
      { label: "Sex", day: 5, name: "Sexta" },
      { label: "Sáb", day: 6, name: "Sábado" },
    ];

    function calculatePostDayInfo(targetWeekday, isNextWeek) {
      const now = new Date();
      const currentWeekday = now.getDay();

      let daysUntil = targetWeekday - currentWeekday;
      if (daysUntil < 0) {
        daysUntil += 7;
      }
      if (isNextWeek) {
        daysUntil += 7;
      }

      const targetDate = new Date(now);
      targetDate.setDate(now.getDate() + daysUntil);

      const formattedDate = targetDate.toLocaleDateString("pt-BR", {
        day: "2-digit",
        month: "2-digit",
      });

      const weekdayObj = WEEKDAYS.find((w) => w.day === targetWeekday) || WEEKDAYS[0];
      const prefix = isNextWeek ? "Próx. " : "";
      const displayDay = `${prefix}${weekdayObj.name}`;

      let countdownText = "";
      let badgeColor = "bg-zinc-800 text-zinc-300 border-zinc-700";

      if (daysUntil === 0) {
        countdownText = "Posta Hoje! 🔥";
        badgeColor = "bg-red-950/70 text-red-400 border-red-800/80 animate-pulse";
      } else if (daysUntil === 1) {
        countdownText = "Amanhã ⚡";
        badgeColor = "bg-amber-950/60 text-amber-300 border-amber-800/70";
      } else {
        countdownText = `Faltam ${daysUntil} dias`;
        badgeColor = "bg-zinc-800/90 text-zinc-300 border-zinc-700/80";
      }

      return {
        displayDay,
        formattedDate,
        countdownText,
        daysUntil,
        badgeColor,
      };
    }

    function getInitialVideos() {
      return [
        {
          id: "v-1",
          weekday: 1,
          isNextWeek: false,
          posted: false,
          nandoSim: true,
          dudaSim: false,
          sonoraSim: false,
          thumbs: [
            "https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=800&auto=format&fit=crop&q=80",
            "",
            "",
          ],
          titles: [
            "O DIA QUE O REAL MADRID QUEBROU O MERCADO DA BOLA",
            "COMO O REAL MADRID MONTOU A MAIOR MÁQUINA DO FUTEBOL",
            "O SEGREDO DOS MILHÕES QUE MUDARAM O FUTEBOL",
          ],
        },
      ];
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            const maxW = 960;
            let width = img.width;
            let height = img.height;

            if (width > maxW) {
              height = Math.round((height * maxW) / width);
              width = maxW;
            }

            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            const compressed = canvas.toDataURL("image/jpeg", 0.82);
            resolve(compressed);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function App() {
      const [videos, setVideos] = useState([]);
      const [activeTab, setActiveTab] = useState("producao");
      const [loaded, setLoaded] = useState(false);

      // Never lose video: check v11, then fallback keys
      useEffect(() => {
        try {
          const saved =
            localStorage.getItem(STORAGE_KEY) ||
            localStorage.getItem("producao_videos_sim_nao_v10") ||
            localStorage.getItem("producao_videos_v9");

          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setVideos(parsed);
              setLoaded(true);
              return;
            }
          }
        } catch (e) {
          console.error("Erro ao ler dados locais", e);
        }
        setVideos(getInitialVideos());
        setLoaded(true);
      }, []);

      useEffect(() => {
        if (!loaded) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
        } catch (e) {
          console.error("Erro ao salvar no storage", e);
        }
      }, [videos, loaded]);

      function addNewVideo() {
        playSound("click");
        const newV = {
          id: "v-" + Date.now(),
          weekday: 1,
          isNextWeek: false,
          posted: false,
          nandoSim: false,
          dudaSim: false,
          sonoraSim: false,
          thumbs: ["", "", ""],
          titles: ["", "", ""],
        };
        setVideos((prev) => [newV, ...prev]);
        setActiveTab("producao");
      }

      function handleWeekdayClick(id, clickedDay) {
        playSound("click");
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            if (v.weekday === clickedDay) {
              return { ...v, isNextWeek: !v.isNextWeek };
            } else {
              return { ...v, weekday: clickedDay, isNextWeek: false };
            }
          })
        );
      }

      function toggleProcess(id, key) {
        playSound("toggle");
        setVideos((prev) =>
          prev.map((v) => (v.id === id ? { ...v, [key]: !v[key] } : v))
        );
      }

      async function updateThumb(id, index, file) {
        try {
          const compressed = await compressImage(file);
          playSound("click");
          setVideos((prev) =>
            prev.map((v) => {
              if (v.id !== id) return v;
              const newThumbs = [...v.thumbs];
              newThumbs[index] = compressed;
              return { ...v, thumbs: newThumbs };
            })
          );
        } catch (e) {
          console.error("Erro ao processar imagem", e);
        }
      }

      function removeThumb(id, index) {
        playSound("delete");
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            const newThumbs = [...v.thumbs];
            newThumbs[index] = "";
            return { ...v, thumbs: newThumbs };
          })
        );
      }

      function updateTitle(id, index, text) {
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            const newTitles = [...v.titles];
            newTitles[index] = text;
            return { ...v, titles: newTitles };
          })
        );
      }

      function markAsPosted(id) {
        playSound("success");
        setVideos((prev) =>
          prev.map((v) => (v.id === id ? { ...v, posted: true, postedAt: Date.now() } : v))
        );
      }

      function restoreToProduction(id) {
        playSound("click");
        setVideos((prev) =>
          prev.map((v) => (v.id === id ? { ...v, posted: false } : v))
        );
      }

      function deleteVideo(id) {
        if (window.confirm("Deseja realmente excluir este projeto de vídeo?")) {
          playSound("delete");
          setVideos((prev) => prev.filter((v) => v.id !== id));
        }
      }

      function exportBackup() {
        playSound("success");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(videos, null, 2));
        const a = document.createElement("a");
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `backup_videos_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      function importBackup(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) {
              playSound("success");
              setVideos(parsed);
              alert("Backup restaurado com sucesso! " + parsed.length + " projetos carregados.");
            } else {
              alert("Arquivo de backup inválido.");
            }
          } catch (err) {
            alert("Erro ao ler o arquivo de backup.");
          }
        };
        reader.readAsText(file);
      }

      const activeVideos = videos.filter((v) => !v.posted);
      const postedVideos = videos.filter((v) => v.posted);
      const displayedVideos = activeTab === "producao" ? activeVideos : postedVideos;

      return (
        <div className="min-h-screen bg-[#0f0f10] text-slate-100 flex flex-col md:flex-row font-sans">
          {/* 1. LADO ESQUERDO: BRANCO ESTILO YOUTUBE */}
          <aside className="w-full md:w-64 bg-white text-zinc-900 border-r border-zinc-200 p-4 flex flex-col justify-between shrink-0 shadow-[4px_0_24px_rgba(0,0,0,0.06)] z-10">
            <div>
              {/* YouTube Style Brand Header */}
              <div className="flex items-center gap-3 px-2 py-3 mb-6">
                <div className="w-10 h-7 rounded-lg bg-[#ff0000] flex items-center justify-center text-white shadow-md shadow-red-500/30">
                  <span className="text-sm font-black ml-0.5">▶</span>
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <h1 className="font-black text-lg tracking-tight text-zinc-900">
                      Central
                    </h1>
                    <span className="text-[10px] bg-[#ff0000] text-white px-1.5 py-0.2 rounded font-extrabold uppercase tracking-wider">
                      Studio
                    </span>
                  </div>
                  <p className="text-[11px] text-zinc-400 font-semibold">Produção & Thumbs</p>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="space-y-1.5">
                <button
                  onClick={() => {
                    playSound("click");
                    setActiveTab("producao");
                  }}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition active:scale-[0.98] ${
                    activeTab === "producao"
                      ? "bg-[#ff0000] text-white shadow-md shadow-red-600/30"
                      : "text-zinc-600 hover:bg-zinc-100 hover:text-zinc-950"
                  }`}
                >
                  <div className="flex items-center gap-2.5">
                    <span>🎬</span>
                    <span>Em Produção</span>
                  </div>
                  <span
                    className={`text-[11px] px-2 py-0.5 rounded-full font-black ${
                      activeTab === "producao"
                        ? "bg-white/25 text-white"
                        : "bg-zinc-100 text-zinc-700"
                    }`}
                  >
                    {activeVideos.length}
                  </span>
                </button>

                <button
                  onClick={() => {
                    playSound("click");
                    setActiveTab("postados");
                  }}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition active:scale-[0.98] ${
                    activeTab === "postados"
                      ? "bg-[#ff0000] text-white shadow-md shadow-red-600/30"
                      : "text-zinc-600 hover:bg-zinc-100 hover:text-zinc-950"
                  }`}
                >
                  <div className="flex items-center gap-2.5">
                    <span>✓</span>
                    <span>Postados</span>
                  </div>
                  <span
                    className={`text-[11px] px-2 py-0.5 rounded-full font-black ${
                      activeTab === "postados"
                        ? "bg-white/25 text-white"
                        : "bg-zinc-100 text-zinc-700"
                    }`}
                  >
                    {postedVideos.length}
                  </span>
                </button>
              </nav>
            </div>

            {/* Sidebar Actions & Backup */}
            <div className="pt-4 border-t border-zinc-200 mt-6 space-y-2.5">
              <button
                onClick={addNewVideo}
                className="w-full flex items-center justify-center gap-2 bg-[#ff0000] hover:bg-[#e60000] text-white text-xs font-extrabold py-3 px-3 rounded-xl shadow-lg shadow-red-600/25 transition active:scale-95"
              >
                <span className="text-base font-black">＋</span>
                <span>Novo Projeto de Vídeo</span>
              </button>

              <div className="flex items-center gap-2 pt-1">
                <button
                  type="button"
                  onClick={exportBackup}
                  className="flex-1 text-[11px] font-bold text-zinc-700 hover:text-[#ff0000] bg-zinc-50 hover:bg-zinc-100 border border-zinc-200 py-2 px-1 rounded-xl transition text-center shadow-2xs"
                  title="Baixar backup dos vídeos e fotos"
                >
                  💾 Salvar
                </button>
                <label
                  className="flex-1 text-[11px] font-bold text-zinc-700 hover:text-[#ff0000] bg-zinc-50 hover:bg-zinc-100 border border-zinc-200 py-2 px-1 rounded-xl transition text-center cursor-pointer shadow-2xs"
                  title="Carregar backup existente"
                >
                  📥 Carregar
                  <input
                    type="file"
                    accept=".json"
                    onChange={importBackup}
                    className="hidden"
                  />
                </label>
              </div>

              <div className="text-[10px] text-zinc-400 text-center font-medium pt-1">
                🔔 Sons de clique ativos
              </div>
            </div>
          </aside>

          {/* 2. ÁREA DAS THUMBS & PROJETOS: FUNDO PRETO/CINZA CINEMA */}
          <main className="flex-1 flex flex-col min-w-0 p-4 sm:p-6 lg:p-8 space-y-6 overflow-y-auto bg-[#0f0f10]">
            {/* Top Header Bar */}
            <div className="flex items-center justify-between bg-[#18181c] rounded-2xl px-6 py-4 border border-[#27272f] shadow-lg">
              <div className="flex items-center gap-3">
                <h2 className="text-lg font-black text-white tracking-tight">
                  {activeTab === "producao" ? "Vídeos em Produção" : "Vídeos Postados"}
                </h2>
                <span className="text-xs font-black text-red-400 bg-red-950/60 border border-red-800/60 px-3 py-1 rounded-full">
                  {displayedVideos.length} {displayedVideos.length === 1 ? "projeto" : "projetos"}
                </span>
              </div>

              <button
                onClick={addNewVideo}
                className="md:hidden flex items-center gap-1.5 bg-[#ff0000] hover:bg-[#e60000] text-white text-xs font-black px-3 py-1.5 rounded-xl shadow-md transition"
              >
                <span>＋</span>
                <span>Novo</span>
              </button>
            </div>

            {/* Video Projects List */}
            {displayedVideos.length === 0 ? (
              <div className="text-center py-24 bg-[#18181c] rounded-2xl border border-[#27272f] p-8 shadow-inner">
                <span className="text-4xl block mb-3 opacity-60">🎬</span>
                <p className="text-zinc-400 text-sm mb-4 font-semibold">
                  {activeTab === "producao"
                    ? "Nenhum vídeo em produção no momento."
                    : "Nenhum vídeo marcado como postado."}
                </p>
                {activeTab === "producao" && (
                  <button
                    onClick={addNewVideo}
                    className="bg-[#ff0000] hover:bg-[#e60000] text-white text-xs font-black px-5 py-2.5 rounded-xl shadow-lg shadow-red-600/30 transition active:scale-95"
                  >
                    ＋ Criar Primeiro Vídeo
                  </button>
                )}
              </div>
            ) : (
              <div className="space-y-6">
                {displayedVideos.map((video) => {
                  const dayInfo = calculatePostDayInfo(video.weekday, video.isNextWeek);

                  const deliveredCount =
                    (video.nandoSim ? 1 : 0) +
                    (video.dudaSim ? 1 : 0) +
                    (video.sonoraSim ? 1 : 0);
                  const is100Percent = deliveredCount === 3;

                  return (
                    <section
                      key={video.id}
                      className="bg-[#18181c] rounded-2xl p-5 sm:p-6 border border-[#27272f] hover:border-zinc-700 shadow-xl transition space-y-5"
                    >
                      {/* Top Bar of Project */}
                      <div className="flex items-center justify-between gap-4 pb-4 border-b border-[#27272f] flex-wrap">
                        {/* Left: Weekday Selector + Countdown */}
                        <div className="flex items-center gap-3 flex-wrap">
                          {/* Weekdays */}
                          <div className="flex items-center gap-1 bg-[#121214] p-1 rounded-xl border border-zinc-800 shadow-inner">
                            {WEEKDAYS.map((w) => {
                              const isSelected = video.weekday === w.day;
                              return (
                                <button
                                  key={w.day}
                                  type="button"
                                  onClick={() => handleWeekdayClick(video.id, w.day)}
                                  className={`px-3 py-1.5 rounded-lg text-xs font-black transition active:scale-95 flex items-center gap-1 ${
                                    isSelected
                                      ? "bg-[#ff0000] text-white shadow-md shadow-red-600/40"
                                      : "text-zinc-400 hover:text-white hover:bg-zinc-800"
                                  }`}
                                  title={
                                    isSelected
                                      ? video.isNextWeek
                                        ? "Próxima semana selecionada"
                                        : "Esta semana selecionada"
                                      : `Postar na ${w.name}`
                                  }
                                >
                                  <span>{w.label}</span>
                                  {isSelected && video.isNextWeek && (
                                    <span className="text-[9px] bg-white/30 text-white px-1 rounded-full font-black">
                                      +1sem
                                    </span>
                                  )}
                                </button>
                              );
                            })}
                          </div>

                          {/* Countdown */}
                          <div
                            className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs font-black border shadow-sm ${dayInfo.badgeColor}`}
                          >
                            <span>🕒</span>
                            <span>
                              {dayInfo.displayDay} ({dayInfo.formattedDate})
                            </span>
                            <span>•</span>
                            <span>{dayInfo.countdownText}</span>
                          </div>
                        </div>

                        {/* Process Delivery Status: NANDO / DUDA / SONORA */}
                        <div className="flex items-center gap-2.5 bg-[#121214] p-1.5 px-3 rounded-xl border border-zinc-800 flex-wrap">
                          <span className="text-[11px] font-black text-zinc-400 uppercase tracking-wider mr-1">
                            Equipe:
                          </span>

                          {/* Nando */}
                          <button
                            type="button"
                            onClick={() => toggleProcess(video.id, "nandoSim")}
                            className={`px-2.5 py-1 rounded-lg text-[11px] font-black transition active:scale-95 flex items-center gap-1.5 shadow-sm ${
                              video.nandoSim
                                ? "bg-emerald-600 text-white shadow-emerald-700/30"
                                : "bg-red-600/80 text-white hover:bg-red-600"
                            }`}
                            title="Alternar entrega do Nando"
                          >
                            <span>Nando</span>
                            <span>{video.nandoSim ? "✓" : "✕"}</span>
                          </button>

                          {/* Duda */}
                          <button
                            type="button"
                            onClick={() => toggleProcess(video.id, "dudaSim")}
                            className={`px-2.5 py-1 rounded-lg text-[11px] font-black transition active:scale-95 flex items-center gap-1.5 shadow-sm ${
                              video.dudaSim
                                ? "bg-emerald-600 text-white shadow-emerald-700/30"
                                : "bg-red-600/80 text-white hover:bg-red-600"
                            }`}
                            title="Alternar entrega da Duda"
                          >
                            <span>Duda</span>
                            <span>{video.dudaSim ? "✓" : "✕"}</span>
                          </button>

                          {/* Sonora */}
                          <button
                            type="button"
                            onClick={() => toggleProcess(video.id, "sonoraSim")}
                            className={`px-2.5 py-1 rounded-lg text-[11px] font-black transition active:scale-95 flex items-center gap-1.5 shadow-sm ${
                              video.sonoraSim
                                ? "bg-emerald-600 text-white shadow-emerald-700/30"
                                : "bg-red-600/80 text-white hover:bg-red-600"
                            }`}
                            title="Alternar entrega da Sonora"
                          >
                            <span>🎵 Sonora</span>
                            <span>{video.sonoraSim ? "✓" : "✕"}</span>
                          </button>

                          {is100Percent && (
                            <span className="flex items-center gap-1 text-[10px] font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded-full ml-1 animate-pulse">
                              ✨ 100% PRONTO
                            </span>
                          )}
                        </div>

                        {/* Right: Postado Button & Delete */}
                        <div className="flex items-center gap-2">
                          {!video.posted ? (
                            <button
                              onClick={() => markAsPosted(video.id)}
                              className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black px-3.5 py-1.5 rounded-xl transition active:scale-95 flex items-center gap-1.5 shadow-md shadow-emerald-900/30"
                            >
                              <span>✓</span>
                              <span>Vídeo Postado</span>
                            </button>
                          ) : (
                            <button
                              onClick={() => restoreToProduction(video.id)}
                              className="flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-black px-3.5 py-1.5 rounded-xl transition shadow-sm"
                            >
                              <span>↩</span>
                              <span>Voltar Produção</span>
                            </button>
                          )}

                          <button
                            onClick={() => deleteVideo(video.id)}
                            className="text-zinc-500 hover:text-red-400 p-2 rounded-xl hover:bg-red-950/40 transition"
                            title="Excluir Projeto"
                          >
                            🗑️
                          </button>
                        </div>
                      </div>

                      {/* 3 Variations: 3 Thumbs + 3 BIG TITLES */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {[0, 1, 2].map((idx) => {
                          const thumb = video.thumbs[idx];
                          const title = video.titles[idx];
                          const titleLength = title.length;

                          return (
                            <div
                              key={idx}
                              className="flex flex-col space-y-3 bg-[#121214] p-3.5 rounded-2xl border border-[#27272f]"
                            >
                              {/* Option Header + 3-Segment Process Track */}
                              <div className="flex items-center justify-between">
                                <span className="text-xs font-black text-red-500 uppercase tracking-wider flex items-center gap-1.5">
                                  <span className="w-2 h-2 rounded-full bg-red-500 inline-block"></span>
                                  OPÇÃO {idx + 1}
                                </span>

                                {/* 33.3% Clear Progress Bar on the thumbnail */}
                                <div
                                  className="flex items-center gap-1"
                                  title="Progresso: Nando, Duda, Sonora"
                                >
                                  <div
                                    className={`w-4 h-1.5 rounded-full ${
                                      video.nandoSim ? "bg-emerald-500" : "bg-red-500/80"
                                    }`}
                                    title="Nando"
                                  />
                                  <div
                                    className={`w-4 h-1.5 rounded-full ${
                                      video.dudaSim ? "bg-emerald-500" : "bg-red-500/80"
                                    }`}
                                    title="Duda"
                                  />
                                  <div
                                    className={`w-4 h-1.5 rounded-full ${
                                      video.sonoraSim ? "bg-emerald-500" : "bg-red-500/80"
                                    }`}
                                    title="Sonora"
                                  />
                                </div>
                              </div>

                              {/* 16:9 Cinema Thumbnail Frame */}
                              <div
                                className={`relative rounded-xl overflow-hidden cursor-pointer group aspect-video bg-[#09090b] border-2 transition-all duration-200 flex items-center justify-center ${
                                  is100Percent
                                    ? "border-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.25)]"
                                    : "border-zinc-800 hover:border-red-500/80 shadow-md"
                                }`}
                                onClick={() =>
                                  document.getElementById(`yt-v12-${video.id}-${idx}`)?.click()
                                }
                              >
                                {thumb ? (
                                  <img
                                    src={thumb}
                                    alt={`Opção ${idx + 1}`}
                                    className="w-full h-full object-cover transition duration-300 group-hover:scale-105"
                                  />
                                ) : (
                                  <div className="flex flex-col items-center justify-center p-4 text-zinc-500 group-hover:text-red-400 transition">
                                    <span className="text-2xl mb-1.5 opacity-60">📁</span>
                                    <span className="text-xs font-black tracking-tight">
                                      Subir Thumbnail (16:9)
                                    </span>
                                  </div>
                                )}

                                {thumb && (
                                  <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition backdrop-blur-xs">
                                    <span className="text-xs font-black text-white bg-red-600 px-3.5 py-2 rounded-xl shadow-lg">
                                      Trocar Thumbnail
                                    </span>
                                  </div>
                                )}

                                <input
                                  id={`yt-v12-${video.id}-${idx}`}
                                  type="file"
                                  accept="image/*"
                                  className="hidden"
                                  onChange={(e) => {
                                    const f = e.target.files?.[0];
                                    if (f) updateThumb(video.id, idx, f);
                                  }}
                                />
                              </div>

                              {thumb && (
                                <div className="flex justify-end">
                                  <button
                                    onClick={() => removeThumb(video.id, idx)}
                                    className="text-[11px] font-bold text-zinc-500 hover:text-red-400 transition"
                                  >
                                    Remover foto
                                  </button>
                                </div>
                              )}

                              {/* BIG TITLES (YouTube Studio Style: Big, bold, readable) */}
                              <div className="space-y-1.5 pt-1">
                                <div className="flex items-center justify-between text-[11px] text-zinc-400 font-bold">
                                  <span>Título do Vídeo:</span>
                                  <span
                                    className={
                                      titleLength > 90
                                        ? "text-red-400 font-black"
                                        : "text-zinc-500"
                                    }
                                  >
                                    {titleLength} / 100
                                  </span>
                                </div>

                                <textarea
                                  rows={3}
                                  value={title}
                                  onChange={(e) => updateTitle(video.id, idx, e.target.value)}
                                  placeholder={`Escreva aqui o título em destaque para a Opção ${idx + 1}...`}
                                  className="w-full bg-[#18181c] hover:bg-[#1f1f24] focus:bg-[#1f1f24] border-2 border-zinc-800 focus:border-[#ff0000] focus:ring-2 focus:ring-red-500/20 text-base sm:text-lg font-black text-white p-3.5 rounded-xl focus:outline-none resize-none transition leading-snug placeholder:text-zinc-600 placeholder:font-normal shadow-inner"
                                />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </section>
                  );
                })}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
