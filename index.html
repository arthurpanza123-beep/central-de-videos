<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central Studio - Produção & Thumbs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #000000;
      color: #f4f4f5;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #1f1f1f; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #2e2e2e; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const STORAGE_KEY = "producao_videos_sonora_v11";

    // Web Audio API Sound Effects
    function playSound(type = "click") {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        if (ctx.state === "suspended") {
          ctx.resume();
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === "click") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(640, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.035);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          osc.start(now);
          osc.stop(now + 0.035);
        } else if (type === "toggle") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(380, now);
          osc.frequency.exponentialRampToValueAtTime(760, now + 0.05);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === "success") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.06);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === "delete") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {}
    }

    const WEEKDAYS = [
      { label: "Seg", day: 1, name: "Segunda" },
      { label: "Ter", day: 2, name: "Terça" },
      { label: "Qua", day: 3, name: "Quarta" },
      { label: "Qui", day: 4, name: "Quinta" },
      { label: "Sex", day: 5, name: "Sexta" },
      { label: "Sáb", day: 6, name: "Sábado" },
      { label: "Dom", day: 0, name: "Domingo" },
    ];

    function calculatePostDayInfo(targetWeekday, isNextWeek) {
      const now = new Date();
      const currentWeekday = now.getDay();

      let daysUntil = targetWeekday - currentWeekday;
      if (daysUntil < 0) {
        daysUntil += 7;
      }
      if (isNextWeek) {
        daysUntil += 7;
      }

      const targetDate = new Date(now);
      targetDate.setDate(now.getDate() + daysUntil);

      const formattedDate = targetDate.toLocaleDateString("pt-BR", {
        day: "2-digit",
        month: "2-digit",
      });

      const weekdayObj = WEEKDAYS.find((w) => w.day === targetWeekday) || WEEKDAYS[0];
      const prefix = isNextWeek ? "Próx. " : "";
      const displayDay = `${prefix}${weekdayObj.name}`;

      let countdownText = "";
      let badgeColor = "text-zinc-400";

      if (daysUntil === 0) {
        countdownText = "Posta Hoje! 🔥";
        badgeColor = "text-red-400 font-black";
      } else if (daysUntil === 1) {
        countdownText = "Amanhã ⚡";
        badgeColor = "text-amber-400 font-extrabold";
      } else {
        countdownText = `Faltam ${daysUntil} dias`;
        badgeColor = "text-zinc-400 font-medium";
      }

      return {
        displayDay,
        formattedDate,
        countdownText,
        daysUntil,
        badgeColor,
      };
    }

    function getInitialVideos() {
      return [
        {
          id: "v-1",
          weekday: 6,
          isNextWeek: false,
          posted: false,
          nandoSim: true,
          dudaSim: false,
          sonoraSim: true,
          thumbs: ["", "", ""],
          titles: [
            "O DIA QUE O REAL MADRID QUEBROU O MERCADO DA BOLA",
            "COMO O REAL MADRID MONTOU A MAIOR MÁQUINA DO FUTEBOL",
            "O SEGREDO DOS MILHÕES QUE MUDARAM O FUTEBOL",
          ],
        },
      ];
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            const maxW = 960;
            let width = img.width;
            let height = img.height;

            if (width > maxW) {
              height = Math.round((height * maxW) / width);
              width = maxW;
            }

            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            const compressed = canvas.toDataURL("image/jpeg", 0.82);
            resolve(compressed);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function App() {
      const [videos, setVideos] = useState([]);
      const [activeTab, setActiveTab] = useState("producao");
      const [postingId, setPostingId] = useState(null);
      const [loaded, setLoaded] = useState(false);

      // Never lose video: check v11, then fallback keys
      useEffect(() => {
        try {
          const saved =
            localStorage.getItem(STORAGE_KEY) ||
            localStorage.getItem("producao_videos_sim_nao_v10") ||
            localStorage.getItem("producao_videos_v9");

          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setVideos(parsed);
              setLoaded(true);
              return;
            }
          }
        } catch (e) {
          console.error("Erro ao ler dados locais", e);
        }
        setVideos(getInitialVideos());
        setLoaded(true);
      }, []);

      useEffect(() => {
        if (!loaded) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
        } catch (e) {
          console.error("Erro ao salvar no storage", e);
        }
      }, [videos, loaded]);

      function addNewVideo() {
        playSound("click");
        const newV = {
          id: "v-" + Date.now(),
          weekday: 1,
          isNextWeek: false,
          posted: false,
          nandoSim: false,
          dudaSim: false,
          sonoraSim: false,
          thumbs: ["", "", ""],
          titles: ["", "", ""],
        };
        setVideos((prev) => [newV, ...prev]);
        setActiveTab("producao");
      }

      function handleWeekdayClick(id, clickedDay) {
        playSound("click");
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            if (v.weekday === clickedDay) {
              return { ...v, isNextWeek: !v.isNextWeek };
            } else {
              return { ...v, weekday: clickedDay, isNextWeek: false };
            }
          })
        );
      }

      function toggleProcess(id, key) {
        playSound("toggle");
        setVideos((prev) =>
          prev.map((v) => (v.id === id ? { ...v, [key]: !v[key] } : v))
        );
      }

      async function updateThumb(id, index, file) {
        try {
          const compressed = await compressImage(file);
          playSound("click");
          setVideos((prev) =>
            prev.map((v) => {
              if (v.id !== id) return v;
              const newThumbs = [...v.thumbs];
              newThumbs[index] = compressed;
              return { ...v, thumbs: newThumbs };
            })
          );
        } catch (e) {
          console.error("Erro ao processar imagem", e);
        }
      }

      function removeThumb(id, index) {
        playSound("delete");
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            const newThumbs = [...v.thumbs];
            newThumbs[index] = "";
            return { ...v, thumbs: newThumbs };
          })
        );
      }

      function updateTitle(id, index, text) {
        setVideos((prev) =>
          prev.map((v) => {
            if (v.id !== id) return v;
            const newTitles = [...v.titles];
            newTitles[index] = text;
            return { ...v, titles: newTitles };
          })
        );
      }

      function markAsPosted(id) {
        playSound("success");
        setPostingId(id);
        setTimeout(() => {
          setVideos((prev) =>
            prev.map((v) => (v.id === id ? { ...v, posted: true, postedAt: Date.now() } : v))
          );
          setPostingId(null);
        }, 450);
      }

      function restoreToProduction(id) {
        playSound("click");
        setVideos((prev) =>
          prev.map((v) => (v.id === id ? { ...v, posted: false } : v))
        );
      }

      function deleteVideo(id) {
        if (window.confirm("Deseja realmente excluir este projeto de vídeo?")) {
          playSound("delete");
          setVideos((prev) => prev.filter((v) => v.id !== id));
        }
      }

      function exportBackup() {
        playSound("success");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(videos, null, 2));
        const a = document.createElement("a");
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `backup_videos_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      function importBackup(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) {
              playSound("success");
              setVideos(parsed);
              alert("Backup restaurado com sucesso! " + parsed.length + " projetos carregados.");
            } else {
              alert("Arquivo de backup inválido.");
            }
          } catch (err) {
            alert("Erro ao ler o arquivo de backup.");
          }
        };
        reader.readAsText(file);
      }

      // Ordenação: vídeos postados antes ficam em cima (menor prazo/dias restantes no topo!)
      const activeVideos = [...videos]
        .filter((v) => !v.posted)
        .sort((a, b) => {
          const daysA = calculatePostDayInfo(a.weekday, a.isNextWeek).daysUntil;
          const daysB = calculatePostDayInfo(b.weekday, b.isNextWeek).daysUntil;
          return daysA - daysB;
        });

      const postedVideos = [...videos]
        .filter((v) => v.posted)
        .sort((a, b) => (b.postedAt || 0) - (a.postedAt || 0));

      const displayedVideos = activeTab === "producao" ? activeVideos : postedVideos;

      return (
        <div className="min-h-screen bg-[#000000] text-zinc-100 flex flex-col md:flex-row font-sans">
          {/* 1. LADO ESQUERDO: PRETO PROFUNDO (OLED BLACK #000000) */}
          <aside className="w-full md:w-60 bg-[#000000] text-zinc-100 border-r border-[#171717] p-4 flex flex-col justify-between shrink-0 z-10">
            <div>
              {/* YouTube Studio Brand Header */}
              <div className="flex items-center gap-2.5 px-2 py-3 mb-6 border-b border-[#141414] pb-4">
                <div className="w-9 h-6 rounded-md bg-[#ff0000] flex items-center justify-center text-white shadow-md shadow-red-600/30">
                  <span className="text-xs font-black ml-0.5">▶</span>
                </div>
                <div className="flex items-center gap-1.5">
                  <h1 className="font-black text-base tracking-tight text-white">
                    Central
                  </h1>
                  <span className="text-[9px] bg-[#ff0000] text-white px-1.5 py-0.5 rounded font-black uppercase tracking-wider">
                    Studio
                  </span>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="space-y-1">
                <button
                  onClick={() => {
                    playSound("click");
                    setActiveTab("producao");
                  }}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${
                    activeTab === "producao"
                      ? "bg-[#ff0000] text-white shadow-md shadow-red-600/30"
                      : "text-zinc-400 hover:bg-[#0f0f0f] hover:text-white"
                  }`}
                >
                  <div className="flex items-center gap-2.5">
                    <span>🎬</span>
                    <span>Em Produção</span>
                  </div>
                  <span
                    className={`text-[11px] px-2 py-0.5 rounded-full font-black ${
                      activeTab === "producao"
                        ? "bg-white/25 text-white"
                        : "bg-[#141414] text-zinc-400 border border-[#222]"
                    }`}
                  >
                    {activeVideos.length}
                  </span>
                </button>

                <button
                  onClick={() => {
                    playSound("click");
                    setActiveTab("postados");
                  }}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${
                    activeTab === "postados"
                      ? "bg-[#ff0000] text-white shadow-md shadow-red-600/30"
                      : "text-zinc-400 hover:bg-[#0f0f0f] hover:text-white"
                  }`}
                >
                  <div className="flex items-center gap-2.5">
                    <span>✓</span>
                    <span>Postados</span>
                  </div>
                  <span
                    className={`text-[11px] px-2 py-0.5 rounded-full font-black ${
                      activeTab === "postados"
                        ? "bg-white/25 text-white"
                        : "bg-[#141414] text-zinc-400 border border-[#222]"
                    }`}
                  >
                    {postedVideos.length}
                  </span>
                </button>
              </nav>
            </div>

            {/* Sidebar Actions & Backup */}
            <div className="pt-4 border-t border-[#141414] mt-6 space-y-2">
              <button
                onClick={addNewVideo}
                className="w-full flex items-center justify-center gap-2 bg-[#ff0000] hover:bg-[#e60000] text-white text-xs font-black py-2.5 px-3 rounded-xl shadow-md transition active:scale-95"
              >
                <span className="text-sm font-black">＋</span>
                <span>Novo Projeto</span>
              </button>

              <div className="flex items-center gap-1.5 pt-1">
                <button
                  type="button"
                  onClick={exportBackup}
                  className="flex-1 text-[11px] font-bold text-zinc-400 hover:text-white bg-[#0a0a0a] hover:bg-[#141414] border border-[#1f1f1f] py-1.5 px-1 rounded-lg transition text-center"
                  title="Salvar backup em arquivo JSON"
                >
                  💾 Salvar
                </button>
                <label
                  className="flex-1 text-[11px] font-bold text-zinc-400 hover:text-white bg-[#0a0a0a] hover:bg-[#141414] border border-[#1f1f1f] py-1.5 px-1 rounded-lg transition text-center cursor-pointer"
                  title="Restaurar backup existente"
                >
                  📥 Carregar
                  <input
                    type="file"
                    accept=".json"
                    onChange={importBackup}
                    className="hidden"
                  />
                </label>
              </div>
            </div>
          </aside>

          {/* 2. ÁREA DOS VÍDEOS: PRETO PROFUNDO (OLED BLACK #000000) */}
          <main className="flex-1 flex flex-col min-w-0 p-4 sm:p-6 lg:p-7 space-y-5 overflow-y-auto bg-[#000000]">
            {/* Minimalist Studio Sub-Header */}
            <div className="flex items-center justify-between pb-1">
              <div className="flex items-center gap-3">
                <h2 className="text-base font-black text-white tracking-tight">
                  {activeTab === "producao" ? "Vídeos em Produção" : "Vídeos Postados"}
                </h2>
                <span className="text-[11px] font-extrabold text-zinc-400 bg-[#0d0d0d] border border-[#1f1f1f] px-2.5 py-0.5 rounded-full">
                  {displayedVideos.length} {displayedVideos.length === 1 ? "projeto" : "projetos"}
                </span>
              </div>

              <button
                onClick={addNewVideo}
                className="flex items-center gap-1.5 bg-[#ff0000] hover:bg-[#e60000] text-white text-xs font-black px-3 py-1.5 rounded-lg shadow-sm transition active:scale-95"
              >
                <span>＋</span>
                <span>Adicionar Vídeo</span>
              </button>
            </div>

            {/* Video Projects List */}
            {displayedVideos.length === 0 ? (
              <div className="text-center py-20 bg-[#080808] rounded-2xl border border-[#171717] p-8">
                <span className="text-3xl block mb-3 opacity-60">🎬</span>
                <p className="text-zinc-500 text-sm mb-4 font-semibold">
                  {activeTab === "producao"
                    ? "Nenhum vídeo em produção no momento."
                    : "Nenhum vídeo marcado como postado."}
                </p>
                {activeTab === "producao" && (
                  <button
                    onClick={addNewVideo}
                    className="bg-[#ff0000] hover:bg-[#e60000] text-white text-xs font-black px-4 py-2 rounded-xl transition active:scale-95"
                  >
                    ＋ Criar Primeiro Vídeo
                  </button>
                )}
              </div>
            ) : (
              <div className="space-y-5">
                {displayedVideos.map((video) => {
                  const dayInfo = calculatePostDayInfo(video.weekday, video.isNextWeek);

                  const deliveredCount =
                    (video.nandoSim ? 1 : 0) +
                    (video.dudaSim ? 1 : 0) +
                    (video.sonoraSim ? 1 : 0);
                  const is100Percent = deliveredCount === 3;

                  return (
                    <section
                      key={video.id}
                      className="bg-[#080808] rounded-2xl p-4 sm:p-5 border border-[#1a1a1a] shadow-2xl space-y-4"
                    >
                      {/* LAPIDATED CARD TOOLBAR */}
                      <div className="flex items-center justify-between gap-3 pb-3 border-b border-[#141414] flex-wrap">
                        {/* Left: Weekday Selector + Clean Minimal Date Text */}
                        <div className="flex items-center gap-3 flex-wrap">
                          {/* Weekdays */}
                          <div className="flex items-center gap-0.5 bg-[#030303] p-1 rounded-lg border border-[#1a1a1a]">
                            {WEEKDAYS.map((w) => {
                              const isSelected = video.weekday === w.day;
                              return (
                                <button
                                  key={w.day}
                                  type="button"
                                  onClick={() => handleWeekdayClick(video.id, w.day)}
                                  className={`px-2.5 py-1 rounded-md text-xs font-black transition active:scale-95 flex items-center gap-1 ${
                                    isSelected
                                      ? "bg-[#ff0000] text-white shadow-sm"
                                      : "text-zinc-500 hover:text-zinc-200 hover:bg-[#121212]"
                                  }`}
                                  title={
                                    isSelected
                                      ? video.isNextWeek
                                        ? "Próxima semana selecionada"
                                        : "Esta semana selecionada"
                                      : `Postar na ${w.name}`
                                  }
                                >
                                  <span>{w.label}</span>
                                  {isSelected && video.isNextWeek && (
                                    <span className="text-[8px] bg-white/30 text-white px-1 rounded-full font-black">
                                      +1
                                    </span>
                                  )}
                                </button>
                              );
                            })}
                          </div>

                          {/* Clean Date Info */}
                          <div className="flex items-center gap-2 text-xs font-bold text-zinc-400">
                            <span className="text-zinc-200 font-extrabold">
                              {dayInfo.displayDay} ({dayInfo.formattedDate})
                            </span>
                            <span className="text-zinc-700">•</span>
                            <span className={dayInfo.badgeColor}>
                              {dayInfo.countdownText}
                            </span>
                          </div>
                        </div>

                        {/* Middle / Right: Equipe (Nando, Duda, Sonora) in sleek studio design */}
                        <div className="flex items-center gap-2 flex-wrap">
                          <div className="flex items-center gap-1.5 bg-[#030303] border border-[#1a1a1a] p-1 rounded-lg">
                            <span className="text-[10px] font-black uppercase tracking-wider text-zinc-500 px-1.5">
                              Status:
                            </span>

                            {/* Nando Toggle */}
                            <button
                              type="button"
                              onClick={() => toggleProcess(video.id, "nandoSim")}
                              className={`px-2.5 py-1 rounded-md text-[11px] font-black transition active:scale-95 flex items-center gap-1 border ${
                                video.nandoSim
                                  ? "bg-emerald-950/80 text-emerald-400 border-emerald-800/80 shadow-2xs"
                                  : "bg-red-950/40 text-red-400 border-red-900/60 hover:bg-red-950/70"
                              }`}
                              title="Alternar entrega de Nando"
                            >
                              <span>Nando</span>
                              <span>{video.nandoSim ? "✓" : "✕"}</span>
                            </button>

                            {/* Duda Toggle */}
                            <button
                              type="button"
                              onClick={() => toggleProcess(video.id, "dudaSim")}
                              className={`px-2.5 py-1 rounded-md text-[11px] font-black transition active:scale-95 flex items-center gap-1 border ${
                                video.dudaSim
                                  ? "bg-emerald-950/80 text-emerald-400 border-emerald-800/80 shadow-2xs"
                                  : "bg-red-950/40 text-red-400 border-red-900/60 hover:bg-red-950/70"
                              }`}
                              title="Alternar entrega de Duda"
                            >
                              <span>Duda</span>
                              <span>{video.dudaSim ? "✓" : "✕"}</span>
                            </button>

                            {/* Sonora Toggle */}
                            <button
                              type="button"
                              onClick={() => toggleProcess(video.id, "sonoraSim")}
                              className={`px-2.5 py-1 rounded-md text-[11px] font-black transition active:scale-95 flex items-center gap-1 border ${
                                video.sonoraSim
                                  ? "bg-emerald-950/80 text-emerald-400 border-emerald-800/80 shadow-2xs"
                                  : "bg-red-950/40 text-red-400 border-red-900/60 hover:bg-red-950/70"
                              }`}
                              title="Alternar entrega da Sonora"
                            >
                              <span>Sonora</span>
                              <span>{video.sonoraSim ? "✓" : "✕"}</span>
                            </button>
                          </div>

                          {/* 100% Ready Tag */}
                          {is100Percent && (
                            <span className="flex items-center gap-1 text-[10px] font-black bg-emerald-950/90 text-emerald-400 border border-emerald-800 px-2 py-1 rounded-lg animate-pulse">
                              ✨ 100% PRONTO
                            </span>
                          )}

                          {/* Action Buttons */}
                          <div className="flex items-center gap-1.5 pl-1">
                            {!video.posted ? (
                              <button
                                type="button"
                                onClick={() => markAsPosted(video.id)}
                                className={`text-xs font-black px-3.5 py-1.5 rounded-lg transition-all duration-200 active:scale-95 flex items-center gap-1.5 shadow-sm ${
                                  postingId === video.id
                                    ? "bg-[#10b981] text-white border border-[#10b981] scale-105 shadow-md shadow-emerald-500/30"
                                    : "bg-white hover:bg-zinc-200 text-zinc-950 border border-white"
                                }`}
                                title="Marcar como publicado no YouTube"
                              >
                                <span>✓</span>
                                <span>{postingId === video.id ? "Postado!" : "Vídeo Postado"}</span>
                              </button>
                            ) : (
                              <button
                                type="button"
                                onClick={() => restoreToProduction(video.id)}
                                className="bg-[#10b981] hover:bg-[#059669] text-white border border-[#10b981] text-xs font-black px-3.5 py-1.5 rounded-lg transition-all active:scale-95 flex items-center gap-1.5 shadow-sm"
                                title="Vídeo postado! (Clique para voltar a Em Produção)"
                              >
                                <span>✓</span>
                                <span>Postado (Voltar ↩)</span>
                              </button>
                            )}

                            <button
                              onClick={() => deleteVideo(video.id)}
                              className="text-zinc-600 hover:text-red-400 p-1.5 rounded-lg hover:bg-red-950/40 transition"
                              title="Excluir Projeto"
                            >
                              🗑️
                            </button>
                          </div>
                        </div>
                      </div>

                      {/* 3 Variations: 3 Thumbs + 3 BIG TITLES */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                        {[0, 1, 2].map((idx) => {
                          const thumb = video.thumbs[idx];
                          const title = video.titles[idx];
                          const titleLength = title.length;

                          return (
                            <div
                              key={idx}
                              className="flex flex-col space-y-2.5 bg-[#030303] p-3 rounded-xl border border-[#141414]"
                            >
                              {/* Option Header + Mini 3-Segment Process Track */}
                              <div className="flex items-center justify-between">
                                <span className="text-[11px] font-black text-red-500 uppercase tracking-wider flex items-center gap-1.5">
                                  <span className="w-1.5 h-1.5 rounded-full bg-red-500 inline-block"></span>
                                  OPÇÃO {idx + 1}
                                </span>

                                <div
                                  className="flex items-center gap-1"
                                  title="Progresso das 3 etapas (Nando, Duda, Sonora)"
                                >
                                  <div
                                    className={`w-3.5 h-1 rounded-full ${
                                      video.nandoSim ? "bg-emerald-500" : "bg-red-500/60"
                                    }`}
                                    title="Nando"
                                  />
                                  <div
                                    className={`w-3.5 h-1 rounded-full ${
                                      video.dudaSim ? "bg-emerald-500" : "bg-red-500/60"
                                    }`}
                                    title="Duda"
                                  />
                                  <div
                                    className={`w-3.5 h-1 rounded-full ${
                                      video.sonoraSim ? "bg-emerald-500" : "bg-red-500/60"
                                    }`}
                                    title="Sonora"
                                  />
                                </div>
                              </div>

                              {/* 16:9 Cinema Thumbnail Frame */}
                              <div
                                className={`relative rounded-lg overflow-hidden cursor-pointer group aspect-video transition duration-200 flex items-center justify-center ${
                                  thumb
                                    ? is100Percent
                                      ? "bg-black border border-emerald-600 shadow-[0_0_12px_rgba(16,185,129,0.2)]"
                                      : "bg-black border border-[#1c1c1c] hover:border-red-600/70"
                                    : "bg-white border-2 border-white shadow-md hover:opacity-95"
                                }`}
                                onClick={() =>
                                  document.getElementById(`yt-v13-${video.id}-${idx}`)?.click()
                                }
                              >
                                {thumb ? (
                                  <img
                                    src={thumb}
                                    alt={`Opção ${idx + 1}`}
                                    className="w-full h-full object-cover transition duration-300 group-hover:scale-105"
                                  />
                                ) : (
                                  <div className="w-full h-full bg-white flex flex-col items-center justify-center p-3 text-zinc-950 transition">
                                    <span className="text-2xl mb-1 text-zinc-800 opacity-80 group-hover:opacity-100 group-hover:scale-110 transition">📁</span>
                                    <span className="text-xs font-black tracking-tight text-zinc-900 uppercase">
                                      Subir Thumbnail
                                    </span>
                                    <span className="text-[10px] text-zinc-500 font-bold">
                                      16:9
                                    </span>
                                  </div>
                                )}

                                {thumb && (
                                  <div className="absolute inset-0 bg-black/65 opacity-0 group-hover:opacity-100 flex items-center justify-center transition backdrop-blur-xs">
                                    <span className="text-xs font-black text-white bg-red-600 px-3 py-1.5 rounded-lg shadow-md">
                                      Trocar Thumbnail
                                    </span>
                                  </div>
                                )}

                                <input
                                  id={`yt-v13-${video.id}-${idx}`}
                                  type="file"
                                  accept="image/*"
                                  className="hidden"
                                  onChange={(e) => {
                                    const f = e.target.files?.[0];
                                    if (f) updateThumb(video.id, idx, f);
                                  }}
                                />
                              </div>

                              {thumb && (
                                <div className="flex justify-end">
                                  <button
                                    onClick={() => removeThumb(video.id, idx)}
                                    className="text-[10px] font-bold text-zinc-600 hover:text-red-400 transition"
                                  >
                                    Remover foto
                                  </button>
                                </div>
                              )}

                              {/* BIG TITLES */}
                              <div className="space-y-1 pt-0.5">
                                <div className="flex items-center justify-between text-[10px] text-zinc-500 font-bold">
                                  <span>Título do Vídeo:</span>
                                  <span
                                    className={
                                      titleLength > 90
                                        ? "text-red-400 font-black"
                                        : "text-zinc-600"
                                    }
                                  >
                                    {titleLength} / 100
                                  </span>
                                </div>

                                <textarea
                                  rows={3}
                                  value={title}
                                  onChange={(e) => updateTitle(video.id, idx, e.target.value)}
                                  placeholder={`Título em destaque para a Opção ${idx + 1}...`}
                                  className="w-full bg-[#050505] hover:bg-[#0a0a0a] focus:bg-[#0a0a0a] border border-[#1a1a1a] focus:border-[#ff0000] focus:ring-1 focus:ring-red-500/25 text-base sm:text-lg font-black text-white p-3 rounded-lg focus:outline-none resize-none transition leading-snug placeholder:text-zinc-700 placeholder:font-normal"
                                />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </section>
                  );
                })}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
